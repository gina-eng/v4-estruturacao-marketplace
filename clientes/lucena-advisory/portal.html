É exatamente onde a Lucena pode se posicionar, alavancando a formação tripla do Aldo.","crowded_spaces":"O quadrante 'Generalista técnico de engenharia' está lotado (Moura, Aurora, Ocidental, Protege e parcialmente FRTB/Norte). Competir ali é guerra de preço contra MEs estabelecidas — território a evitar."},"trends":[{"trend":"Nova Lei Geral do Licenciamento Ambiental (Lei 15.190/2025) reaquece o mercado","evidence":"Sancionada em ago/2025 e em vigor desde 04/02/2026, é o primeiro marco federal unificado: cria/sistematiza modalidades (LP, LI, LO, LAU, LAC, LOC, LAE). Toda a base de empresas precisa reentender seu enquadramento — onda de demanda por advisory. Fontes: ConJur (https://www.conjur.com.br/2026-fev-03/novas-licencas-ambientais-e-hipoteses-de-dispensa-a-partir-do-marco-legal-do-licenciamento/), Manucci Law."},{"trend":"Investimento recorde no Polo Industrial de Manaus impulsiona licenciamento novo","evidence":"Em 2025 o CODAM aprovou 320 projetos, R$ 7,96 bi em investimentos e +9.000 empregos projetados; indústrias do PIM já lideram ~30% das licenças do IPAAM. Cada nova planta exige licenciamento trifásico (LP/LI/LO). Fonte: gov.am e TV Encontro das Águas."},{"trend":"ESG e exigências de cadeia de fornecedores empurram PMEs à regularização","evidence":"O subsetor de ESG cresce a CAGR ~24,8% (Mordor), e grandes empresas passam a exigir conformidade ambiental de fornecedores — ampliando a base de PMEs que precisam se regularizar. Fonte: GreenView (https://greenviewgv.com.br/tendencias-de-mercado-em-consultoria-ambiental-para-2025/), Mordor Intelligence."},{"trend":"Setor digitalmente imaturo — janela de diferenciação por conteúdo/SEO","evidence":"Pesquisa direta (jun/2026): de 43+ consultorias em Manaus, só FRTB e Norte Ambiental fazem marketing de conteúdo; nenhuma anuncia no Google Ads (leilão vazio); diretórios (Econodata, CNPJ.biz) dominam o orgânico — ninguém ocupa o SEO próprio. Espaço aberto para quem produzir conteúdo de qualidade."}],"threats":[{"threat":"Renovação automática de Licença de Operação via IA do IPAAM (IN 001/2026)","potential_impact":"Lançada em fev/2026 para 21 atividades industriais com SGA, reduz a fricção (e a receita) de renovação repetitiva. Parte do trabalho transacional de renovação que sustenta consultorias pode encolher nos próximos 12 meses — empurrando o valor para licenciamento novo, estudos complexos e advisory de enquadramento."},{"threat":"Modalidade LAC (Licença por Adesão e Compromisso) simplifica baixo impacto","potential_impact":"A LAC, da nova lei, permite licenciamento por autodeclaração para atividades de baixo-médio impacto, reduzindo a necessidade de intermediação em parte do mercado de menor complexidade. Ameaça os serviços de menor ticket; reforça a necessidade de a Lucena focar em complexidade e recorrência."},{"threat":"Concorrentes digitalmente maduros (FRTB, Norte) podem ocupar o SEO/conteúdo primeiro","potential_impact":"FRTB já rankeia para termos locais e usa o discurso de 'segurança jurídica'. Se FRTB ou Norte acelerarem conteúdo sobre a Lei 15.190/2025 e busca local antes da Lucena, a janela de pioneirismo digital fecha e a Lucena passa a correr atrás de posição cumulativa (ranking, backlinks, reviews)."}],"unexploited_opportunity":{"description":"Ocupar o território \"A advisory de licenciamento ambiental do Amazonas que une direito + engenharia e domina a nova Lei 15.190/2025\" — um posicionamento que cruza autoridade jurídica forte, competência técnica de engenharia e presença digital de conteúdo, ancorado no rosto e nas credenciais do Aldo. Concretamente: dominar a busca local (GMB) e produzir o conteúdo de referência sobre a nova lei e a modalidade LAC, que está quente e quase sem concorrência de conteúdo.","why_nobody_does_it":"(1) A maioria dos concorrentes é de engenheiros ambientais, sem a perna jurídica forte (advogado + mestre em direito ambiental) que sustente o ângulo 'advisory jurídica'. (2) Os dois players digitalmente maduros (FRTB e Norte Ambiental) focam em conteúdo técnico/operacional e ainda não ocuparam o discurso da nova lei nem da LAC. (3) O mercado é fragmentado e regional, com baixíssima cultura de marketing — ninguém investiu em construir uma marca de autoridade pessoal no nicho.","feasibility":"alta"},"market_jtbd":{"current_solutions":"A maioria das empresas resolve contratando uma consultoria ambiental técnica (em geral de engenheiros) por projeto/exigência, ou tentando resolver internamente — com um engenheiro próprio, o contador, ou um 'contato' no órgão. O processo costuma ser reativo: corre-se atrás quando chega a notificação.","alternatives":[{"type":"direct","description":"Outras consultorias ambientais da praça (FRTB, Moura, Aurora, Ocidental, Protege, Norte) — a maioria com foco técnico de engenharia."},{"type":"indirect","description":"Contratar engenheiro ambiental E advogado separadamente, com custo e ruído de coordenação; ou usar o contador para 'dar um jeito' burocrático."},{"type":"diy","description":"Tentar protocolar e responder às exigências sozinho junto ao IPAAM/SEMMAS — viável só para casos simples, com alto risco de erro de enquadramento na nova lei."},{"type":"inaction","description":"Adiar a regularização até receber uma exigência, multa ou embargo — a 'solução' mais comum e a mais cara."}],"cost_of_inaction":"Embargo e paralisação da operação, multas, perda de contratos e licitações que exigem regularidade ambiental, e responsabilização (inclusive criminal) dos gestores. Para empresas com ativos relevantes, o custo de não regularizar supera em muito o da consultoria — é o argumento central de venda da Lucena."},"real_differentials":[{"differential":"Formação tripla do decisor numa só pessoa: advogado + engenheiro ambiental + mestre em direito ambiental, com 10+ anos de mercado","status":"confirmed","icp_relevance":"Responde diretamente à dor do ICP de 'preciso de quem entenda o direito E a engenharia' — elimina o ruído de coordenar engenheiro + advogado separados e dá segurança jurídica real, não só técnica. Nenhum concorrente nomeado tem essa combinação numa só pessoa."},{"differential":"Track record e acesso ao grupo Rei dos Bons Amigos (26 CNPJs, R$ 300M+/ano)","status":"confirmed","icp_relevance":"Prova social poderosa para o ICP B2B de grande porte: atender um conglomerado desse porte é credencial que reduz o risco percebido de contratar uma empresa nova. Base para case e para ABM de expansão.","action_needed":"Documentar o case (com autorização) e transformá-lo em prova social na LP, GMB e propostas."},{"differential":"Autoridade em licenciamento na nova Lei 15.190/2025 e na modalidade LAC","status":"potential","icp_relevance":"Tema novo, quente e gerador de insegurança em toda a base B2B — quem dominar o discurso primeiro vira a referência consultada. Gancho de aquisição inbound de alta intenção.","action_needed":"Produzir conteúdo (LinkedIn, blog, GMB) e um serviço de 'diagnóstico de enquadramento na nova lei' como isca de aquisição."},{"differential":"Solução integrada licenciamento + compliance + SST com time multidisciplinar","status":"potential","icp_relevance":"Permite ser o fornecedor único de toda a conformidade ambiental e de segurança — aumenta ticket e LTV e responde ao desejo do gestor de não ter que coordenar vários fornecedores.","action_needed":"Empacotar e precificar a oferta integrada com a entrada dos novos sócios (engenharia de segurança, direito administrativo)."},{"differential":"Ser a marca digital de referência do nicho ambiental no AM","status":"aspirational","icp_relevance":"O setor é digitalmente fraco; ser a marca mais visível e crível no digital captura o lead que pesquisa antes de pedir indicação — hoje 100% perdido.","action_needed":"Construir e manter consistentemente site/LP + SEO + GMB + LinkedIn (S3 em diante). É aspiracional até haver consistência de produção."}],"market_share":{"current_revenue_brl":252000,"current_share_of_sam_pct":0.21,"target_share_of_sam_pct":2.5,"gap_to_som_brl":2748000,"gap_to_som_pct":1090,"commentary":"A Lucena captura hoje ~0,21% do SAM estimado (R$ 252k de ~R$ 120M). O SOM de mercado (~R$ 3M, 2,5% do SAM) representa um teto ~11x acima do faturamento atual — confirmando que NÃO há restrição de tamanho de mercado. O fator limitante é interno (capacidade de entrega e máquina de aquisição), não a demanda. Em um mercado fragmentado e digitalmente fraco, ganhar share via presença digital + ABM na âncora é factível; o desafio é escalar a operação sem depender só do Aldo.","client_annual_revenue_goal_brl":600000,"client_annual_revenue_goal_source":"Call de vendas SDR (2026-04-28) — meta declarada de R$ 50.000/mês em 6 meses (≈ R$ 600.000/ano). Adotada como meta operacional de trabalho, a confirmar no Kick-Off.","client_goal_vs_som_note":"Há DUAS metas em fontes distintas: (1) V4MOS = R$ 100.000 em 12 meses — provável erro de preenchimento, pois fica abaixo do run-rate atual de ~R$ 252k/ano; (2) Call SDR = R$ 50k/mês em 6 meses ≈ R$ 600k/ano. Ambas são metas operacionais (aspiração de curto prazo), distintas do SOM (~R$ 3M, teto de mercado de médio/longo prazo). A meta de R$ 600k equivale a ~0,5% do SAM e ~20% do SOM — agressiva no curto prazo (2,4x o atual em 6 meses) mas pequena diante do potencial de mercado. Resolver qual é a meta verdadeira no Kick-Off é pré-requisito para o forecast (S3).","enderecavel_value_brl":45000000,"enderecavel_composition":"Subset do SAM onde a oferta da Lucena é mais relevante: B2B com licenciamento complexo + recorrência (gestão ambiental, compliance, SST), estimado em ~R$ 45M [E] — o que sobra do SAM de R$ 120M depois de excluir a microdemanda pontual de baixo impacto (cada vez mais autosserviço via LAC) e os serviços puramente operacionais (coleta de resíduos, análises de laboratório) que não são o foco da Lucena.","enderecavel_note":"O SAM de R$ 120M tem perfis heterogêneos: de microempresas que precisam de uma única LAU de baixo impacto (cada vez mais resolvidas por autosserviço com a LAC) a grandes indústrias com licenciamento complexo e recorrente. A Lucena escolhe, por estratégia, NÃO perseguir o transacional de baixo valor — foca no licenciamento complexo, recorrência e advisory jurídico-técnico (~R$ 45M endereçáveis). Por isso o SOM (~R$ 3M) não é uma fatia do SAM inteiro: primeiro há a barreira de ESCOLHA (SAM → endereçável, ~R$ 45M, decisão de perfil) e só depois a barreira COMPETITIVA (endereçável → SOM, ~R$ 3M, dinâmica de mercado e capacidade)."},"honesty_alert":"Três ressalvas honestas. (1) O diferencial real mais forte (formação tripla) é PESSOAL do Aldo, não institucional — concentra valor e risco na pessoa dele (mesmo bus factor apontado na SWOT). A estratégia deve transformar parte dessa autoridade pessoal em ativo de marca (conteúdo, processo, equipe) para que a Lucena não seja 'só o Aldo'. (2) O sizing TAM/SAM/SOM é majoritariamente estimado [E]: não existe número público isolado para consultoria ambiental no Amazonas/Norte. Os valores foram triangulados a partir de proxies (mercado global, nº de consultorias locais, demanda do PIM) e devem ser lidos como ORDEM DE GRANDEZA, não precisão contábil. (3) Os scores digitais e preços dos concorrentes são direcionais — números de seguidores de Instagram e notas de reviews do GMB não foram verificáveis via web e devem ser conferidos manualmente antes de citados ao cliente como dado fechado."},"ee-s2-posicionamento":{"client_name":"Lucena Advisory","skill":"ee-s2-posicionamento","version":1,"generated_at":"2026-06-19T00:00:00Z","completed_at":"2026-06-19T00:00:00Z","data_source":"mixed","summary":"A Lucena Advisory ocupa o território 'Blindagem · Autoridade · Advisory': a única assessoria ambiental do Amazonas onde o advogado e o engenheiro são a mesma autoridade (Aldo — advogado + engenheiro ambiental + mestre em direito ambiental). A PUV ataca o flanco do líder digital FRTB, que promete 'segurança jurídica' sendo uma casa de engenharia, sem lastro jurídico. PUV: 'A única assessoria ambiental do AM onde o advogado e o engenheiro são a mesma pessoa — para blindar sua operação, não só tirar a licença.' Tagline recomendada: 'Licenciamento ambiental com a lei do seu lado.'","summary_headline":"Lucena Advisory ocupa o território 'Blindagem · Autoridade · Advisory': a única assessoria do AM onde advogado e engenheiro são a mesma pessoa — ataca o flanco do FRTB, que promete jurídico mas é casa de engenharia.","summary_highlights":[{"category":"posicao","label":"Território de marca","value":"Blindagem · Autoridade · Advisory","subtext":"Jurídico real + engenharia + parceria estratégica","tone":"blue"},{"category":"competicao","label":"Flanco do líder digital","value":"FRTB sem lastro","subtext":"Promete 'segurança jurídica' sendo casa de engenharia","tone":"yellow"},{"category":"oportunidade","label":"PUV / diferencial","value":"Advogado = engenheiro","subtext":"A mesma autoridade nos dois lados — ninguém mais tem","tone":"green"},{"category":"janela","label":"Gancho de entrada","value":"Lei 15.190/2025","subtext":"Reenquadramento aquece a demanda agora","tone":"green"},{"category":"risco","label":"Dependência","value":"Autoridade do Aldo","subtext":"Posicionamento ancorado numa pessoa — precisa virar marca","tone":"red"}],"summary_key_findings":[{"category":"vantagem","text":"O território 'advisory jurídico-técnico + autoridade' está vazio e a Lucena tem o único ativo que o preenche de verdade: o Aldo é, numa só pessoa, advogado, engenheiro ambiental e mestre em direito ambiental. Isso ataca diretamente o flanco do FRTB (líder digital), que reivindica 'segurança jurídica' na tagline mas é uma casa de engenheiras — promessa sem lastro que a Lucena pode cumprir."},{"category":"contexto","text":"O setor inteiro é 'casa de engenharia' competindo em execução técnica. Por isso o preço da Lucena é posicionado como premium e ancorado no custo do risco evitado (embargo, multa, operação parada), não no custo do serviço. O tom é de autoridade que descomplica — técnico mas acessível ao gestor leigo."},{"category":"acao","text":"TODA a produção da S3 (identidade visual, landing page, copy, criativos, manual de marca) deve nascer deste território. O canal é ABM B2B + busca local (GMB/SEO) + LinkedIn de autoridade — nunca Instagram como canal principal. O gancho de aquisição imediato é o conteúdo sobre a Lei 15.190/2025 e o 'diagnóstico de enquadramento'."},{"category":"ameaca","text":"O posicionamento depende da autoridade PESSOAL do Aldo (bus factor) e parte do território ('segurança/blindagem') já é alegado pelo FRTB, que tem vantagem de audiência digital. A janela é de pioneirismo: a Lucena precisa transferir essa autoridade pessoal para a marca e ocupar o discurso jurídico rápido, antes que o concorrente o plante primeiro."}],"positioning_map":{"axis_x":"Casa de engenharia (execução técnica) ←→ Advisory jurídico-técnico (estratégia + direito)","axis_y":"Commodity / preço ←→ Premium / autoridade","client_position":"Advisory jurídico-técnico + Premium/autoridade (quadrante superior direito — vazio)","justification":"O quadrante 'advisory jurídico-técnico premium' está vazio porque exige uma credencial que nenhum concorrente do AM tem: autoridade jurídica forte (advogado + mestre em direito ambiental) somada à engenharia, numa marca de autoridade. A Lucena é a única que pode ocupá-lo com lastro real — o FRTB chega perto pela autoridade digital, mas pelo eixo X continua sendo casa de engenharia.","competitor_positions":[{"name":"FRTB Consultoria Ambiental","quadrant":"Casa de engenharia + Premium/autoridade (alta autoridade digital, mas sem perna jurídica real)"},{"name":"Norte Ambiental","quadrant":"Casa de engenharia + Premium operacional (autoridade em resíduos)"},{"name":"Protege Engenharia","quadrant":"Casa de engenharia + Premium por tradição (25+ anos)"},{"name":"Moura Ambiental","quadrant":"Casa de engenharia + Commodity/preço (mineração/cursos)"},{"name":"Aurora Ambiental","quadrant":"Casa de engenharia + Commodity/preço"},{"name":"Ocidental Consultoria","quadrant":"Casa de engenharia + Commodity/preço"},{"name":"Lucena Advisory (alvo)","quadrant":"Advisory jurídico-técnico + Premium/autoridade (vazio)"}]},"positioning_statements":[{"label":"A Advisory Jurídico-Técnica (RECOMENDADA)","statement":"Para empresas industriais e comerciais do Amazonas que não podem parar, a Lucena Advisory é a assessoria de licenciamento que blinda juridicamente a sua operação, porque une, numa só autoridade, o advogado, o engenheiro ambiental e o mestre em direito ambiental que decifram a lei e destravam o processo.","justification":"Ancora no diferencial real e não-copiável (fusão direito + engenharia numa pessoa) e ataca o flanco do líder digital (FRTB), que promete jurídico sendo casa de engenharia. É o posicionamento permanente, sustentável e diferenciado.","bet":"Prioriza o diferencial não-copiável e o ângulo advisory (estratégia, não despacho). Aposta que 'blindagem jurídica real' é mais forte e defensável que 'mais uma consultoria técnica'.","risk":"Depende da autoridade pessoal do Aldo (bus factor) e exige bancar a promessa jurídica com consistência e prova. Se o Aldo não estiver presente, a promessa fragiliza."},{"label":"O Especialista em Blindagem de Risco","statement":"Para o gestor que teme embargo e multa, a Lucena Advisory é a consultoria que transforma a burocracia ambiental em tranquilidade operacional, porque assume o risco regulatório de ponta a ponta com segurança jurídica real.","justification":"Vai direto na dor emocional da persona (medo de embargo) e no resultado (tranquilidade). Forte para conversão.","bet":"Prioriza a dor e o resultado emocional. Aposta no apelo direto ao gestor pragmático.","risk":"O território 'segurança/continuidade operacional' é parcialmente reivindicado pelo FRTB na tagline — entrar por aqui é competir num discurso que o líder digital já plantou, com menos diferenciação."},{"label":"O Decodificador da Nova Lei","statement":"Para empresas que precisam se reenquadrar na nova Lei 15.190/2025, a Lucena Advisory é a autoridade que traduz o marco legal em ação, porque domina jurídica e tecnicamente as novas modalidades de licenciamento (LAC, LO, LAU).","justification":"Aproveita a janela quente e atual da nova lei como gancho de aquisição de alta intenção; muito específico e oportuno.","bet":"Prioriza o timing regulatório como ímã de inbound. Aposta na urgência e na escassez de quem domina a lei nova.","risk":"É um gancho temporal — a novidade da lei passa. Estreito demais como posicionamento permanente; melhor como campanha de ENTRADA dentro do posicionamento A, não como identidade da marca."}],"chosen_statement":"Para empresas industriais e comerciais do Amazonas que não podem parar, a Lucena Advisory é a assessoria de licenciamento que blinda juridicamente a sua operação, porque une, numa só autoridade, o advogado, o engenheiro ambiental e o mestre em direito ambiental que decifram a lei e destravam o processo.","puv":"A única assessoria ambiental do Amazonas onde o advogado e o engenheiro são a mesma pessoa — para blindar sua operação, não só tirar a licença.","canvas_4p":{"product":{"delivers":"Blindagem jurídico-técnica da operação: diagnóstico de risco regulatório, licenciamento (LP/LI/LO/LAU/LAC), elaboração de estudos e pareceres, resposta a exigências e gestão contínua de conformidade — tudo conduzido por quem domina o direito E a engenharia ambiental, com a entrada de compliance e SST.","transformation":"Antes: gestor reativo, com medo de fiscalização, dependente de 'contatos' e coordenando engenheiro e advogado separados, sem saber em que pé está cada processo. Depois: operação regularizada e previsível, com um único responsável que decifra a lei, responde pelo resultado e o mantém informado — o gestor volta a focar na operação, em paz.","doesnt_deliver":"Não é despachante de protocolo barato, não 'agiliza por fora' nem ajuda a burlar o órgão, e não tem como foco a microdemanda pontual de mínimo impacto (cada vez mais resolvível por autosserviço via LAC). Não executa obras de engenharia ambiental (ex: construção de ETE) — projeta, assessora e responde tecnicamente, mas a execução física é de terceiros."},"price":{"positioning":"premium","justification":"Posicionar acima da média dos generalistas (MEs) porque entrega segurança jurídica real (não só técnica) e assume o risco do enquadramento. A comunicação nunca discute o preço do serviço isolado — ancora sempre no custo de NÃO fazer: embargo, multa e operação parada.","anchoring":"Ancoragem pelo custo do risco evitado: 'quanto custa um dia da sua operação embargada?'. Diante da exposição (faturamento parado + multa), o ticket de consultoria torna-se pequeno. Para projetos, ancorar no valor do empreendimento viabilizado."},"place":{"main_channel":"ABM / relacionamento B2B direto — expansão dentro da âncora Rei dos Bons Amigos (26 CNPJs) + prospecção dirigida a indústria do PIM, postos e estaleiros — somado à busca local de alta intenção (Google Meu Negócio + SEO 'licenciamento ambiental Manaus').","main_channel_justification":"O ICP decide em comitê, por risco, e 'não está nas redes sociais' (declarado pelo Aldo). ABM bate direto no comitê de compra com relacionamento; a busca local captura quem pesquisa no momento da exigência. Mídia de interrupção social não atinge esse decisor.","support_channel":"LinkedIn de autoridade do Aldo (conteúdo técnico-jurídico) + conteúdo sobre a Lei 15.190/2025 e a modalidade LAC como ímã de inbound qualificado.","avoid_channels":[{"channel":"Instagram orgânico/Ads como canal principal","reason":"O ICP B2B industrial não compra licenciamento por Instagram. Serve, no máximo, como vitrine institucional secundária — nunca como canal de aquisição central."},{"channel":"TikTok","reason":"Público e formato incompatíveis com uma decisão B2B de alto risco e ciclo consultivo."},{"channel":"Mídia paga ampla de topo de funil","reason":"Desperdício enquanto não existe alicerce de conversão (LP, CRM). A decisão entre Google Ads de nicho (leilão vazio) vs LDR/prospector deve sair do diagnóstico de mídia, não da inércia de playbook."}]},"promotion":{"tone":"Autoridade que descomplica: técnico e preciso, mas acessível ao gestor leigo; pragmático, direto e tranquilizador. Nunca jocoso, sensacionalista, genérico ('mais uma consultoria') nem cheio de jargão jurídico que afaste.","top_funnel_message":"O que muda para a sua empresa com a nova Lei do Licenciamento (15.190/2025)? Descubra em qual modalidade a sua operação se enquadra agora — e o que isso significa de risco e de economia.","bottom_funnel_message":"Faça um diagnóstico de risco da sua operação com quem é advogado E engenheiro ambiental. Se estiver tudo certo, você fica tranquilo. Se não, a gente age antes de virar multa ou embargo."}},"brand_territory":{"three_words":["Blindagem","Autoridade","Advisory"],"description":"A Lucena protege a operação do cliente — blindagem jurídico-técnica contra o risco regulatório — sustentada na autoridade rara do Aldo (advogado + engenheiro ambiental + mestre em direito ambiental) e entregue como advisory: parceria estratégica que pensa o negócio do cliente, não despachante que apenas protocola. As três palavras traduzem o que a marca faz (blinda), por que pode prometer (autoridade) e como se relaciona (advisory — o próprio nome).","competitor_territories":[{"competitor":"FRTB Consultoria Ambiental","territory":"'Segurança jurídica e continuidade operacional' — mas via engenharia, sem lastro jurídico real"},{"competitor":"Norte Ambiental","territory":"'Sua jornada sustentável' / especialista em resíduos perigosos no Norte"},{"competitor":"Moura Ambiental","territory":"Pioneirismo e licenciamento mineral / treinamentos"},{"competitor":"Aurora Ambiental","territory":"'Viva Melhor' — institucional genérico, sem diferencial articulado"},{"competitor":"GMAIA Licenciamentos","territory":"'Deixe a burocracia com a gente' — nicho de licenciamento sanitário/saúde"},{"competitor":"Protege Engenhar function mt(val, label, color, tip) {
  const tipLookup = (typeof MT_TIPS !== 'undefined' && MT_TIPS) ? MT_TIPS[label] : null;
  const tipText = tip || tipLookup || '';
  const help = tipText ? '<span class="mt__help" tabindex="0" aria-label="Explicação">?<span class="mt__tip">'+E(tipText)+'</span></span>' : '';
  return '<div class="mt">'+help+'<div class="mt__val'+(color?' mt__val--'+color:'')+'">'+(typeof val==='number'?N(val):E(String(val)))+'</div><div class="mt__lbl">'+E(label)+'</div></div>';
}

function sm(text) { return '<div class="sum"><div class="sum__tag">Resumo</div><p class="sum__text">'+E(text)+'</p></div>'; }
function co(text) { return '<div class="co"><p>'+E(text)+'</p></div>'; }
function pb(val, color) { return '<div class="pb"><div class="pb__fill pb__fill--'+(color||'red')+'" style="width:'+Math.min(100,Math.max(0,val||0))+'%"></div></div>'; }

function cd(title, body, variant) {
  return '<div class="cd'+(variant?' cd--'+variant:'')+'">'
    +(title?'<div class="cd__title">'+E(title)+'</div>':'')
    +(body?'<div class="cd__body">'+body+'</div>':'')
    +'</div>';
}

function tb(heads, rows) {
  if (!rows || !rows.length) return '';
  return '<div class="tw"><table><thead><tr>'+heads.map(h=>'<th>'+E(h)+'</th>').join('')+'</tr></thead><tbody>'
    +rows.map(r=>'<tr>'+r.map(c=>'<td>'+(c!=null?String(c):'')+' </td>').join('')+'</tr>').join('')
    +'</tbody></table></div>';
}

function chatBubbles(msgs) {
  return '<div class="chat">'+msgs.map(m=>{
    const who = m.from||'sdr';
    return '<div class="chat__msg chat__msg--'+who+'"><div class="chat__who chat__who--'+who+'">'
      +E(m.name||who)+'</div>'+E(m.text)+'</div>';
  }).join('')+'</div>';
}

function checklist(items, statusKey) {
  return '<ul class="cl">'+items.map(it=>{
    const st = statusKey ? (it[statusKey]||'pending') : 'pending';
    const icons = {done:'&#10003;', pending:'&#9675;', blocked:'&#10007;', pass:'&#10003;', fail:'&#10007;', partial:'&#9679;'};
    const cls = {done:'done',pending:'pending',blocked:'blocked',pass:'done',fail:'blocked',partial:'pending'};
    return '<li><span class="cl__icon cl__icon--'+(cls[st]||'pending')+'">'+(icons[st]||'&#9675;')+'</span><span>'
      +(typeof it==='string'?E(it):E(it.item||it.test||it.action||''))+'</span></li>';
  }).join('')+'</ul>';
}

function sc(title, html) { return '<div class="sc"><h3>'+E(title)+'</h3>'+html+'</div>'; }

function renderGantt(actions) {
  if (!actions || !actions.length) return '';
  const maxWeek = Math.max(...actions.map(a => a.week_end || a.week_start || 1), 5);
  const LW = 33;
  const BW = ((100 - LW) / maxWeek).toFixed(2);
  const cols = LW + '% ' + Array(maxWeek).fill(BW + '%').join(' ');
  const IC = {alto:'var(--danger)',alto2:'var(--danger)','médio':'var(--warning)',medio:'var(--warning)',baixo:'#94a3b8'};
  const getColor = imp => IC[(imp||'baixo').toLowerCase().replace(/\u00e9/g,'e')] || '#94a3b8';

  let h = '<div style="margin-top:.25rem">';
  // Header row
  h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:.375rem">';
  h += '<div></div>';
  for (let w = 1; w <= maxWeek; w++) h += '<div style="font-size:.625rem;font-weight:700;text-align:center;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em">S'+w+'</div>';
  h += '</div>';

  // Group by track
  const tracks = [];
  actions.forEach(a => { const t = a.track || 'Geral'; if (!tracks.includes(t)) tracks.push(t); });

  tracks.forEach(track => {
    h += '<div style="font-size:.5625rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);padding:.5rem 0 .25rem;border-top:1px solid var(--border)">'+E(track)+'</div>';
    actions.filter(a => (a.track || 'Geral') === track).forEach(a => {
      const s = Math.max(1, a.week_start || 1);
      const e = Math.min(maxWeek, a.week_end || s);
      const color = getColor(a.impact);
      h += '<div style="display:grid;grid-template-columns:'+cols+';gap:2px;margin-bottom:3px;align-items:center">';
      h += '<div style="font-size:.7rem;color:var(--text-secondary);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:.375rem" title="'+E(a.action)+'">'+E(a.action)+'</div>';
      for (let w = 1; w <= maxWeek; w++) {
        if (w >= s && w <= e) {
          const br = (s===e) ? '3px' : (w===s) ? '3px 0 0 3px' : (w===e) ? '0 3px 3px 0' : '0';
          h += '<div style="height:20px;background:'+color+';border-radius:'+br+';opacity:.82" title="'+E(a.action)+' (S'+s+'–S'+e+')"></div>';
        } else {
          h += '<div style="height:20px;background:var(--surface);border-radius:3px"></div>';
        }
      }
      h += '</div>';
    });
  });

  // Legend
  h += '<div style="display:flex;gap:.75rem;align-items:center;margin-top:.625rem;padding-top:.5rem;border-top:1px solid var(--border)">';
  h += '<span style="font-size:.6875rem;color:var(--text-muted)">Impacto:</span>';
  [['Alto','var(--danger)'],['Médio','var(--warning)'],['Baixo','#94a3b8']].forEach(function(pair) {
    h += '<div style="display:flex;align-items:center;gap:.25rem"><div style="width:10px;height:10px;background:'+pair[1]+';border-radius:2px;opacity:.82"></div><span style="font-size:.6875rem;color:var(--text-secondary)">'+pair[0]+'</span></div>';
  });
  h += '</div>';

  h += '</div>';
  return h;
}

// ===== SVG CHART LIBRARY =====
// Paleta semântica consistente
const CX = {
  red:'#dc2626', danger:'#b91c1c', orange:'#f97316', yellow:'#eab308',
  green:'#16a34a', emerald:'#059669', blue:'#2563eb', purple:'#7c3aed',
  gray:'#94a3b8', muted:'#64748b', line:'#e2e8f0', bg:'#f8fafc', text:'#0f172a'
};
const chartColor = (tone) => CX[tone] || CX.gray;

// insight(): wraps a chart with an auto-insight bullet (leitura estratégica do gráfico)
function insight(chartHtml, insightText, tone) {
  const borderColor = tone==='bad' ? CX.red : tone==='good' ? CX.green : tone==='warn' ? CX.yellow : CX.blue;
  return '<div class="chart-wrap" style="margin-bottom:.75rem">'
    +'<div style="padding:.25rem 0 .5rem">'+chartHtml+'</div>'
    +(insightText ? '<div style="margin-top:.25rem;padding:.5rem .75rem;border-left:3px solid '+borderColor+';background:var(--surface);border-radius:3px;font-size:.75rem;color:var(--text-secondary);line-height:1.45"><strong style="color:'+borderColor+';font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:.15rem">Leitura</strong>'+E(insightText)+'</div>' : '')
    +'</div>';
}

// chartTitle: subtítulo de gráfico
function chartTitle(t) {
  return '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.375rem">'+E(t)+'</div>';
}

// BAR HORIZONTAL: comparar valores lado a lado
// items: [{label, value, tone, subtext}]
function chartHBar(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const max = opts.max || Math.max(...items.map(i=>i.value||0));
  if (!max) return '';
  const fmt = opts.fmt || (v=>v);
  const lw = opts.labelWidth || 120;
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:flex;flex-direction:column;gap:.375rem">'+items.map(it=>{
      const pct = ((it.value||0)/max*100).toFixed(1);
      const col = chartColor(it.tone||'blue');
      return '<div style="display:grid;grid-template-columns:'+lw+'px 1fr 70px;gap:.5rem;align-items:center">'
        +'<div style="font-size:.75rem;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+E(it.label)+'">'+E(it.label)+'</div>'
        +'<div style="height:18px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
        +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:3px;opacity:.85"></div>'
        +(it.subtext?'<div style="position:absolute;top:50%;transform:translateY(-50%);left:8px;font-size:.6875rem;color:white;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)">'+E(it.subtext)+'</div>':'')
        +'</div>'
        +'<div style="font-size:.75rem;font-weight:700;color:'+col+';text-align:right">'+E(String(fmt(it.value)))+'</div>'
        +'</div>';
    }).join('')+'</div>';
}

// DONUT: distribuição percentual
// slices: [{label, value, tone}]
function chartDonut(slices, opts) {
  opts = opts || {};
  if (!slices?.length) return '';
  const total = slices.reduce((s,x)=>s+(x.value||0),0);
  if (!total) return '';
  const size = opts.size || 160;
  const cx = size/2, cy = size/2, r = size*0.4, ir = size*0.26;
  let angle = -Math.PI/2;
  const paths = slices.map(s=>{
    const frac = (s.value||0)/total;
    const a2 = angle + frac*Math.PI*2;
    const large = frac > 0.5 ? 1 : 0;
    const x1 = cx+r*Math.cos(angle), y1 = cy+r*Math.sin(angle);
    const x2 = cx+r*Math.cos(a2),   y2 = cy+r*Math.sin(a2);
    const x3 = cx+ir*Math.cos(a2),  y3 = cy+ir*Math.sin(a2);
    const x4 = cx+ir*Math.cos(angle), y4 = cy+ir*Math.sin(angle);
    const d = 'M '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' L '+x3+' '+y3+' A '+ir+' '+ir+' 0 '+large+' 0 '+x4+' '+y4+' Z';
    angle = a2;
    return '<path d="'+d+'" fill="'+chartColor(s.tone||'blue')+'" opacity=".85"><title>'+E(s.label)+': '+(frac*100).toFixed(1)+'%</title></path>';
  }).join('');
  const legend = slices.map(s=>{
    const pct = ((s.value||0)/total*100).toFixed(1);
    return '<div style="display:flex;align-items:center;gap:.375rem;font-size:.75rem;margin-bottom:.2rem">'
      +'<div style="width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';border-radius:2px;flex-shrink:0"></div>'
      +'<div style="flex:1;color:var(--text-secondary)">'+E(s.label)+'</div>'
      +'<div style="font-weight:700;color:var(--text-primary)">'+pct+'%</div>'
      +'</div>';
  }).join('');
  const centerLabel = opts.center || '';
  return (opts.title?chartTitle(opts.title):'')
    +'<div style="display:grid;grid-template-columns:'+size+'px 1fr;gap:1rem;align-items:center">'
    +'<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+paths
    +(centerLabel?'<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="14" font-weight="700" fill="'+CX.text+'">'+E(centerLabel.split('|')[0])+'</text>'
      +'<text x="'+cx+'" y="'+(cy+12)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase">'+E(centerLabel.split('|')[1]||'')+'</text>':'')
    +'</svg>'
    +'<div>'+legend+'</div>'
    +'</div>';
}

// GAUGE: métrica vs benchmark (semicírculo)
// value: atual, benchmark: meta/média, max: teto da escala
function chartGauge(value, benchmark, max, opts) {
  opts = opts || {};
  if (value == null || max == null) return '';
  const w = opts.size || 220, h = w*0.72;
  const cx = w/2, cy = h*0.78, r = w*0.40;
  const pct = Math.min(1, Math.max(0, value/max));
  const benchPct = benchmark!=null ? Math.min(1, Math.max(0, benchmark/max)) : null;
  // SVG Y-down: ângulo cresce no sentido horário visual.
  // Para gauge superior, vamos de π (LEFT, 9h) até 2π (RIGHT, 3h), passando por 3π/2 (TOP, 12h).
  const angleStart = Math.PI, angleEnd = 2 * Math.PI;
  const valAngle = angleStart + (angleEnd-angleStart)*pct;
  // Inverted logic: for CPL/CPA lower is better
  const invert = opts.invert;
  const isGood = invert ? (benchmark!=null && value <= benchmark) : (benchmark!=null && value >= benchmark);
  const tone = isGood ? 'green' : (benchmark!=null ? 'red' : 'blue');
  const col = chartColor(tone);

  const arcPath = (a1, a2, rad) => {
    const x1 = cx+rad*Math.cos(a1), y1 = cy+rad*Math.sin(a1);
    const x2 = cx+rad*Math.cos(a2), y2 = cy+rad*Math.sin(a2);
    const delta = Math.abs(a2-a1);
    const large = delta >= Math.PI - 0.0001 ? 1 : 0;
    // a2 > a1 = ângulo crescente = horário visual em SVG = sweep=1 (passa pelo TOP indo de LEFT a RIGHT via 3π/2)
    const sweep = a2 > a1 ? 1 : 0;
    return 'M '+x1+' '+y1+' A '+rad+' '+rad+' 0 '+large+' '+sweep+' '+x2+' '+y2;
  };
  const bench = benchPct != null ? angleStart + (angleEnd-angleStart)*benchPct : null;
  const benchX = bench != null ? cx+r*Math.cos(bench) : null;
  const benchY = bench != null ? cy+r*Math.sin(bench) : null;
  const benchXi = bench != null ? cx+(r-10)*Math.cos(bench) : null;
  const benchYi = bench != null ? cy+(r-10)*Math.sin(bench) : null;

  const fmt = opts.fmt || (v=>v);
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" style="max-width:'+w+'px">'
    +'<path d="'+arcPath(angleStart, angleEnd, r)+'" fill="none" stroke="'+CX.line+'" stroke-width="10" stroke-linecap="round"/>'
    +'<path d="'+arcPath(angleStart, valAngle, r)+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" opacity=".9"/>'
    +(bench != null ? '<line x1="'+benchXi+'" y1="'+benchYi+'" x2="'+benchX+'" y2="'+benchY+'" stroke="'+CX.text+'" stroke-width="2"/><circle cx="'+benchX+'" cy="'+benchY+'" r="4" fill="'+CX.text+'"/>' : '')
    +'<text x="'+cx+'" y="'+(cy-28)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.metricLabel||'Atual')+'</text>'
    +'<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-size="22" font-weight="800" fill="'+col+'">'+E(String(fmt(value)))+'</text>'
    +'<text x="'+(cx-r+4)+'" y="'+(cy+12)+'" text-anchor="start" font-size="8" fill="'+CX.muted+'">0</text>'
    +'<text x="'+(cx+r-4)+'" y="'+(cy+12)+'" text-anchor="end" font-size="8" fill="'+CX.muted+'">'+E(String(fmt(max)))+'</text>'
    +(benchmark != null ? '<text x="'+cx+'" y="'+(cy+28)+'" text-anchor="middle" font-size="10" fill="'+CX.muted+'">Benchmark setor: '+E(String(fmt(benchmark)))+'</text>':'')
    +'</svg>';
}

// FUNNEL: estágios com conversão entre níveis
// stages: [{label, value, tone, subtext}]
function chartFunnel(stages) {
  if (!stages?.length) return '';
  const max = stages[0].value || Math.max(...stages.map(s=>s.value||0));
  if (!max) return '';
  return '<div style="display:flex;flex-direction:column;gap:.25rem">'+stages.map((s,i)=>{
    const pct = ((s.value||0)/max*100);
    const col = chartColor(s.tone||'blue');
    const prev = i>0 ? stages[i-1].value : null;
    const drop = prev && prev > 0 ? (((prev - (s.value||0))/prev)*100).toFixed(0) : null;
    return (drop!==null ? '<div style="text-align:center;font-size:.625rem;color:'+CX.red+';margin:-.1rem 0;font-weight:700">↓ vaza '+drop+'%</div>' : '')
      +'<div style="display:grid;grid-template-columns:140px 1fr 80px;gap:.5rem;align-items:center">'
      +'<div style="font-size:.75rem;font-weight:600;color:var(--text-primary)" title="'+E(s.label)+'">'+E(s.label)+'</div>'
      +'<div style="height:28px;background:var(--surface);border-radius:3px;overflow:hidden;position:relative">'
      +'<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+col+';border-radius:3px;opacity:.85;min-width:20px"></div>'
      +'<div style="position:absolute;inset:0;display:flex;align-items:center;padding:0 .5rem;font-size:.6875rem;color:'+(pct>40?'white':'var(--text-primary)')+';font-weight:700;text-shadow:'+(pct>40?'0 1px 2px rgba(0,0,0,.4)':'none')+'">'+E(s.subtext||'')+'</div>'
      +'</div>'
      +'<div style="font-size:.8125rem;font-weight:700;text-align:right;color:'+col+'">'+(typeof s.value==='number'?N(s.value):E(String(s.value||'—')))+'</div>'
      +'</div>';
  }).join('')+'</div>';

// CHEVRON FUNNEL (estilo "Destrava Receita"): lê da DIREITA para ESQUERDA
// stages: [{stage, volume, volume_label, rate_label, subtext, status, estimated, is_active_constraint}]
// Métricas inseridas via <foreignObject> DENTRO do SVG — sistema de coordenadas único garante alinhamento perfeito
function chartChevronFunnel(stages) {
  if (!stages?.length || !FUNNEL_SVG_INLINE) return '';
  const n = stages.length;
  // Subtítulos descritores do framework Destrava Receita (mapeados pelo nome da etapa)
  const subtitles = {
    'Exposição':    'Pessoas Impactadas',
    'Atenção':      'Pessoas Engajadas',
    'Interesse':    'Solicitaram Conversa',
    'Qualificação': 'Pessoas Qualificadas',
    'Compromisso':  'Contatos Realizados',
    'Decisão':      'Vendas Realizadas',
    'Retenção':     'Recompra'
  };
  // Centros X dos 7 chevrons em coords do viewBox 1716x593 (espelhados)
  // Ordem: idx 0 = DIREITA (Exposição), idx 6 = ESQUERDA (Retenção)
  const centers7 = [1491, 1285, 1081, 858, 635, 431, 225];
  const cxArr = n === 7 ? centers7 : Array.from({length:n}, (_,i) => 1491 - (i * (1266/(n-1||1))));
  // Cabeçalhos (acima dos chevrons): nome em uppercase + subtítulo descritor + (se for restrição) badge
  const headersHtml = stages.map((s, i) => {
    const xPct = (cxArr[i] / 1716 * 100).toFixed(2);
    const subtitle = subtitles[s.stage] || '';
    return '<div style="position:absolute;left:'+xPct+'%;top:0;transform:translateX(-50%);text-align:center;width:13%;min-width:92px">'
      + '<div style="font-size:.8125rem;font-weight:800;color:#1a1a1a;text-transform:uppercase;letter-spacing:.05em;line-height:1.1">'+E(s.stage)+'</div>'
      + (subtitle ? '<div style="font-size:.6875rem;color:#666;margin-top:.25rem;line-height:1.2">'+E(subtitle)+'</div>' : '')
      + (s.is_active_constraint ? '<div style="display:inline-block;background:#dc2626;color:#fff;padding:1px 6px;border-radius:3px;font-size:.5625rem;font-weight:800;letter-spacing:.06em;margin-top:.3rem;box-shadow:0 0 8px rgba(220,38,38,.5)">&#9733; RESTRIÇÃO</div>' : '')
      + '</div>';
  }).join('');
  // Volumes dentro dos chevrons como pílulas vermelhas (foreignObject — coords do SVG)
  const cy = 296, panelW = 200, panelH = 60;
  const volumesOverlay = stages.map((s, i) => {
    const cx = cxArr[i];
    const x = cx - panelW/2;
    const y = cy - panelH/2;
    const isEstimated = !!s.estimated;
    const rawVol = s.volume_label || (typeof s.volume === 'number' ? N(s.volume) : (s.volume || '—'));
    const volLabel = String(rawVol).replace(/\s*\/\s*m[eê]s\s*/i, '').replace(/^~\s*/, '~');
    return '<foreignObject x="'+x+'" y="'+y+'" width="'+panelW+'" height="'+panelH+'">'
      + '<div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;height:100%;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">'
      + '<div style="background:#9b1c1c;color:#fff;padding:7px 18px;border-radius:6px;font-size:24px;font-weight:800;line-height:1;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap">'
      + E(volLabel)
      + (isEstimated ? '<span style="font-size:11px;font-weight:500;opacity:.85;margin-left:6px">[E]</span>' : '')
      + '</div>'
      + '</div>'
      + '</foreignObject>';
  }).join('');
  // Transições (taxas) entre chevrons consecutivos — n-1 transições no ponto médio entre cada par
  const transitions = [];
  for (let i = 0; i < n - 1; i++) {
    const cxMid = (cxArr[i] + cxArr[i+1]) / 2;
    transitions.push({
      xPct: (cxMid / 1716 * 100).toFixed(2),
      fromStage: stages[i].stage,
      toStage: stages[i+1].stage,
      rate: stages[i+1].rate_label || '—'
    });
  }
  const transitionsHtml = transitions.map(t =>
    '<div style="position:absolute;left:'+t.xPct+'%;top:0;transform:translateX(-50%);text-align:center;width:11%;min-width:80px">'
    + '<div style="font-size:.9375rem;font-weight:800;color:#dc2626;line-height:1">'+E(t.rate)+'</div>'
    + '<div style="font-size:.625rem;color:#666;margin-top:.35rem;line-height:1.25">'+E(t.fromStage)+' &rarr; '+E(t.toStage)+'</div>'
    + '</div>'
  ).join('');
  // Legenda de detalhamento
  const legendHtml = stages.map((s,i) =>
    '<div style="margin-bottom:.4rem;font-size:.75rem;line-height:1.5">'
    + '<strong style="color:var(--text-primary)">'+(i+1)+'. '+E(s.stage)
    + (s.estimated ? ' <span style="color:var(--text-muted);font-weight:500">[E]</span>' : '')
    + (s.is_active_constraint ? ' <span style="color:#dc2626">&#9733;</span>' : '')
    + ':</strong> '
    + '<span style="color:var(--text-secondary)">'+E(s.subtext||'')+'</span>'
    + '</div>'
  ).join('');
  // SVG inline com overlay de pílulas
  const svgWrapped = FUNNEL_SVG_INLINE
    .replace('<svg ', '<svg style="display:block;width:100%;height:auto" preserveAspectRatio="xMidYMid meet" ')
    .replace('</svg>', volumesOverlay + '</svg>');
  return '<div style="padding:1rem .5rem 0;color:#1a1a1a">'
    + '<div style="text-align:center;font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;margin-bottom:.75rem">Lê-se da direita para a esquerda &middot; base mensal</div>'
    + '<div style="position:relative;width:100%;height:64px;margin-bottom:.25rem">' + headersHtml + '</div>'
    + '<div style="position:relative;width:100%;aspect-ratio:1716/593">' + svgWrapped + '</div>'
    + '<div style="position:relative;width:100%;height:48px;margin-top:.5rem">' + transitionsHtml + '</div>'
    + '</div>'
    + '<div style="margin-top:.75rem;padding:.85rem 1rem;background:rgba(0,0,0,.04);border-radius:4px">'
    + '<div style="font-size:.625rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-muted);margin-bottom:.55rem">Detalhamento das etapas</div>'
    + legendHtml
    + '</div>';
}

// RADAR: comparar scores multi-dimensionais (ex: pilares, competitor)
// axes: [{name, value, benchmark}]
function chartRadar(axes, opts) {
  opts = opts || {};
  if (!axes?.length || axes.length < 3) return '';
  const size = opts.size || 260;
  const cx = size/2, cy = size/2, maxR = size*0.37;
  const max = opts.max || 100;
  const n = axes.length;
  const pt = (i, val) => {
    const a = -Math.PI/2 + (i/n)*Math.PI*2;
    const rad = maxR * (val/max);
    return (cx+rad*Math.cos(a))+','+(cy+rad*Math.sin(a));
  };
  const axisLine = axes.map((_,i)=>{
    const a = -Math.PI/2 + (i/n)*Math.PI*2;
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+maxR*Math.cos(a))+'" y2="'+(cy+maxR*Math.sin(a))+'" stroke="'+CX.line+'" stroke-width="1"/>';
  }).join('');
  const rings = [0.25,0.5,0.75,1].map(f=>{
    const pts = axes.map((_,i)=>{
      const a = -Math.PI/2 + (i/n)*Math.PI*2;
      return (cx+maxR*f*Math.cos(a))+','+(cy+maxR*f*Math.sin(a));
    }).join(' ');
    return '<polygon points="'+pts+'" fill="none" stroke="'+CX.line+'" stroke-width="1" opacity=".6"/>';
  }).join('');
  const valPoly = '<polygon points="'+axes.map((a,i)=>pt(i,a.value||0)).join(' ')+'" fill="'+chartColor(opts.tone||'blue')+'" fill-opacity=".28" stroke="'+chartColor(opts.tone||'blue')+'" stroke-width="2"/>';
  const benchPoly = axes[0].benchmark!=null ? '<polygon points="'+axes.map((a,i)=>pt(i,a.benchmark||0)).join(' ')+'" fill="none" stroke="'+CX.muted+'" stroke-width="1.5" stroke-dasharray="4 3"/>':'';
  const labels = axes.map((a,i)=>{
    const ang = -Math.PI/2 + (i/n)*Math.PI*2;
    const lr = maxR + 18;
    const lx = cx+lr*Math.cos(ang), ly = cy+lr*Math.sin(ang);
    const anchor = Math.cos(ang) > 0.3 ? 'start' : Math.cos(ang) < -0.3 ? 'end' : 'middle';
    return '<text x="'+lx+'" y="'+(ly+3)+'" font-size="10" font-weight="600" fill="'+CX.text+'" text-anchor="'+anchor+'">'+E(a.name)+'</text>'
      +'<text x="'+lx+'" y="'+(ly+14)+'" font-size="9" fill="'+chartColor(opts.tone||'blue')+'" font-weight="700" text-anchor="'+anchor+'">'+(a.value||0)+(a.benchmark!=null?'/'+a.benchmark:'')+'</text>';
  }).join('');
  // Padding para labels nao cortarem
  const padX = 70, padY = 28;
  const vbW = size + padX*2, vbH = size + padY*2;
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="'+(-padX)+' '+(-padY)+' '+vbW+' '+vbH+'" width="100%" height="'+vbH+'" preserveAspectRatio="xMidYMid meet" style="max-width:'+vbW+'px;display:block;margin:0 auto;overflow:visible">'
    +rings+axisLine+benchPoly+valPoly+labels
    +'</svg>'
    +(axes[0].benchmark!=null?'<div style="display:flex;gap:.75rem;justify-content:center;margin-top:.25rem;font-size:.6875rem;color:var(--text-muted)"><span><span style="display:inline-block;width:10px;height:10px;background:'+chartColor(opts.tone||'blue')+';opacity:.5;margin-right:.25rem;vertical-align:middle"></span>Atual</span><span><span style="display:inline-block;width:10px;height:2px;background:'+CX.muted+';margin-right:.25rem;vertical-align:middle"></span>Benchmark</span></div>':'');
}

// EFFORT x IMPACT MATRIX: prioriza acoes em 2x2 (Quick Wins / Grandes Projetos / Preencher / Revisar)
// items: [{label, effort: 'low|medium|high', impact: 'baixo|medio|alto', rank, tooltip}]
function chartEffortImpact(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const w = 520, h = 420;
  const pad = {l: 64, r: 24, t: 40, b: 56};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const effX = {low: 0.25, medium: 0.55, high: 0.85};
  const impY = {alto: 0.18, medio: 0.5, baixo: 0.82};
  const xCol = v => pad.l + iw * (effX[v] ?? 0.5);
  const yRow = v => pad.t + ih * (impY[v] ?? 0.5);
  // Fundo dos quadrantes
  const midX = pad.l + iw/2, midY = pad.t + ih/2;
  const quads = ''
    + '<rect x="'+pad.l+'" y="'+pad.t+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.green+'" opacity=".10"/>'
    + '<rect x="'+midX+'" y="'+pad.t+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.blue+'" opacity=".10"/>'
    + '<rect x="'+pad.l+'" y="'+midY+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.gray+'" opacity=".10"/>'
    + '<rect x="'+midX+'" y="'+midY+'" width="'+(iw/2)+'" height="'+(ih/2)+'" fill="'+CX.red+'" opacity=".10"/>';
  const labelsQ = ''
    + '<text x="'+(pad.l+iw/4)+'" y="'+(pad.t+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.green+'">QUICK WINS</text>'
    + '<text x="'+(midX+iw/4)+'" y="'+(pad.t+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.blue+'">GRANDES PROJETOS</text>'
    + '<text x="'+(pad.l+iw/4)+'" y="'+(midY+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.muted+'">PREENCHER</text>'
    + '<text x="'+(midX+iw/4)+'" y="'+(midY+14)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.red+'">REVISAR</text>';
  // Grid
  const axes = ''
    + '<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    + '<line x1="'+pad.l+'" y1="'+(pad.t+ih)+'" x2="'+(pad.l+iw)+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    + '<line x1="'+midX+'" y1="'+pad.t+'" x2="'+midX+'" y2="'+(pad.t+ih)+'" stroke="'+CX.line+'" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<line x1="'+pad.l+'" y1="'+midY+'" x2="'+(pad.l+iw)+'" y2="'+midY+'" stroke="'+CX.line+'" stroke-width="1" stroke-dasharray="4 4"/>';
  // Labels dos eixos
  const axLabels = ''
    + '<text x="'+(pad.l+iw/2)+'" y="'+(h-12)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+CX.text+'">ESFORCO (menor → maior)</text>'
    + '<text x="'+(pad.l-22)+'" y="'+(pad.t+ih/2)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+CX.text+'" transform="rotate(-90 '+(pad.l-22)+' '+(pad.t+ih/2)+')">IMPACTO (menor → maior)</text>'
    + '<text x="'+xCol('low')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Baixo</text>'
    + '<text x="'+xCol('medium')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Medio</text>'
    + '<text x="'+xCol('high')+'" y="'+(pad.t+ih+16)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">Alto</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('alto')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Alto</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('medio')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Medio</text>'
    + '<text x="'+(pad.l-6)+'" y="'+(yRow('baixo')+3)+'" text-anchor="end" font-size="9" fill="'+CX.muted+'">Baixo</text>';
  // Agrupa itens na mesma celula para nao sobrepor
  const bucket = {};
  items.forEach((it, idx) => {
    const key = (it.effort||'medium')+'|'+(it.impact||'medio');
    (bucket[key] = bucket[key] || []).push({...it, _i: idx});
  });
  let dots = '';
  Object.values(bucket).forEach(group => {
    const n = group.length;
    group.forEach((it, j) => {
      const cx = xCol(it.effort||'medium');
      const cy = yRow(it.impact||'medio');
      // offset radial se houver mais de 1 no mesmo balde
      const off = n>1 ? 16 : 0;
      const ang = n>1 ? (j/n) * Math.PI*2 - Math.PI/2 : 0;
      const dx = cx + off*Math.cos(ang), dy = cy + off*Math.sin(ang);
      const isCritical = it.impact==='alto' && it.effort==='low';
      const col = isCritical ? CX.green : it.impact==='alto' ? CX.blue : it.impact==='medio' ? CX.yellow : CX.gray;
      dots += '<circle cx="'+dx+'" cy="'+dy+'" r="13" fill="'+col+'" stroke="#fff" stroke-width="2">'
        + '<title>'+E(it.tooltip||it.label||'')+'</title></circle>'
        + '<text x="'+dx+'" y="'+(dy+4)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" pointer-events="none">'+E(String(it.rank||(it._i+1)))+'</text>';
    });
  });
  return (opts.title?chartTitle(opts.title):'')
    + '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;display:block;margin:0 auto">'
    + quads + axes + labelsQ + axLabels + dots + '</svg>';
}

// WATERFALL: cenários com entradas e saídas progressivas
// items: [{label, value, tone}] — o valor pode ser positivo ou negativo
function chartWaterfall(items, opts) {
  opts = opts || {};
  if (!items?.length) return '';
  const w = opts.width || 480, h = opts.height || 180;
  const lab = 20, right = 20, top = 20, bottom = 30;
  const cw = (w-lab-right)/items.length;
  let running = 0;
  const running_ = items.map(it=>{ const from = running; running += (it.value||0); return {from, to: running}; });
  const allVals = running_.flatMap(r=>[r.from,r.to]);
  const maxV = Math.max(...allVals, 0), minV = Math.min(...allVals, 0);
  const yScale = v => top + (h-top-bottom) * (1 - (v-minV)/Math.max(1,maxV-minV));
  const bars = items.map((it,i)=>{
    const r = running_[i];
    const col = chartColor(it.tone || (it.value>=0?'green':'red'));
    const y0 = yScale(r.from), y1 = yScale(r.to);
    const yTop = Math.min(y0,y1), hh = Math.max(2, Math.abs(y1-y0));
    const x = lab + i*cw + cw*0.15;
    const bw = cw*0.7;
    return '<rect x="'+x+'" y="'+yTop+'" width="'+bw+'" height="'+hh+'" fill="'+col+'" opacity=".85"/>'
      +'<text x="'+(x+bw/2)+'" y="'+(yTop-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="'+CX.text+'">'+(it.value>=0?'+':'')+(opts.fmt?opts.fmt(it.value):it.value)+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(h-bottom+14)+'" text-anchor="middle" font-size="9" fill="'+CX.muted+'">'+E(it.label)+'</text>';
  }).join('');
  const baseline = '<line x1="'+lab+'" y1="'+yScale(0)+'" x2="'+(w-right)+'" y2="'+yScale(0)+'" stroke="'+CX.line+'" stroke-width="1"/>';
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'
    +baseline+bars
    +'</svg>';
}

// GROUPED BARS: 2-3 series side by side (ex: cenários A/B/C em 3 métricas)
// series: [{name, tone, values:[v1,v2,...]}], categories: [label1, ...]
function chartGroupedBars(categories, series, opts) {
  opts = opts || {};
  if (!categories?.length || !series?.length) return '';
  const w = opts.width || 520, h = opts.height || 200;
  const pad = {l:40,r:20,t:30,b:40};
  const cw = (w-pad.l-pad.r)/categories.length;
  const bw = (cw*0.7)/series.length;
  const all = series.flatMap(s=>s.values);
  const max = Math.max(...all, 0);
  const yScale = v => pad.t + (h-pad.t-pad.b) * (1 - v/Math.max(1,max));
  const groups = categories.map((cat,i)=>{
    const gx = pad.l + i*cw + cw*0.15;
    return series.map((s,si)=>{
      const x = gx + si*bw;
      const val = s.values[i]||0;
      const y = yScale(val);
      const barH = (h-pad.b) - y;
      const col = chartColor(s.tone||'blue');
      return '<rect x="'+x+'" y="'+y+'" width="'+(bw-2)+'" height="'+Math.max(0,barH)+'" fill="'+col+'" opacity=".85"/>'
        +'<text x="'+(x+bw/2)+'" y="'+(y-3)+'" text-anchor="middle" font-size="9" font-weight="700" fill="'+CX.text+'">'+(opts.fmt?opts.fmt(val):val)+'</text>';
    }).join('')
    +'<text x="'+(gx+cw*0.35)+'" y="'+(h-pad.b+14)+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+CX.text+'">'+E(cat)+'</text>';
  }).join('');
  const legend = '<div style="display:flex;gap:.75rem;justify-content:center;margin-top:.25rem;font-size:.6875rem">'
    +series.map(s=>'<span><span style="display:inline-block;width:10px;height:10px;background:'+chartColor(s.tone||'blue')+';opacity:.85;margin-right:.25rem;vertical-align:middle"></span>'+E(s.name)+'</span>').join('')
    +'</div>';
  const yAxis = opts.yLabel ? '<text x="8" y="'+(pad.t+(h-pad.t-pad.b)/2)+'" transform="rotate(-90 8 '+(pad.t+(h-pad.t-pad.b)/2)+')" text-anchor="middle" font-size="9" font-weight="600" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.yLabel)+'</text>' : '';
  const xAxis = opts.xLabel ? '<text x="'+(pad.l+(w-pad.l-pad.r)/2)+'" y="'+(h-4)+'" text-anchor="middle" font-size="9" font-weight="600" fill="'+CX.muted+'" text-transform="uppercase" letter-spacing=".05em">'+E(opts.xLabel)+'</text>' : '';
  return (opts.title?chartTitle(opts.title):'')
    +'<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet">'
    +'<line x1="'+pad.l+'" y1="'+(h-pad.b)+'" x2="'+(w-pad.r)+'" y2="'+(h-pad.b)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    +'<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(h-pad.b)+'" stroke="'+CX.line+'" stroke-width="1"/>'
    +yAxis+xAxis
    +groups
    +'</svg>'+legend;
}

// SPARKLINE: linha temporal compacta
function chartSparkline(values, opts) {
  opts = opts || {};
  if (!values?.length) return '';
  const w = opts.width||200, h = opts.height||40;
  const max = Math.max(...values), min = Math.min(...values);
  const span = max-min || 1;
  const step = (w-4)/(values.length-1||1);
  const pts = values.map((v,i)=>(2+i*step)+','+(h-2-((v-min)/span)*(h-4))).join(' ');
  const col = chartColor(opts.tone||'blue');
  const last = values[values.length-1], first = values[0];
  const trendCol = last>=first ? (opts.invert?CX.red:CX.green) : (opts.invert?CX.green:CX.red);
  return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'">'
    +'<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<circle cx="'+(2+(values.length-1)*step)+'" cy="'+(h-2-((last-min)/span)*(h-4))+'" r="3" fill="'+trendCol+'"/>'
    +'</svg>';
}

// heatCell: célula colorida pra scores 0-100
function heatCell(val, opts) {
  opts = opts || {};
  if (val == null) return '<span style="color:var(--text-muted)">—</span>';
  const t = val>=70?'green':val>=50?'yellow':val>=30?'orange':'red';
  return '<span style="display:inline-block;min-width:40px;padding:.1rem .4rem;background:'+chartColor(t)+';color:white;font-size:.75rem;font-weight:700;border-radius:3px;text-align:center">'+N(val)+(opts.suffix||'')+'</span>';
}

function renderLeituraEstrategica(d, opts) {

  const verdictLabel = opts.verdictLabel || 'Veredito';

  if (!d.summary_headline && !d.summary_highlights?.length && !d.summary_key_findings?.length) {
    // Fallback: se só tem summary simples, usa sm()
    return d.summary ? sm(d.summary) : '';
  }

  let hero = '';

  // A. Veredito (headline)
  if (d.summary_headline) {
    hero += '<div style="padding:1.125rem 1.25rem;background:linear-gradient(135deg, rgba(220,38,38,0.08), rgba(234,179,8,0.04));border-left:4px solid var(--danger);border-radius:4px;margin-bottom:1rem">'
      +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--danger);margin-bottom:.375rem">'+E(verdictLabel)+'</div>'
      +'<div style="font-size:.9375rem;font-weight:600;color:var(--text-primary);line-height:1.55">'+E(d.summary_headline)+'</div>'
      +'</div>';
  }

  // B. KPIs — grid uniforme com categoria como chip no card (evita colunas assimétricas)
  if (d.summary_highlights?.length) {
    const hasCategories = d.summary_highlights.some(hi => hi.category && HIGHLIGHT_CAT[hi.category]);

    if (hasCategories) {
      // Ordem canônica de categorias — prioriza posicionamento/contexto antes de ação
      const CAT_ORDER = ['posicao', 'maturidade', 'competicao', 'janela', 'oportunidade', 'risco'];
      const sorted = [...d.summary_highlights].sort((a, b) => {
        const ia = CAT_ORDER.indexOf(a.category); const ib = CAT_ORDER.indexOf(b.category);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      });

      hero += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem;margin-bottom:1rem">'
        + sorted.map(hi => {
          const cat = hi.category || 'outros';
          const lab = HIGHLIGHT_CAT[cat] || { title: cat.toUpperCase(), color: 'var(--text-muted)' };
          const col = TONE_MAP[hi.tone] || 'var(--accent)';
          const valStr = String(hi.value==null?'':hi.value);
          // Font adaptativo: números/códigos curtos ficam grandes; textos longos ficam compactos
          const len = valStr.length;
          const valFont = len <= 6 ? '1.75rem' : len <= 14 ? '1.25rem' : len <= 30 ? '1rem' : '.875rem';
          const valLineH = len <= 6 ? '1.05' : '1.3';

          return '<div style="display:flex;flex-direction:column;padding:.875rem 1rem;background:var(--surface);border:1px solid var(--border);border-left:3px solid '+col+';border-radius:4px;min-width:0">'
            +'<div style="display:flex;align-items:center;gap:.375rem;margin-bottom:.625rem;padding-bottom:.5rem;border-bottom:1px dashed var(--border)">'
            +  '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:'+lab.color+';flex-shrink:0"></span>'
            +  '<span style="font-size:.5625rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:'+lab.color+'">'+E(lab.title)+'</span>'
            +'</div>'
            +'<div style="font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);line-height:1.3;margin-bottom:.375rem">'+E(hi.label)+'</div>'
            +'<div style="font-size:'+valFont+';font-weight:800;color:'+col+';line-height:'+valLineH+';letter-spacing:-.01em;word-wrap:break-word;overflow-wrap:break-word;margin-bottom:auto">'+E(valStr)+'</div>'
            +(hi.subtext?'<div style="font-size:.75rem;color:var(--text-secondary);margin-top:.5rem;line-height:1.45">'+E(hi.subtext)+'</div>':'')
            +'</div>';
        }).join('')
        +'</div>';
    } else {
      // Fallback sem categoria — grid responsivo
      hero += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.625rem;margin-bottom:1rem">'
        + d.summary_highlights.map(hi => {
          const col = TONE_MAP[hi.tone] || 'var(--accent)';
          const valStr = String(hi.value==null?'':hi.value);
          const len = valStr.length;
          const valFont = len <= 6 ? '1.625rem' : len <= 14 ? '1.125rem' : '.9375rem';
          const valLineH = len <= 6 ? '1.05' : '1.25';
          return '<div style="padding:.75rem .875rem;background:var(--surface);border:1px solid var(--border);border-top:3px solid '+col+';border-radius:3px;min-width:0">'
            +'<div style="font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);line-height:1.3;margin-bottom:.375rem">'+E(hi.label)+'</div>'
            +'<div style="font-size:'+valFont+';font-weight:800;color:'+col+';line-height:'+valLineH+';letter-spacing:-.005em;word-wrap:break-word;overflow-wrap:break-word">'+E(valStr)+'</div>'
            +(hi.subtext?'<div style="font-size:.75rem;color:var(--text-secondary);margin-top:.375rem;line-height:1.4">'+E(hi.subtext)+'</div>':'')
            +'</div>';
        }).join('')
        +'</div>';
    }
  }

  // C. Findings categorizados
  if (d.summary_key_findings?.length) {
    const normalized = d.summary_key_findings.map(f => typeof f === 'string' ? { category:'contexto', text:f } : f);
    const groups = {};
    const order = [];
    normalized.forEach(f => {
      const cat = f.category || 'contexto';
      if (!groups[cat]) { groups[cat] = []; order.push(cat); }
      groups[cat].push(f);
    });
    const hasCats = order.some(k => FINDING_CAT[k]);

    if (hasCats) {
      hero += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.75rem;margin-bottom:1rem">'
        + order.map(cat => {
          const meta = FINDING_CAT[cat] || FINDING_CAT.contexto;
          const items = groups[cat];
          return '<div style="background:var(--surface);border:1px solid var(--border);border-top:3px solid '+meta.color+';border-radius:3px;padding:.75rem .875rem">'
            +'<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem;padding-bottom:.375rem;border-bottom:1px dashed var(--border)">'
            +  '<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:'+meta.color+';color:white;font-size:.6875rem;font-weight:800">'+meta.icon+'</span>'
            +  '<div style="font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:'+meta.color+'">'+E(meta.title)+'</div>'
            +  '<div style="margin-left:auto;font-size:.625rem;color:var(--text-muted);font-weight:700">'+items.length+'</div>'
            +'</div>'
            +'<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.5rem">'
            + items.map(f => '<li style="font-size:.8125rem;color:var(--text-secondary);line-height:1.5">'+E(f.text)+'</li>').join('')
            +'</ul>'
            +'</div>';
        }).join('')
        +'</div>';
    } else {
      hero += '<div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:.75rem 1rem;margin-bottom:1rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:.5rem">Principais Achados</div>'
        +'<ul style="list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.375rem">'
        + normalized.map(f => '<li style="display:grid;grid-template-columns:18px 1fr;gap:.5rem;align-items:start;font-size:.8125rem;color:var(--text-secondary);line-height:1.45"><span style="color:var(--success);font-weight:700;margin-top:.1rem">▸</span><span>'+E(f.text)+'</span></li>').join('')
        +'</ul></div>';
    }
  }

  // D. Resumo completo (collapsible)
  if (d.summary) {
    hero += '<details style="margin-bottom:.5rem"><summary style="cursor:pointer;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);padding:.375rem 0">Ver resumo completo</summary>'
      +'<div style="padding:.75rem .875rem;background:var(--surface);border-radius:3px;font-size:.8125rem;color:var(--text-secondary);line-height:1.55">'+E(d.summary)+'</div>'
      +'</details>';
  }

  return sc(title, hero);
}

// renderKeyInsight: renderiza o bloco canônico "Ponto de Alavancagem"
// Aceita um objeto {headline, context, numbered_reasons[], discussion_anchor, feasibility?}
// ou um string legado (vira só headline + context).
// Opts: {title, badge, feasibility}
function renderKeyInsight(ki, opts) {
  if (!ki) return '';
  opts = opts || {};
  const title = opts.title || 'Ponto de Alavancagem';
  const badge = opts.badge || 'Whitespace Estratégico · Discussão com Stakeholder';

  // Se vier string, converte
  if (typeof ki === 'string') ki = { context: ki };

  const headline = ki.headline || '';
  const context = ki.context || ki.description || '';
  const reasons = Array.isArray(ki.numbered_reasons) ? ki.numbered_reasons : [];
  const anchor = ki.discussion_anchor || '';
  const feas = (opts.feasibility || ki.feasibility || '').toLowerCase();

  const feasCol = feas==='alta'?'var(--success)':feas==='media'||feas==='média'?'var(--warning)':feas==='baixa'?'var(--danger)':'var(--success)';
  const feasBg = feas==='alta'?'rgba(22,163,74,0.08)':feas==='media'||feas==='média'?'rgba(234,179,8,0.08)':feas==='baixa'?'rgba(220,38,38,0.08)':'rgba(22,163,74,0.08)';

  // Extrai primeira frase em aspas do headline ou context como quote hero (se não houver headline puro)
  let heroQuote = headline;
  let bodyText = context;
  if (!heroQuote && context) {
    const quoteMatch = context.match(/['""']([^'""']{8,})['""']/);
    if (quoteMatch) {
      heroQuote = quoteMatch[1];
      bodyText = context.replace(quoteMatch[0], '');
    }
  }

  let opp = '<div style="background:linear-gradient(135deg, rgba(22,163,74,0.04) 0%, rgba(22,163,74,0.08) 100%);border:2px solid var(--success);border-radius:6px;padding:1.25rem 1.375rem;position:relative;overflow:hidden">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap">'
    +   '<div style="display:flex;align-items:center;gap:.5rem">'
    +     '<span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--success);color:white;font-size:.75rem;font-weight:800">★</span>'
    +     '<span style="font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--success)">'+E(badge)+'</span>'
    +   '</div>'
    +   (feas?'<div style="display:inline-flex;align-items:center;gap:.375rem;background:'+feasBg+';border:1px solid '+feasCol+';padding:.3rem .6rem;border-radius:20px">'
    +     '<span style="width:6px;height:6px;border-radius:50%;background:'+feasCol+';box-shadow:0 0 0 3px '+feasBg+'"></span>'
    +     '<span style="font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:'+feasCol+'">Viabilidade '+E(feas)+'</span>'
    +   '</div>':'')
    + '</div>';

  if (heroQuote) {
    opp += '<div style="padding:.875rem 1rem;background:white;border-left:4px solid var(--success);border-radius:3px;margin-bottom:1rem;box-shadow:0 1px 2px rgba(0,0,0,0.04)">'
      +'<div style="font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:.375rem">Insight-chave</div>'
      +'<div style="font-size:1.0625rem;font-weight:700;color:var(--text-primary);line-height:1.4;font-style:italic">"'+E(heroQuote)+'"</div>'
      +'</div>';
  }

  if (bodyText) {
    opp += '<div style="font-size:.875rem;color:var(--text-secondary);line-height:1.6;margin-bottom:'+(reasons.length?'1.25rem':'.25rem')+'">'+E(bodyText)+'</div>';
  }

  if (reasons.length) {
    opp += '<div style="border-top:1px dashed rgba(22,163,74,0.3);padding-top:1rem">'
      +'<div style="font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text-primary);margin-bottom:.75rem">Razões / Evidências</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.625rem">'
      + reasons.map((r, i) => {
          const clean = String(r).replace(/^\s*\(\d+\)\s*/,'').replace(/^[.,;]\s*/,'').trim();
          return '<div style="display:flex;gap:.625rem;padding:.75rem;background:rgba(255,255,255,0.6);border:1px solid rgba(22,163,74,0.15);border-radius:4px">'
            +'<div style="flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--success);color:white;display:flex;align-items:center;justify-content:center;font-size:.8125rem;font-weight:800">'+(i+1)+'</div>'
            +'<div style="font-size:.75rem;color:var(--text-secondary);line-height:1.5">'+E(clean)+'</div>'
            +'</div>';
        }).join('')
      +'</div></div>';
  }

  if (anchor) {
    opp += '<div style="margin-top:1.125rem;padding:.75rem .875rem;background:rgba(22,163,74,0.12);border-radius:4px;display:flex;align-items:center;gap:.625rem">'
      +'<span style="font-size:1rem">💬</span>'
      +'<div style="font-size:.75rem;color:var(--text-primary);line-height:1.45"><strong>Momento de validar com a stakeholder:</strong> '+E(anchor)+'</div>'
      +'</div>';
  } else {
    opp += '<div style="margin-top:1.125rem;padding:.75rem .875rem;background:rgba(22,163,74,0.12);border-radius:4px;display:flex;align-items:center;gap:.625rem">'
      +'<span style="font-size:1rem">💬</span>'
      +'<div style="font-size:.75rem;color:var(--text-primary);line-height:1.45"><strong>Momento de validar com a stakeholder:</strong> este é o principal ponto de alavancagem desta análise.</div>'
      +'</div>';
  }

  opp += '</div>';
  return sc(title, opp);
}

// renderHonestyAlert: caixa amarela/vermelha para fragilidades reais reveladas
function renderHonestyAlert(text) {
  if (!text) return '';
  const box = '<div style="padding:1rem 1.125rem;background:linear-gradient(135deg, rgba(234,179,8,0.08), rgba(220,38,38,0.04));border:2px dashed var(--warning);border-radius:4px;display:flex;gap:.75rem;align-items:flex-start">'
    +'<span style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--warning);color:white;font-size:.875rem;font-weight:800">!</span>'
    +'<div>'
    +  '<div style="font-size:.6875rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--warning);margin-bottom:.375rem">Alerta de Honestidade</div>'
    +  '<div style="font-size:.8125rem;color:var(--text-primary);line-height:1.55">'+E(text)+'</div>'
    +'</div></div>';
  return sc('Alerta de Honestidade', box);
}

// ===== RENDERERS (keyed by skill ID) =====
const R = {

'ee-s1-diagnostico-maturidade'(d) {
  let h = '';
  h += renderLeituraEstrategica(d, { verdictLabel: 'Veredito de Maturidade' });
  const cc = c => CLC[c]||'';
  const bm = d.sector_benchmark;
  const bmAvg = bm ? (typeof bm.sector_average === 'number' ? bm.sector_average+'/100' : bm.sector_average) : null;
  const tipScore = 'Media ponderada dos 5 pilares digitais (Midia Paga, Criativos, CRO, CRM, SEO), cada um com peso igual. Escala 0-100. Calculado a partir de dados auditados do cliente (sites, redes, anuncios) e estimativas quando indicado.';
  const tipClass = 'Faixas de classificacao: Critico <30, Baixo 30-49, Medio 50-69, Alto 70-89, Excelente 90+. A faixa reflete quao proximo do benchmark setorial o cliente esta operando.';
  const tipBench = 'Media setorial de empresas comparaveis (mesmo segmento, porte e regiao) auditadas pela V4. Serve como referencia para medir gap — nao como teto.';
  h += '<div class="gr gr--3">'
    + mt(d.overall_score??'—','Score Geral',cc(d.overall_classification),tipScore)
    + mt(CLS[d.overall_classification]||'—','Classificação',cc(d.overall_classification),tipClass)
    + (bm ? mt(bmAvg??'—','Benchmark — '+E(bm.sector),'',tipBench) : mt('—','Benchmark','',tipBench))
    + '</div>';
  if (bm?.key_insight) h += co(bm.key_insight);
  if (d.pillar_scores?.length) {
    const names = {midia_paga:'Mídia Paga',criativos:'Criativos',cro:'CRO',crm:'CRM',seo:'SEO'};
    const scColor = c => (c==='critical'||c==='low') ? 'var(--danger)' : 'var(--text-primary)';

    const isNum = v => typeof v === 'number' && !isNaN(v);
    const scored = d.pillar_scores.filter(p => isNum(p.score)); // só pilares medidos entram em radar/insight

    // RADAR de pilares vs benchmark (apenas pilares medidos)
    const bmMap = {};
    (bm?.pillar_comparison||[]).forEach(p=>{ bmMap[p.pillar] = p.sector_average; });
    const radarAxes = scored.map(p=>({name: names[p.pillar]||p.pillar, value: p.score, benchmark: bmMap[p.pillar]}));
    const weakest = [...scored].sort((a,b)=>a.score-b.score)[0];
    const strongest = [...scored].sort((a,b)=>b.score-a.score)[0];
    const radarInsight = weakest && strongest
      ? 'Pilar mais fraco: '+(names[weakest.pillar]||weakest.pillar)+' ('+weakest.score+'/100). Mais forte: '+(names[strongest.pillar]||strongest.pillar)+' ('+strongest.score+'/100). '
        +'Gap de '+(strongest.score-weakest.score)+' pontos concentra o maior espaço para ganho rápido.'
      : '';
    if (radarAxes.length) h += sc('Visão Geral — Pilares vs Setor',
      insight(chartRadar(radarAxes,{title:'Radar de Maturidade Digital', tone: d.overall_score>=60?'green':d.overall_score>=40?'yellow':'red'}),
        radarInsight, weakest?.score<40?'bad':weakest?.score<60?'warn':'good'));

    h += sc('Scores por Pilar', d.pillar_scores.map(p => {
      const sNum = isNum(p.score);
      const scoreLabel = sNum ? (N(p.score)+'/100') : (E(String(p.score==null?'?':p.score))+'/100');
      let pi = '<div class="pillar"><div class="pillar__row"><span class="pillar__name">'+E(names[p.pillar]||p.pillar)+'</span>'
        +'<span class="pillar__score" style="color:'+(sNum?scColor(p.classification):'var(--text-muted)')+'">'
        +scoreLabel+' '+tg(CLS[p.classification]||(sNum?'':'Não medido'),cc(p.classification)||'gray')+(p.estimated?' '+tg('Estimado','gray'):'')+'</span></div>'
        +pb(sNum?p.score:0,cc(p.classification)||'red')
        +(p.highlight?'<p style="font-size:.8125rem;color:var(--text-muted);margin:.25rem 0 0">'+E(p.highlight)+'</p>':'');
      if (p.details?.strengths?.length) pi += '<div style="margin-top:.5rem">'+p.details.strengths.map(s=>'<div style="font-size:.75rem;color:var(--success)">&#10003; '+E(s)+'</div>').join('')+'</div>';
      if (p.details?.weaknesses?.length) pi += '<div>'+p.details.weaknesses.map(w=>'<div style="font-size:.75rem;color:var(--danger)">&#10007; '+E(w)+'</div>').join('')+'</div>';
      return pi+'</div>';
    }).join(''));
  }
  if (bm?.pillar_comparison?.length) {
    const names = {midia_paga:'Mídia Paga',criativos:'Criativos',cro:'CRO',crm:'CRM',seo:'SEO'};
    const pos = {above:'green',at:'yellow',below:'red',critical_gap:'danger'};
    h += sc('Comparação com o Setor', tb(['Pilar','Cliente','Setor','Gap','Posição'],
      bm.pillar_comparison.map(p=>[
        E(names[p.pillar]||p.pillar), N(p.client_score), N(p.sector_average),
        '<span style="color:var(--'+(p.gap>=0?'success':'danger')+')">'+((p.gap>=0?'+':'')+N(p.gap))+'</span>',
        tg(p.position,pos[p.position]||'gray')
      ])));
  }
  if (d.executive_summary) h += co(d.executive_summary);
  if (d.priorities?.length) {
    const eff = {low:'green',medium:'yellow',high:'red'};
    // Deriva impacto a partir da classificacao do pilar associado
    const pillarCls = {};
    (d.pillar_scores||[]).forEach(p => { pillarCls[p.pillar] = p.classification; });
    const impactFor = p => {
      if (p.impact) return p.impact;
      const cls = pillarCls[p.pillar];
      if (cls === 'critical') return 'alto';
      if (cls === 'low') return 'alto';
      if (cls === 'medium') return 'medio';
      return 'baixo';
    };
    const impLabel = {alto:'Alto',medio:'Medio',baixo:'Baixo'};
    const impTone = {alto:'red',medio:'yellow',baixo:'gray'};
    const matrixItems = d.priorities.map(p => ({
      rank: p.rank,
      label: p.action,
      effort: p.effort,
      impact: impactFor(p),
      tooltip: '#'+p.rank+' — '+p.action+' (Esforco: '+(IMP[p.effort]||p.effort)+' / Impacto: '+impLabel[impactFor(p)]+')'
    }));
    const matrixInsight = 'Priorize o quadrante Quick Wins (alto impacto + baixo esforco): retorno rapido com risco e investimento controlados. Grandes Projetos exigem planejamento e budget. Itens no "Revisar" devem ser questionados antes de executar.';
    h += sc('Prioridades — Matriz Esforço × Impacto',
      insight(chartEffortImpact(matrixItems, {title:'Onde atacar primeiro'}), matrixInsight, 'good'));
    h += sc('Prioridades — Detalhamento', tb(['#','Ação','Justificativa','Pilar','Esforço','Impacto'],
      d.priorities.map(p=>{
        const imp = impactFor(p);
        return [
          E(p.rank), E(p.action), E(p.rationale||'—'), E(p.pillar),
          tg(IMP[p.effort]||p.effort,eff[p.effort]),
          tg(impLabel[imp]||imp,impTone[imp])
        ];
      })));
  }
