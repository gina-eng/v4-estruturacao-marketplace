      : '';
    h += sc('Confiança',
      (ta.trust_score!=null
        ? insight(scoreBar(ta.trust_score, 10, {title:'Trust Score', caption:'Referência: 7+/10 = LP transmite confiança ao ICP'}), trustInsight, trustTone)
        : mt('—','Trust Score (0-10)','gray'))
      +(ta.biggest_trust_gap?co('Maior gap: '+ta.biggest_trust_gap):''));
  }
  if (d.test_hypotheses?.length) {
    h += sc('Hipóteses de Teste', tb(['Hipótese','Elemento','Impacto','Dificuldade','Prioridade'],
      d.test_hypotheses.map(t=>[E(t.hypothesis),E(t.element),tg(IMP[t.expected_impact]||'',IMC[t.expected_impact]),
        tg(t.difficulty||'',{easy:'green',medium:'yellow',hard:'red'}[t.difficulty]),tg(t.priority||'',PRI[t.priority])])));
  }
  return h;
},

'ee-s3-manual-marca'(d) {
  // ===== Manual de Marca (Brandbook + MIV unificados) — DOCUMENTACIONAL =====
  // Princípio: este renderer não cria assets visuais (logo, mockups, ícones).
  // Apenas tipografia em escala real e sistema cromático são visualizados.
  // Tudo o mais é texto, tabela ou lista. O designer produz os assets DEPOIS, usando este manual como briefing.
  const esc = E;
  const PURPLE = '#4B1C7D', PURPLE_DARK = '#2E0F55', TURQ = '#00B8BD', BEIGE = '#F6EAD8', MAGENTA = '#A8358C', GRAY = '#2E2E33';
  const safeHex = h => /^#[0-9A-Fa-f]{6}$/.test(h||'') ? h : '#333';

  // PDF export (lazy-load html2pdf on first click)
  if (!window._mmPdfRegistered) {
    window._mmPdfRegistered = true;
    // Inject PDF-specific CSS once (applies when wrapper has .mm-pdf-render class)
    if (!document.getElementById('mm-pdf-styles')) {
      const styleEl = document.createElement('style');
      styleEl.id = 'mm-pdf-styles';
      styleEl.textContent = [
        // Container — let printRoot enforce width
        '#mm-print-root { all:revert; box-sizing:border-box; }',
        '#mm-print-root *, #mm-print-root *::before, #mm-print-root *::after { box-sizing:border-box; }',
        '.mm-pdf-render { width:100% !important; max-width:none !important; margin:0 !important; padding:0 !important; background:#fff !important; color:#1f2937 !important; font-size:12px !important; }',
        '.mm-pdf-render h2, .mm-pdf-render h3 { color:#1f2937 !important; }',
        '.mm-pdf-render * { box-shadow:none !important; }',
        // Override CSS variables in PDF mode (some may not resolve well in cloned context)
        '.mm-pdf-render { --text-primary:#1f2937; --text-secondary:#374151; --text-muted:#6b7280; --bg-surface:#fff; --bg-elevated:#f8fafc; --border:#e5e7eb; --success:#059669; --danger:#dc2626; --warning:#d97706; --accent:#4B1C7D; --radius:8px; }',
        // Aggressive page-break rules
        '.mm-pdf-render .cd, .mm-pdf-render .sc, .mm-pdf-render .sum, .mm-pdf-render .sw, .mm-pdf-render .co, .mm-pdf-render .mt, .mm-pdf-render tr, .mm-pdf-render td, .mm-pdf-render svg, .mm-pdf-render details, .mm-pdf-render pre { page-break-inside:avoid !important; break-inside:avoid !important; }',
        '.mm-pdf-render table { page-break-inside:auto !important; break-inside:auto !important; }',
        '.mm-pdf-render .mm-block-header { page-break-before:always !important; break-before:always !important; margin-top:0 !important; padding-top:0 !important; }',
        '.mm-pdf-render .mm-block-header--first { page-break-before:avoid !important; break-before:avoid !important; }',
        '.mm-pdf-render details { display:block !important; }',
        '.mm-pdf-render details > *:not(summary) { display:block !important; max-height:none !important; }',
        '.mm-pdf-render details summary { list-style:none !important; }',
        '.mm-pdf-render .gr { gap:0.5rem !important; }',
        '.mm-pdf-render .sc { margin-bottom:1rem !important; }',
        '.mm-pdf-render svg { max-width:100% !important; height:auto !important; }',
        '.mm-pdf-render .no-print { display:none !important; }',
        // Ensure cards have proper background
        '.mm-pdf-render .cd { background:#fff !important; border:1px solid #e5e7eb !important; padding:1rem !important; border-radius:8px !important; }',
        '.mm-pdf-render .cd--red { border-left:3px solid #dc2626 !important; }',
        '.mm-pdf-render .cd--green { border-left:3px solid #059669 !important; }',
        '.mm-pdf-render .cd--yellow { border-left:3px solid #d97706 !important; }',
        '.mm-pdf-render .cd--danger { border-left:3px solid #dc2626 !important; }'
      ].join('\n');
      document.head.appendChild(styleEl);
    }

    window.exportManualMarcaPDF = function () {
      const original = document.getElementById('mm-content-wrapper');
      if (!original) { alert('Conteúdo do manual não encontrado.'); return; }
      const btn = document.getElementById('mm-pdf-btn');
      const setBtn = (txt, dis) => { if (btn) { btn.disabled = !!dis; btn.innerHTML = txt; } };
      const ensure = () => new Promise((res, rej) => {
        if (window.html2pdf) return res();
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';
        s.onload = res; s.onerror = rej;
        document.head.appendChild(s);
      });
      setBtn('Carregando biblioteca…', true);

      // The content lives inside a collapsible week container — when collapsed,
      // mm-content-wrapper has 0 dimensions and html2canvas captures blank.
      // Solution: clone into a body-level container kept VISIBLE under a full-screen
      // overlay during capture. The overlay hides the visual flash; html2canvas captures
      // the printRoot which has guaranteed natural layout.
      const PRINT_WIDTH = 740; // px ~ A4 portrait minus margins

      // Full-screen overlay shown during capture so user doesn't see the printRoot
      const overlay = document.createElement('div');
      overlay.id = 'mm-pdf-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.98);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;color:#4B1C7D;font-size:1.125rem;font-weight:600;';
      overlay.innerHTML = '<div style="text-align:center"><div style="margin-bottom:.75rem">Gerando PDF&hellip;</div><div style="font-size:.875rem;font-weight:400;color:#6b7280">Isso pode levar 30 a 60 segundos</div></div>';

      // Print root — in-flow at body level so html2canvas captures real dimensions
      // (position:fixed/absolute breaks dimension calculation in html2canvas iframe clone)
      const printRoot = document.createElement('div');
      printRoot.id = 'mm-print-root';
      printRoot.style.cssText = 'position:relative;width:'+PRINT_WIDTH+'px;background:#fff;padding:0;margin:0;box-sizing:border-box;font-family:Inter, -apple-system, BlinkMacSystemFont, sans-serif;color:#1f2937;font-size:12px;line-height:1.5;overflow:visible;';

      const clone = original.cloneNode(true);
      clone.classList.add('mm-pdf-render');
      // Force the clone to fill the printRoot — !important inline beats CSS rules
      clone.setAttribute('style', 'display:block !important;width:100% !important;max-width:none !important;height:auto !important;min-height:auto !important;margin:0 !important;padding:0 !important;background:#fff !important;color:#1f2937 !important;visibility:visible !important;opacity:1 !important;');

      // Open all <details> in the clone so prompts are visible in PDF
      Array.from(clone.querySelectorAll('details')).forEach(d => d.open = true);

      // Append printRoot FIRST (so layout calculates), then overlay (covers it)
      document.body.appendChild(printRoot);
      printRoot.appendChild(clone);
      document.body.appendChild(overlay);

      // Force layout reflow before html2canvas reads dimensions
      // eslint-disable-next-line no-unused-expressions
      printRoot.offsetHeight;

      const cleanup = () => {
        if (printRoot.parentNode) printRoot.parentNode.removeChild(printRoot);
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      };

      ensure().then(() => {
        setBtn('Gerando PDF (pode levar 30–60s)…', true);
        const clientName = (window.PORTAL_DATA && PORTAL_DATA.client && PORTAL_DATA.client.name) || 'Cliente';
        const filename = clientName.replace(/[^a-zA-Z0-9]+/g, '_') + '_Manual_de_Marca.pdf';
        return html2pdf().set({
          margin: [10, 10, 12, 10],
          filename: filename,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: {
            scale: 1,
            useCORS: true,
            letterRendering: true,
            backgroundColor: '#ffffff',
            windowWidth: PRINT_WIDTH,
            width: PRINT_WIDTH,
            scrollY: 0,
            scrollX: 0,
            x: 0,
            y: 0
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
          pagebreak: {
            mode: ['avoid-all', 'css', 'legacy'],
            before: '.mm-block-header:not(.mm-block-header--first)',
            avoid: ['.cd', '.sc', '.sum', '.sw', '.co', '.mt', 'tr', 'svg', 'details', 'pre']
          }
        }).from(printRoot).save();
      }).then(() => {
        cleanup();
        setBtn('&#x2B07; Exportar PDF', false);
      }).catch(err => {
        console.error(err);
        cleanup();
        setBtn('&#x2B07; Exportar PDF', false);
        alert('Falha ao gerar PDF: ' + (err && err.message ? err.message : 'erro desconhecido'));
      });
    };
  }

  // ─── helpers locais ───
  const blockHeader = (n, title, desc, isFirst) => '<div class="mm-block-header'+(isFirst?' mm-block-header--first':'')+'" style="margin:2.5rem 0 1.25rem;padding:1rem 0;border-bottom:2px solid var(--border);page-break-after:avoid">'
    + '<div style="font-size:.75rem;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;margin-bottom:.25rem">Bloco '+n+'</div>'
    + '<h2 style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.875rem;color:var(--text-primary);letter-spacing:-.01em">'+esc(title)+'</h2>'
    + (desc?'<p style="margin:.375rem 0 0;color:var(--text-muted);font-size:.875rem">'+esc(desc)+'</p>':'')
    + '</div>';

  const quote = (text, label) => '<div style="background:linear-gradient(135deg, '+PURPLE+'08, '+TURQ+'08);border-left:4px solid '+PURPLE+';padding:1.25rem 1.5rem;margin:1rem 0;border-radius:0 var(--radius) var(--radius) 0;page-break-inside:avoid">'
    + (label?'<div style="font-size:.6875rem;letter-spacing:.08em;color:'+PURPLE+';text-transform:uppercase;font-weight:700;margin-bottom:.5rem">'+esc(label)+'</div>':'')
    + '<p style="margin:0;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.125rem;line-height:1.5;color:var(--text-primary)">'+esc(text)+'</p>'
    + '</div>';

  let h = renderLeituraEstrategica(d, { verdictLabel: 'Veredito do Manual de Marca' });

  // ─── PDF button + Web link + wrapper open ───
  // Se houver manual_pdf_url no output canônico, usa link direto pro PDF hospedado
  // (gerado a partir do /marca apresentação web). Senão, fallback para html2pdf.
  h += '<div style="display:flex;justify-content:flex-end;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap" class="no-print">';

  if (d.manual_web_url) {

  }

  h += '</div>';
  h += '<div id="mm-content-wrapper">';

  // ─── Top ───
  if (d.summary) h += sm(d.summary);
  if (d.scope) {

  h += '<div style="display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .875rem;background:'+TURQ+'15;border:1px solid '+TURQ+'40;border-radius:999px;margin-bottom:1rem;margin-left:.5rem"><span style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:'+TURQ+';font-weight:700">Documento</span><span style="font-size:.8125rem;color:var(--text-primary)">Documentacional · Tipografia + Sistema Cromático visualizados; demais blocos em texto/tabela</span></div>';

  // ============================================================
  // BLOCO 1 — Fundamentos Estratégicos
  // ============================================================
  const b1 = d.block1_strategic_foundations || {};
  h += blockHeader(1, 'Fundamentos Estratégicos', 'Manifesto, essência, posicionamento, persona e cultura — a alma da marca.', true);

  if (b1.presentation) {
    const p = b1.presentation;
    if (p.manifesto_short) h += quote(p.manifesto_short, 'Manifesto curto · 1 frase para sticker, bio e capa de deck');
    if (p.manifesto_narrative) h += sc('Manifesto narrativo', '<div style="background:var(--bg-elevated);border-radius:var(--radius);padding:1.5rem;font-family:Fraunces,Georgia,serif;font-size:1.0625rem;line-height:1.7;color:var(--text-primary);white-space:pre-line">'+esc(p.manifesto_narrative)+'</div>');
    if (p.opening_letter) h += sc('Carta de abertura', '<div style="font-style:italic;color:var(--text-secondary);line-height:1.6">'+esc(p.opening_letter)+'</div>');
    if (p.navigation_instructions) h += co('Como navegar este manual: '+p.navigation_instructions);
  }

  if (b1.essence) {
    const e = b1.essence;
    h += sc('Essência da Marca',
      '<div class="gr gr--2">'
      + cd('Propósito (por que existimos)', esc(e.purpose), 'red')
      + cd('Visão (onde queremos chegar)', esc(e.vision), 'green')
      + cd('Missão (o que fazemos hoje)', esc(e.mission), 'yellow')
      + cd('Big Idea', '<span style="font-family:Fraunces,Georgia,serif;font-size:1.0625rem;font-style:italic">'+esc(e.big_idea)+'</span>', 'red')
      + '</div>'
    );
    if (e.promise) h += quote(e.promise, 'Promessa de marca · o que o cliente pode esperar sempre');

    if (e.values?.length) {
      h += sc('Valores · comportamento sim/não', tb(['Valor', 'O que fazemos', 'O que NÃO fazemos'],
        e.values.map(v => [
          '<strong>'+esc(v.name)+'</strong>',
          '<span style="color:var(--success)">&#10003; '+esc(v.behavior_yes)+'</span>',
          '<span style="color:var(--danger)">&#10007; '+esc(v.behavior_no)+'</span>'
        ])
      ));
    }
    if (e.brand_pillars?.length) {
      const cols = e.brand_pillars.length === 4 ? 'gr--2' : 'gr--3';
      h += sc('Pilares de Marca', '<div class="gr '+cols+'">'
        + e.brand_pillars.map((p, i) =>
          cd(esc(p.name), '<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem"><span style="display:inline-flex;align-items:center;justify-content:center;background:'+PURPLE+';color:#fff;width:1.5rem;height:1.5rem;border-radius:50%;font-size:.75rem;font-weight:700;flex-shrink:0">'+(i+1)+'</span><span style="font-size:.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600">Pilar '+(i+1)+'</span></div>'+esc(p.description))
        ).join('')
        + '</div>');
    }
  }

  if (b1.positioning) {
    const po = b1.positioning;
    h += sc('Posicionamento', '<div class="sum"><div class="sum__tag">Statement</div><p class="sum__text" style="font-size:1rem;line-height:1.6">'+esc(po.statement)+'</p></div>');
    if (po.territory) h += co('Território de marca: '+po.territory);

    if (po.archetype_dominant || po.archetype_secondary) {
      h += sc('Arquétipos (Jung/Pearson)',
        '<div class="gr gr--2">'
        + (po.archetype_dominant ? cd(esc(po.archetype_dominant.name), '<div style="display:inline-block;background:'+PURPLE+';color:#fff;padding:.125rem .5rem;border-radius:4px;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:.5rem">Dominante</div>'+esc(po.archetype_dominant.justification), 'red') : '')
        + (po.archetype_secondary ? cd(esc(po.archetype_secondary.name), '<div style="display:inline-block;background:'+TURQ+';color:#fff;padding:.125rem .5rem;border-radius:4px;font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:.5rem">Secundário</div>'+esc(po.archetype_secondary.justification), 'green') : '')
        + '</div>');
    }

    // Matriz competitiva 2x2 — diagrama estratégico estrutural (mantém)
    if (po.competitive_matrix?.competitors?.length) {
      const m = po.competitive_matrix;
      const quadPos = { NE: [0.75, 0.25], NO: [0.25, 0.25], SE: [0.75, 0.75], SO: [0.25, 0.75] };
      const matrix = '<svg viewBox="0 0 600 460" width="100%" style="max-width:600px;display:block;margin:0 auto;background:var(--bg-surface);border-radius:var(--radius);border:1px solid var(--border)">'
        + '<line x1="300" y1="30" x2="300" y2="430" stroke="var(--border)" stroke-width="1"/>'
        + '<line x1="30" y1="230" x2="570" y2="230" stroke="var(--border)" stroke-width="1"/>'
        + '<text x="295" y="22" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="'+GRAY+'">&#8593; Premium / Humanizado</text>'
        + '<text x="305" y="450" text-anchor="start" font-family="Inter, sans-serif" font-size="11" fill="'+GRAY+'">&#8595; Commodity / Pre&#231;o</text>'
        + '<text x="20" y="234" text-anchor="start" font-family="Inter, sans-serif" font-size="11" fill="'+GRAY+'">&#8592; Generalista</text>'
        + '<text x="580" y="234" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="'+GRAY+'">Especialista &#8594;</text>'
        + m.competitors.map((c, i) => {
            const q = (c.quadrant||'').slice(0, 2);
            const [px, py] = quadPos[q] || [0.5, 0.5];
            const jx = ((i*37) % 60) - 30;
            const jy = ((i*53) % 60) - 30;
            const x = 30 + (570 - 30) * px + jx;
            const y = 30 + (430 - 30) * py + jy;
            const isClient = c.is_client || (c.name||'').toLowerCase().includes((PORTAL_DATA?.client?.slug||'').toLowerCase().split('-')[0]) || (c.name||'').toLowerCase().includes('zenvet');
            const r = isClient ? 14 : 8;
            const fill = isClient ? PURPLE : '#fff';
            const stroke = isClient ? PURPLE : '#999';
            return '<g><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>'
              + '<text x="'+(x+r+5)+'" y="'+(y+4)+'" font-family="Inter, sans-serif" font-size="11" font-weight="'+(isClient?'700':'400')+'" fill="'+(isClient?PURPLE:'#333')+'">'+esc(c.name.length>26?c.name.slice(0,24)+'…':c.name)+'</text></g>';
          }).join('')
        + '</svg>';
      h += sc('Matriz competitiva 2×2 (diagrama estratégico)', '<div style="background:var(--bg-elevated);padding:1rem;border-radius:var(--radius)">'+matrix+'</div>');
    }

    if (po.puv) h += quote(po.puv, 'PUV · Proposta Única de Valor');
  }

  // Persona — DOCUMENTACIONAL (sem avatar SVG)
  if (b1.audience_persona) {
    const ap = b1.audience_persona;

      const p = ap.primary_persona;
      const personaCard = '<div style="background:var(--bg-elevated);padding:1.25rem;border-radius:var(--radius);border:1px solid var(--border)">'

        +   '<div style="font-size:.875rem;color:var(--text-muted)">'+esc(p.age||'')+' · '+esc(p.occupation||'')+'</div>'

        + '<table style="width:100%;border-collapse:collapse;font-size:.875rem"><tbody>'
        + (p.income ? '<tr><td style="padding:.375rem .5rem .375rem 0;color:var(--text-muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;width:160px;vertical-align:top">Renda</td><td style="padding:.375rem 0;color:var(--text-primary)">'+esc(p.income)+'</td></tr>' : '')
        + (p.photo_description ? '<tr><td style="padding:.375rem .5rem .375rem 0;color:var(--text-muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;vertical-align:top">Descrição visual</td><td style="padding:.375rem 0;color:var(--text-secondary);font-style:italic">'+esc(p.photo_description)+'</td></tr>' : '')
        + (p.main_pain ? '<tr><td style="padding:.375rem .5rem .375rem 0;color:var(--text-muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;vertical-align:top">Dor principal</td><td style="padding:.375rem 0;color:var(--text-primary);line-height:1.6">'+esc(p.main_pain)+'</td></tr>' : '')
        + (p.purchase_motivators ? '<tr><td style="padding:.375rem .5rem .375rem 0;color:var(--text-muted);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;vertical-align:top">Motivos de compra</td><td style="padding:.375rem 0;color:var(--text-primary);line-height:1.6">'+esc(p.purchase_motivators)+'</td></tr>' : '')
        + '</tbody></table>'
        + (p.quote ? '<div style="margin-top:.75rem;padding:.75rem 1rem;background:'+BEIGE+';border-left:3px solid '+MAGENTA+';border-radius:0 6px 6px 0;font-family:Fraunces,Georgia,serif;font-style:italic;color:#3a3a3a;font-size:.9375rem">"'+esc(p.quote)+'"</div>' : '')
        + '</div>';
      h += sc('Persona Primária', personaCard);
    }
    if (ap.secondary_persona) {
      const s = ap.secondary_persona;
      h += sc('Persona Secundária',
        cd(esc(s.name)+' · '+esc(s.age||'')+' · '+esc(s.occupation||''),
          '<div style="font-size:.875rem;color:var(--text-secondary);line-height:1.6">'+esc(s.main_pain||'')+'</div>'
          + (s.quote ? '<div style="margin-top:.5rem;font-style:italic;color:var(--text-muted);font-size:.8125rem">"'+esc(s.quote)+'"</div>' : ''),
          'yellow')
      );
    }
    if (ap.anti_persona?.profiles?.length) {
      h += sc('Anti-Persona · perfis a NÃO atender ativamente',
        '<div class="gr gr--3">'
        + ap.anti_persona.profiles.map(pr => cd(esc(pr.label), esc(pr.redirect||''), 'danger')).join('')
        + '</div>');

    if (ap.buyer_journey_summary) h += co('Jornada de compra: '+ap.buyer_journey_summary);
  }

  // ============================================================
  // BLOCO 2 — Identidade Verbal
  // ============================================================
  const b2 = d.block2_verbal_identity || {};

  if (b2.personality) {
    const pe = b2.personality;

      // Escalas — diagrama estrutural simples (mantém)
      const scaleViz = '<div style="display:flex;flex-direction:column;gap:.625rem;background:var(--bg-elevated);padding:1.25rem;border-radius:var(--radius)">'
        + pe.scales.map(s => {
            const pos = ((s.position - 1) / 9) * 100;
            return '<div style="display:grid;grid-template-columns:140px 1fr 140px;gap:1rem;align-items:center;font-size:.8125rem">'
              + '<div style="text-align:right;color:var(--text-muted)">'+esc(s.trait_low)+'</div>'
              + '<div style="position:relative;height:8px;background:var(--bg-surface);border-radius:4px;border:1px solid var(--border)">'
              +   '<div style="position:absolute;top:-4px;left:'+pos+'%;width:16px;height:16px;border-radius:50%;background:'+PURPLE+';transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.15)"></div>'
              + '</div>'
              + '<div style="color:var(--text-muted)">'+esc(s.trait_high)+'</div>'
              + '</div>';
          }).join('')
        + '</div>';
      h += sc('Escalas de Personalidade', scaleViz);
    }
    if (pe.archetype_applied) h += co('Arquétipo aplicado: '+pe.archetype_applied);

  }

  if (b2.tone_of_voice) {

          ).join('')
        + '</div>');
    }
    if (tv.channel_variations?.length) {
      h += sc('Variações por canal', tb(['Canal', 'Adaptação'],

      ));

    if (tv.say_dont_say?.length) {
      h += sc('Diga · Não diga · Por quê',

        + tv.say_dont_say.map(s => '<tr style="border-bottom:1px solid var(--border)">'
            + '<td style="padding:.625rem .5rem;vertical-align:top;color:var(--text-muted);font-size:.75rem">'+esc(s.situation)+'</td>'
            + '<td style="padding:.625rem .5rem;vertical-align:top;color:var(--success)">'+esc(s.say)+'</td>'
            + '<td style="padding:.625rem .5rem;vertical-align:top;color:var(--danger)">'+esc(s.dont_say)+'</td>'
            + '<td style="padding:.625rem .5rem;vertical-align:top;color:var(--text-muted);font-size:.75rem">'+esc(s.reason)+'</td>'
            + '</tr>').join('')
        + '</tbody></table></div>');
    }
  }

  if (b2.editorial_guidelines) {
    const eg = b2.editorial_guidelines;
    if (eg.vocabulary_categorized) {
      const vc = eg.vocabulary_categorized;
      const cols = [
        { title: 'Palavras de Essência', sub: 'Transmitem quem somos', words: vc.essence_words || [], color: PURPLE },
        { title: 'Valorizadas e Repetidas', sub: 'Memória de marca', words: vc.valued_repeated || [], color: TURQ },
        { title: 'Conexão com o Público', sub: 'Linguagem do cliente', words: vc.audience_connection || [], color: MAGENTA }
      ];
      h += sc('Vocabulário-chave (categorizado por função)', '<div class="gr gr--3">'
        + cols.map(col => '<div style="background:var(--bg-elevated);padding:1rem;border-radius:var(--radius);border:1px solid var(--border)">'

            + '<div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.625rem">'+esc(col.sub)+'</div>'
            + '<div style="display:flex;flex-wrap:wrap;gap:.375rem">'+col.words.map(w => '<span style="background:'+col.color+'15;color:'+col.color+';padding:.25rem .625rem;border-radius:999px;font-size:.75rem;font-weight:500">'+esc(w)+'</span>').join('')+'</div>'
            + '</div>').join('')
        + '</div>');
    }
    if (eg.official_glossary?.length || eg.forbidden_terms?.length) {
      h += sc('Glossário oficial e termos proibidos', '<div class="gr gr--2">'
        + (eg.official_glossary?.length ? cd('Use sempre',
            '<div style="font-size:.8125rem;line-height:1.7">'+ eg.official_glossary.map(g =>
              '<div style="padding:.25rem 0;border-bottom:1px solid var(--border)"><strong style="color:var(--success)">'+esc(g.term)+'</strong> — <span style="color:var(--text-muted)">'+esc(g.definition)+'</span></div>'
            ).join('')+'</div>','green') : '')
        + (eg.forbidden_terms?.length ? cd('Nunca use',
            '<div style="font-size:.8125rem;line-height:1.7">'+ eg.forbidden_terms.map(f =>
              '<div style="padding:.25rem 0;border-bottom:1px solid var(--border)"><strong style="color:var(--danger);text-decoration:line-through">'+esc(f.term)+'</strong> &#8594; <span style="color:var(--text-muted)">'+esc(f.use_instead)+'</span></div>'
            ).join('')+'</div>','danger') : '')
        + '</div>');
    }
    h += sc('Convenções', '<div class="gr gr--3">'
      + (eg.form_of_address ? cd('Tratamento', esc(eg.form_of_address)) : '')
      + (eg.emoji_punctuation ? cd('Emoji e pontuação', esc(eg.emoji_punctuation)) : '')
      + (eg.grammar_rules ? cd('Regras gramaticais', esc(eg.grammar_rules)) : '')
      + '</div>');
  }

  if (b2.naming_taxonomy) {
    const nt = b2.naming_taxonomy;
    h += sc('Naming e Taxonomia',
      (nt.rule ? '<p style="font-size:.875rem;line-height:1.6;color:var(--text-secondary);margin-bottom:.75rem">'+esc(nt.rule)+'</p>' : '')
      + '<div class="gr gr--2">'
      + (nt.examples_yes?.length ? cd('Exemplos válidos', '<ul style="margin:0;padding-left:1.25rem;font-size:.8125rem;line-height:1.6;color:var(--success)">'+nt.examples_yes.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>', 'green') : '')
      + (nt.examples_no?.length ? cd('Exemplos a evitar', '<ul style="margin:0;padding-left:1.25rem;font-size:.8125rem;line-height:1.6;color:var(--danger)">'+nt.examples_no.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>', 'danger') : '')
      + '</div>');
  }

  if (b2.storytelling?.story_arc) {
    const sa = b2.storytelling.story_arc;
    h += sc('Narrativa em 3 atos',
      cd('Ato 1 — O mundo antes', esc(sa.act1_before), 'danger')
      + cd('Ato 2 — O que fazemos de diferente', esc(sa.act2_different), 'yellow')
      + cd('Ato 3 — O mundo com a marca', esc(sa.act3_after), 'green'));
    if (b2.storytelling.opening_hooks?.length) {
      h += sc('Ganchos de abertura', '<div style="display:flex;flex-direction:column;gap:.5rem">'
        + b2.storytelling.opening_hooks.map(o => '<div style="background:var(--bg-elevated);padding:.75rem 1rem;border-left:3px solid '+TURQ+';border-radius:0 6px 6px 0;font-style:italic;color:var(--text-secondary);font-size:.875rem">"'+esc(o)+'"</div>').join('')
        + '</div>');
    }
  }

  if (b2.slogan_tagline_signatures) {
    const st = b2.slogan_tagline_signatures;
    if (st.tagline) h += quote(st.tagline, 'Tagline · institucional fixa');
    if (st.slogan) h += co('Slogan: '+st.slogan);
    if (st.verbal_signatures?.length) {
      h += sc('Assinaturas verbais', '<div style="display:flex;flex-direction:column;gap:.375rem">'
        + st.verbal_signatures.map(s => '<div style="font-family:Fraunces,Georgia,serif;font-size:.9375rem;color:'+PURPLE+';padding:.5rem .875rem;background:var(--bg-elevated);border-radius:6px">'+esc(s)+'</div>').join('')
        + '</div>');
    }
  }

  // ============================================================
  // BLOCO 3 — Identidade Visual Core
  // (DOCUMENTACIONAL: tipografia + cores são mostradas; logo/ícones/galerias são definidos em texto)
  // ============================================================
  const b3 = d.block3_visual_identity_core || {};
  h += blockHeader(3, 'Identidade Visual Core (MIV)', 'Documentação técnica para o designer construir os assets — apenas tipografia e cores são visualizadas; logo, ícones e galerias são definidos em texto.');

  // Logo — TEXTO PURO (sem mini-ícones, sem visualização do wordmark)
  if (b3.logo) {
    const lg = b3.logo;
    h += sc('Logotipo · conceito e construção',
      (lg.concept ? '<p style="font-size:.9375rem;line-height:1.6;color:var(--text-secondary);margin-bottom:1rem">'+esc(lg.concept)+'</p>' : '')
      + (lg.style_description ? '<div style="background:linear-gradient(135deg, '+PURPLE+'08, '+TURQ+'08);border-left:4px solid '+PURPLE+';padding:1rem 1.25rem;margin-bottom:1rem;border-radius:0 8px 8px 0"><div style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:'+PURPLE+';font-weight:700;margin-bottom:.5rem">Descrição do estilo</div><p style="margin:0;font-size:.9375rem;line-height:1.6;color:var(--text-primary)">'+esc(lg.style_description)+'</p></div>' : '')
      + '<div class="gr gr--3">'
      + (lg.anatomy?.symbol ? cd('Símbolo', esc(lg.anatomy.symbol)) : '')
      + (lg.anatomy?.wordmark ? cd('Wordmark', esc(lg.anatomy.wordmark)) : '')
      + (lg.anatomy?.lockup ? cd('Lockup (assinatura)', esc(lg.anatomy.lockup)) : '')
      + '</div>'
      + '<div class="gr gr--3" style="margin-top:.75rem">'
      + (lg.clear_space ? cd('Área de proteção', esc(lg.clear_space)) : '')
      + (lg.min_max_size?.min_digital_px ? cd('Mínimo digital', esc(lg.min_max_size.min_digital_px)) : '')
      + (lg.min_max_size?.min_print_mm ? cd('Mínimo impresso', esc(lg.min_max_size.min_print_mm)) : '')
      + '</div>'
      + (lg.construction_grid ? '<p style="font-size:.8125rem;color:var(--text-muted);margin-top:.5rem;line-height:1.5"><strong>Grid de construção:</strong> '+esc(lg.construction_grid)+'</p>' : ''));

    // Atributos visuais — tabela de 7 dimensões
    if (lg.visual_attributes) {
      const va = lg.visual_attributes;
      const attrLabels = {
        form_language: 'Linguagem de forma',
        weight: 'Peso',
        balance: 'Equilíbrio',
        negative_space: 'Espaço negativo',
        color_application: 'Aplicação de cor',
        personality_in_form: 'Personalidade na forma',
        scalability: 'Escalabilidade',
        differentiation_from_competitors: 'Diferenciação dos concorrentes'
      };
      const rows = Object.keys(attrLabels).filter(k => va[k]).map(k => [
        '<strong style="color:'+PURPLE+'">'+attrLabels[k]+'</strong>',
        esc(va[k])
      ]);
      if (rows.length) h += sc('Atributos visuais do logo', tb(['Dimensão', 'Especificação'], rows));
    }

    // Princípios de design — lista numerada
    if (lg.design_principles?.length) {
      h += sc('Princípios de design',
        '<ol style="margin:0;padding-left:1.25rem;font-size:.875rem;line-height:1.7;color:var(--text-primary)">'
        + lg.design_principles.map(p => '<li style="margin-bottom:.375rem">'+esc(p)+'</li>').join('')
        + '</ol>');
    }

    if (lg.official_versions?.length) {
      h += sc('Versões oficiais', '<div class="gr gr--3">'
        + lg.official_versions.map(v => cd(esc(v.name), esc(v.use_case))).join('')
        + '</div>');
    }

    // 3 direções — cards textuais (sem mini-ícones SVG)
    if (lg.logo_directions?.length) {
      h += sc('3 direções para o designer testar (Midjourney/Ideogram)',
        '<div class="gr gr--3">'
        + lg.logo_directions.map((dir, i) =>
            '<div class="cd cd--red"><div class="cd__title">Direção '+(i+1)+' · '+esc(dir.direction)+'</div>'
            + '<div class="cd__body">'+esc(dir.concept)+'</div>'
            + '<details style="margin-top:.625rem"><summary style="cursor:pointer;font-size:.75rem;color:'+PURPLE+';font-weight:600">Ver prompt Midjourney &#8594;</summary>'
            + '<pre style="background:var(--bg-elevated);padding:.75rem;border-radius:6px;font-size:.6875rem;line-height:1.5;color:var(--text-secondary);white-space:pre-wrap;word-wrap:break-word;margin-top:.5rem;max-height:240px;overflow:auto;font-family:ui-monospace,monospace">'+esc(dir.prompt)+'</pre></details>'
            + '</div>'
          ).join('')
        + '</div>'
        + (lg.chosen_direction ? co('Direção escolhida: '+lg.chosen_direction) : ''));
    }
  }

  // Galeria "nunca faça" — TABELA TEXTUAL (sem demo visual de wordmark)
  if (b3.incorrect_uses?.length) {
    h += sc('Nunca faça · regras de aplicação do logo', tb(['Regra', 'Razão técnica'],
      b3.incorrect_uses.map(u => [
        '<span style="color:var(--danger)">&#10007; '+esc(u.rule)+'</span>',
        '<span style="color:var(--text-secondary)">'+esc(u.reason)+'</span>'
      ])
    ));
  }

  // Sistema cromático — VISUALIZADO (paleta + 60-30-10 + WCAG)
  if (b3.color_system) {
    const cs = b3.color_system;
    const allCo = [].concat(cs.primary||[], cs.secondary||[], cs.neutrals||[], cs.functional||[]);

    const swatchCard = (c) => {
      const isLight = ['#F6EAD8','#FFFFFF','#ffffff'].includes(c.hex);
      const txt = isLight ? '#2E2E33' : '#FFFFFF';
      return '<div style="border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);page-break-inside:avoid">'
        + '<div style="background:'+safeHex(c.hex)+';color:'+txt+';padding:1.25rem 1rem;min-height:140px;display:flex;flex-direction:column;justify-content:space-between">'
        +   '<div style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;opacity:.9">'+esc(c.role||'')+'</div>'
        +   '<div><div style="font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.125rem">'+esc(c.name)+'</div>'
        +   '<div style="font-family:Inter,monospace;font-size:.875rem;font-weight:500;opacity:.85">'+esc(c.hex.toUpperCase())+'</div></div>'
        + '</div>'
        + '<div style="background:var(--bg-elevated);padding:.625rem 1rem;font-size:.6875rem;color:var(--text-muted);line-height:1.5">'
        +   '<div>RGB '+esc(c.rgb)+'</div>'
        +   '<div>CMYK '+esc(c.cmyk)+'</div>'
        +   (c.pantone ? '<div>'+esc(c.pantone)+'</div>' : '')
        + '</div>'
        + '</div>';
    };

    h += sc('Sistema cromático · paleta completa',
      '<div class="gr gr--3" style="grid-auto-rows:auto">'
      + allCo.map(c => swatchCard(c)).join('')
      + '</div>'
      + (allCo[0]?.justification ? '<div style="margin-top:.75rem;padding:.875rem 1rem;background:var(--bg-elevated);border-left:3px solid '+PURPLE+';border-radius:0 6px 6px 0;font-size:.8125rem;color:var(--text-secondary);line-height:1.5"><strong style="color:var(--text-primary)">Por quê:</strong> '+esc(allCo[0].justification)+'</div>' : ''));

    if (cs.proportions) {
      const pr = cs.proportions;
      const proportionBar = '<div style="display:flex;height:80px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)">'
        + '<div style="flex:'+pr.dominant_pct+';background:'+safeHex(pr.dominant_color)+';display:flex;align-items:center;justify-content:center;color:'+(['#FFFFFF','#F6EAD8'].includes(pr.dominant_color)?'#2E2E33':'#fff')+';font-weight:700;font-size:1.25rem;font-family:Fraunces,serif">'+pr.dominant_pct+'%</div>'
        + '<div style="flex:'+pr.support_pct+';background:'+safeHex(pr.support_color)+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.125rem;font-family:Fraunces,serif">'+pr.support_pct+'%</div>'
        + '<div style="flex:'+pr.accent_pct+';background:'+safeHex(pr.accent_color)+';display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1rem;font-family:Fraunces,serif">'+pr.accent_pct+'%</div>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;margin-top:.5rem;font-size:.75rem;color:var(--text-muted)">'
        +   '<span>Dominante · '+esc(pr.dominant_color)+'</span>'
        +   '<span>Apoio · '+esc(pr.support_color)+'</span>'
        +   '<span>Destaque · '+esc(pr.accent_color)+'</span>'
        + '</div>'
        + (pr.rule ? '<p style="font-size:.8125rem;color:var(--text-secondary);margin:.75rem 0 0;line-height:1.5">'+esc(pr.rule)+'</p>' : '');
      h += sc('Proporção 60-30-10', proportionBar);
    }

    if (cs.wcag_contrast_matrix?.length) {
      const lvlColor = { 'AAA':'green', 'AA':'yellow', 'AA Large':'gray', 'Fail':'red' };
      h += sc('Matriz de contraste WCAG · acessibilidade',
        '<div class="gr gr--2">'
        + cs.wcag_contrast_matrix.map(w =>
            '<div style="display:flex;align-items:center;gap:1rem;padding:.75rem;background:var(--bg-elevated);border-radius:var(--radius);border:1px solid var(--border)">'
            + '<div style="display:flex;flex-direction:column;align-items:center;gap:.25rem">'
            +   '<div style="width:64px;height:32px;background:'+safeHex(w.background)+';border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:Fraunces,serif;font-weight:700;font-size:.875rem;color:'+safeHex(w.foreground)+'">Aa</div>'
            +   '<div style="font-size:.625rem;color:var(--text-muted)">'+esc(w.foreground)+' / '+esc(w.background)+'</div>'
            + '</div>'
            + '<div style="flex:1">'
            +   '<div style="font-size:.8125rem;font-weight:600;color:var(--text-primary);margin-bottom:.125rem">'+esc(w.label||'')+'</div>'
            +   '<div style="font-size:.75rem;color:var(--text-muted)">Ratio '+w.ratio+':1 ' + tg(w.level, lvlColor[w.level]||'gray')+'</div>'
            + '</div>'
            + '</div>'
          ).join('')
        + '</div>');
    }
  }

  // Tipografia — VISUALIZADA (escala REAL)
  if (b3.typography) {
    const tp = b3.typography;
    if (tp.primary_family || tp.secondary_family) {
      const fontCard = (f, role, color, fontWeight, fontFamilyFallback) => {
        if (!f) return '';
        const links = [];
        if (f.google_fonts_url) links.push('<a href="'+esc(f.google_fonts_url)+'" target="_blank" rel="noopener" style="color:'+PURPLE+';text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:.25rem"><span style="font-size:.875rem">&#x1F517;</span> Ver no Google Fonts</a>');
        if (f.embed_url) links.push('<details style="display:inline-block;vertical-align:top;margin-left:.5rem"><summary style="cursor:pointer;color:'+TURQ+';font-size:.75rem;font-weight:600">Embed CSS &#8594;</summary><pre style="background:var(--bg-elevated);padding:.5rem;border-radius:4px;font-size:.625rem;line-height:1.4;color:var(--text-secondary);white-space:pre-wrap;word-wrap:break-word;margin-top:.375rem;font-family:ui-monospace,monospace">&lt;link href="'+esc(f.embed_url)+'" rel="stylesheet"&gt;</pre></details>');
        return '<div class="cd'+(role==='primary'?' cd--red':'')+'">'
          + '<div style="font-family:'+f.name+','+fontFamilyFallback+';font-size:3rem;font-weight:'+fontWeight+';line-height:1;color:'+color+';margin-bottom:.5rem">Aa</div>'
          + '<div class="cd__title">'+esc(f.name)+' <span style="color:var(--text-muted);font-weight:400">&middot; '+(role==='primary'?'primária (títulos)':'secundária (corpo)')+'</span></div>'
          + '<div class="cd__body">'+esc(f.source||'')+' &middot; '+(f.weights_permitted||[]).join(', ')+'</div>'
          + (links.length ? '<div style="margin-top:.625rem;font-size:.8125rem">'+links.join('')+'</div>' : '')
          + (f.license ? '<div class="cd__meta">'+esc(f.license)+'</div>' : '')
          + '</div>';
      };
      h += sc('Famílias tipográficas',
        '<div class="gr gr--2">'
        + fontCard(tp.primary_family, 'primary', PURPLE, '700', 'Georgia,serif')
        + fontCard(tp.secondary_family, 'secondary', GRAY, '600', 'sans-serif')
        + '</div>');
    }
    if (tp.hierarchy?.length) {
      h += sc('Hierarquia tipográfica · escala real',
        '<div style="background:#fff;padding:1.5rem;border-radius:var(--radius);border:1px solid var(--border)">'
        + tp.hierarchy.map(lvl => {
            const w = (lvl.weight.match(/\d+/)||['400'])[0];
            const previewSize = Math.min(lvl.size_px, 56);
            return '<div style="display:grid;grid-template-columns:90px 1fr 220px;gap:1.5rem;align-items:baseline;padding:.875rem 0;border-bottom:1px solid var(--border)">'
              + '<div style="font-size:.6875rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700">'+esc(lvl.level)+'</div>'
              + '<div style="font-family:'+lvl.font+',Georgia,serif;font-weight:'+w+';font-size:'+previewSize+'px;line-height:1.2;color:#2E2E33">Seu gato merece</div>'
              + '<div style="font-size:.6875rem;color:var(--text-muted);text-align:right;line-height:1.4">'+esc(lvl.font+' '+lvl.weight)+'<br>'+lvl.size_px+'px / lh '+esc(lvl.line_height||'1.5')+'<br><span style="color:var(--text-muted);font-style:italic">'+esc(lvl.use_case)+'</span></div>'
              + '</div>';
          }).join('')
        + '</div>'
        + (tp.justification ? '<p style="font-size:.8125rem;color:var(--text-secondary);margin:.75rem 0 0;line-height:1.5"><strong>Por quê:</strong> '+esc(tp.justification)+'</p>' : '')
        + (tp.fallbacks ? '<p style="font-size:.75rem;color:var(--text-muted);margin:.5rem 0 0;line-height:1.5"><strong>Fallbacks:</strong> '+esc(tp.fallbacks)+'</p>' : ''));
    }
  }

  // Iconografia — TEXTO PURO (sem ícones desenhados)
  if (b3.iconography) {
    const ic = b3.iconography;
    h += sc('Iconografia · regras de construção',
      '<div class="gr gr--2">'
      + cd('Princípios visuais', esc(ic.style||''))
      + cd('Specs',
          '<div style="font-size:.8125rem;line-height:1.7">'
          + (ic.stroke_weight_px ? '<div><strong>Stroke:</strong> '+ic.stroke_weight_px+'px</div>' : '')
          + (ic.corner_style ? '<div><strong>Cantos:</strong> '+esc(ic.corner_style)+'</div>' : '')
          + (ic.grid ? '<div><strong>Grid:</strong> '+esc(ic.grid)+'</div>' : '')
          + (ic.color_default ? '<div><strong>Cor padrão:</strong> '+esc(ic.color_default)+'</div>' : '')
          + '</div>')
      + '</div>'
      + (ic.do_dont?.length ? '<div class="gr gr--2" style="margin-top:.75rem">'
          + cd('Faça', ic.do_dont.filter(x=>x.type==='do').map(x=>'<div style="margin-bottom:.25rem;color:var(--success);font-size:.8125rem">&#10003; '+esc(x.rule)+'</div>').join(''), 'green')
          + cd('Não faça', ic.do_dont.filter(x=>x.type==='dont').map(x=>'<div style="margin-bottom:.25rem;color:var(--danger);font-size:.8125rem">&#10007; '+esc(x.rule)+'</div>').join(''), 'danger')
          + '</div>' : ''));
  }

  // Fotografia — TEXTO PURO
  if (b3.photography) {
    const ph = b3.photography;
    h += sc('Fotografia · direção de arte',
      (ph.art_direction ? '<p style="font-size:.875rem;color:var(--text-secondary);line-height:1.6;margin-bottom:.75rem">'+esc(ph.art_direction)+'</p>' : '')
      + (ph.mood_keywords?.length ? '<div style="display:flex;flex-wrap:wrap;gap:.375rem;margin-bottom:.75rem">'+ph.mood_keywords.map(m=>'<span class="tg tg--gray" style="font-size:.75rem">'+esc(m)+'</span>').join('')+'</div>' : '')
      + (ph.color_treatment ? '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.5rem"><strong>Tratamento de cor:</strong> '+esc(ph.color_treatment)+'</p>' : '')
      + (ph.stock_rules ? '<p style="font-size:.8125rem;color:var(--text-muted);margin-bottom:.5rem"><strong>Stock:</strong> '+esc(ph.stock_rules)+'</p>' : '')
      + (ph.do_dont?.length ? '<div class="gr gr--2">'
          + cd('Faça', ph.do_dont.filter(x=>x.type==='do').map(x=>'<div style="margin-bottom:.25rem;color:var(--success);font-size:.8125rem">&#10003; '+esc(x.rule)+'</div>').join(''), 'green')
          + cd('Não faça', ph.do_dont.filter(x=>x.type==='dont').map(x=>'<div style="margin-bottom:.25rem;color:var(--danger);font-size:.8125rem">&#10007; '+esc(x.rule)+'</div>').join(''), 'danger')
          + '</div>' : ''));
  }

  if (b3.illustration) {
    const il = b3.illustration;
    h += sc('Ilustração · direção',
      (il.style ? '<p style="font-size:.875rem;line-height:1.6;color:var(--text-secondary);margin-bottom:.5rem">'+esc(il.style)+'</p>' : '')
      + (il.use_cases?.length ? '<div><strong style="font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)">Casos de uso:</strong><ul style="margin:.25rem 0 0;padding-left:1.25rem;font-size:.8125rem;line-height:1.6;color:var(--text-secondary)">'+il.use_cases.map(u=>'<li>'+esc(u)+'</li>').join('')+'</ul></div>' : ''));
  }

  // ============================================================
  // BLOCO 4 — Aplicações (DOCUMENTACIONAL — sem mockups visuais)
  // ============================================================
  const b4 = d.block4_applications || {};
  h += blockHeader(4, 'Aplicações e Artefatos', 'Specs textuais de cada aplicação para o designer construir os mockups.');

  if (b4.principle) h += co('Princípio: '+b4.principle);

  if (b4.applications?.length) {
    const catLabels = {
      stationery: 'Papelaria',
      digital_ui: 'Digital / UI',
      social_media: 'Redes Sociais',
      sales_marketing: 'Vendas / Marketing',
      signage: 'Sinalização',
      events: 'Eventos'
    };
    const catColors = {
      stationery: PURPLE,
      digital_ui: TURQ,
      social_media: MAGENTA,
      sales_marketing: '#F59E0B',
      signage: GRAY,
      events: PURPLE_DARK
    };
    h += '<div class="gr gr--2" style="grid-auto-rows:auto">'
      + b4.applications.map(app => {
          const catColor = catColors[app.category] || GRAY;
          const catLabel = catLabels[app.category] || app.category;
          return '<div class="cd" style="page-break-inside:avoid">'
            + '<div style="display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem">'
            +   '<div class="cd__title" style="margin:0">'+esc(app.name)+'</div>'
            +   '<span style="background:'+catColor+'15;color:'+catColor+';padding:.125rem .5rem;border-radius:4px;font-size:.625rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;flex-shrink:0">'+esc(catLabel)+'</span>'
            + '</div>'
            + '<div style="background:var(--bg-elevated);padding:.75rem .875rem;border-radius:6px;font-size:.8125rem;line-height:1.6;color:var(--text-secondary);margin-bottom:.5rem"><strong style="color:var(--text-primary);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.25rem">Specs técnicas</strong>'+esc(app.specs)+'</div>'
            + (app.mockup?.description ? '<div style="font-size:.75rem;color:var(--text-muted);line-height:1.5;font-style:italic"><strong style="font-style:normal;color:var(--text-primary);font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;font-style:normal">Mockup pretendido</strong> — '+esc(app.mockup.description)+'</div>' : '')
            + '</div>';
        }).join('')
      + '</div>';
  }

  // ============================================================
  // BLOCO 5 — Governança e Operação
  // ============================================================
  const b5 = d.block5_governance || {};
  h += blockHeader(5, 'Governança e Operação', 'Quem aprova o quê, em quanto tempo, e quando o manual é revisto.');

  if (b5.brand_owner) {
    h += sc('Brand Owner', '<div style="background:linear-gradient(135deg, '+PURPLE+'12, '+TURQ+'08);border-left:4px solid '+PURPLE+';padding:1.25rem 1.5rem;border-radius:0 var(--radius) var(--radius) 0">'
      + '<div style="font-size:.6875rem;letter-spacing:.06em;text-transform:uppercase;color:'+PURPLE+';font-weight:700;margin-bottom:.5rem">Guardião final da marca</div>'
      + '<p style="margin:0;font-size:.9375rem;line-height:1.6;color:var(--text-primary)">'+esc(b5.brand_owner)+'</p>'
      + '</div>');
  }

  if (b5.approval_process?.length) {
    h += sc('Processo de aprovação',
      '<div style="display:flex;align-items:stretch;gap:.75rem;flex-wrap:wrap;margin-top:.5rem">'
      + b5.approval_process.map((s, i) =>
          '<div style="flex:1;min-width:180px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;position:relative">'
          + '<div style="position:absolute;top:-10px;left:1rem;background:'+PURPLE+';color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700">'+(i+1)+'</div>'
          + '<div style="font-size:.875rem;font-weight:600;color:var(--text-primary);margin-top:.25rem;margin-bottom:.375rem">'+esc(s.step)+'</div>'
          + '<div style="font-size:.75rem;color:var(--text-muted);margin-bottom:.25rem">'+esc(s.responsible)+'</div>'
          + (s.estimated_time ? '<div style="font-size:.6875rem;color:'+TURQ+';font-weight:600">&#9201; '+esc(s.estimated_time)+'</div>' : '')
          + '</div>'

  }

  if (b5.review_cadence) h += co('Cadência de revisão: '+b5.review_cadence);

},

    const googElems = br.google_ads_textual_elements;
    if (meta != null && goog != null) {
      h += '<div class="gr gr--3">'
        + mt(d.total_variations,'Anúncios Prontos','red')
        + mt(meta,'Meta Ads','blue','1 variação = 1 anúncio completo (texto + headline + descrição + CTA).')
        + mt(goog+(googElems?' ('+googElems+' elem.)':''),'Google Ads RSA','blue','1 RSA = 1 anúncio com 5 headlines + 3 descriptions que o Google rotaciona.')
        + '</div>';

  }

  const allCreatives = {};
  try {
    const cr = (window.PORTAL_DATA && PORTAL_DATA.outputs && PORTAL_DATA.outputs['ee-s3-criativos-anuncios'] && PORTAL_DATA.outputs['ee-s3-criativos-anuncios'].produced_creatives) || {};
    [].concat(cr.feed_instagram||[], cr.stories_instagram||[]).forEach(c => { allCreatives[c.id] = c; });
  } catch(e) {}
  const pairChip = (cid) => {

      +'<span style="display:inline-block;width:14px;height:14px;border-radius:2px;background:#FBF4E4 url(\''+E(c.url)+'\') center/cover no-repeat;flex-shrink:0"></span>'
      +'<code>'+E(cid)+'</code>'
      +'</a>';
  };

  if (d.funnel_stages?.length) {
    const fn = {topo_de_funil:'Topo de Funil',meio_de_funil:'Meio de Funil',fundo_de_funil:'Fundo de Funil',remarketing:'Remarketing'};
    const toneByStage = {topo_de_funil:'blue',meio_de_funil:'yellow',fundo_de_funil:'green',remarketing:'red'};
    const stageData = d.funnel_stages.map(s=>{
      const count = (s.platforms||[]).reduce((sum,p)=>sum+(p.variations?.length||0),0);
      return {label: fn[s.name]||s.name, value: count, tone: toneByStage[s.name]||'gray'};
    }).filter(x=>x.value>0);
    if (stageData.length >= 2) {
      const top = [...stageData].sort((a,b)=>b.value-a.value)[0];
      const fund = stageData.find(x=>x.label.includes('Fundo'));
      const distInsight = 'Maior volume em "'+top.label+'" ('+top.value+' variações). '
        +(fund && fund.value < top.value/2 ? 'Atenção: fundo de funil sub-representado — leads quentes podem ficar sem copy dedicada.' : 'Mix coerente entre etapas.');
      h += sc('Distribuição de Copy por Estágio',
        insight(chartDonut(stageData, {title:'Variações por Funil'}),
          distInsight, fund && fund.value < top.value/2 ? 'warn' : 'good'));
    }

    const hookLbl = {dor:'Dor',resultado:'Resultado',curiosidade:'Curiosidade',social_proof:'Prova Social',prova_social:'Prova Social',urgencia:'Urgência',indignacao:'Indignação',reconhecimento:'Reconhecimento',comparacao:'Comparação',transparencia:'Transparência',oferta_direta:'Oferta Direta',facilitacao:'Facilitação',secundaria_caes:'Cães',reconhecimento_continuidade:'Reconhecimento',objecao_estresse:'Objeção'};
    const hookTone = {dor:'danger',prova_social:'green',resultado:'green',oferta_direta:'green',transparencia:'blue',comparacao:'yellow',facilitacao:'blue',reconhecimento:'gray',reconhecimento_continuidade:'gray',indignacao:'danger',objecao_estresse:'yellow',secundaria_caes:'gray',social_proof:'green',curiosidade:'yellow',urgencia:'danger'};

    d.funnel_stages.forEach(stage => {
      const stageName = fn[stage.name] || stage.name;
      let stageInner = '';
      if (stage.objective) stageInner += '<p style="margin:0 0 .375rem;font-size:.8125rem;color:var(--text-secondary);line-height:1.55"><strong style="color:var(--text-primary)">Objetivo:</strong> '+E(stage.objective)+'</p>';
      if (stage.tone) stageInner += '<p style="margin:0 0 .875rem;font-size:.75rem;color:var(--text-muted);line-height:1.5"><strong>Tom:</strong> '+E(stage.tone)+'</p>';

      (stage.platforms||[]).forEach(plat => {
        const platName = plat.name === 'meta_ads' ? 'Meta Ads' : (plat.name === 'google_ads' ? 'Google Ads (RSA)' : plat.name);
        const platColor = plat.name === 'meta_ads' ? TURQ_LOCAL : PURPLE_LOCAL;
        stageInner += '<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+platColor+';margin:.875rem 0 .5rem">'+E(platName)+'</div>';

        (plat.variations||[]).forEach(v => {
          if (plat.name === 'google_ads') {
            stageInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem;margin-bottom:.5rem">';
            if (v.match_intent) stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);margin-bottom:.5rem;font-style:italic"><strong>Intenção:</strong> '+E(v.match_intent)+'</div>';
            if (v.headlines?.length) {
              stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);font-weight:600;margin:.25rem 0">Headlines (≤30 chars)</div>'
                + '<ul style="margin:0 0 .625rem;padding-left:1rem;font-size:.8125rem;line-height:1.55">'
                + v.headlines.map((hd,i) => '<li>'+E(hd)+' <span style="color:var(--text-muted);font-size:.625rem">('+(v.char_count_headlines?.[i]!=null?v.char_count_headlines[i]:hd.length)+')</span></li>').join('')
                + '</ul>';
            }
            if (v.descriptions?.length) {
              stageInner += '<div style="font-size:.6875rem;color:var(--text-muted);font-weight:600;margin:.25rem 0">Descriptions (≤90 chars)</div>'
                + '<ul style="margin:0;padding-left:1rem;font-size:.8125rem;line-height:1.55">'
                + v.descriptions.map((dx,i) => '<li>'+E(dx)+' <span style="color:var(--text-muted);font-size:.625rem">('+(v.char_count_descriptions?.[i]!=null?v.char_count_descriptions[i]:dx.length)+')</span></li>').join('')
                + '</ul>';
            }
            stageInner += '</div>';
          } else {
            const accent = (v.hook_type==='dor'||v.hook_type==='indignacao') ? 'var(--danger)' : TURQ_LOCAL;
            stageInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid '+accent+';border-radius:6px;padding:.75rem .875rem;margin-bottom:.5rem">'
              + '<div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem">'
                + (v.hook_type ? tg(hookLbl[v.hook_type]||v.hook_type, hookTone[v.hook_type]||'gray') : '')
                + (v.type ? '<code style="font-size:.625rem;color:var(--text-muted)">'+E(v.type)+'</code>' : '')
              + '</div>'
              + (v.text ? '<p style="margin:0 0 .5rem;font-size:.875rem;line-height:1.5;color:var(--text-primary)">'+E(v.text)+'</p>' : '')
              + '<div style="display:flex;flex-wrap:wrap;gap:.875rem;font-size:.75rem;color:var(--text-secondary);margin-bottom:.25rem">'
                + (v.headline ? '<span><strong style="color:var(--text-muted)">Headline:</strong> '+E(v.headline)+'</span>' : '')
                + (v.description ? '<span><strong style="color:var(--text-muted)">Desc:</strong> '+E(v.description)+'</span>' : '')
                + (v.cta ? '<span><strong style="color:var(--text-muted)">CTA:</strong> '+E(v.cta)+'</span>' : '')
              + '</div>'
              + (v.char_count ? '<div style="font-size:.625rem;color:var(--text-muted);margin-top:.25rem">char_count — text: '+(v.char_count.text!=null?v.char_count.text:'?')+' · headline: '+(v.char_count.headline!=null?v.char_count.headline:'?')+' · desc: '+(v.char_count.description!=null?v.char_count.description:'?')+'</div>' : '')
              + (v.pair_with_creative?.length ? '<div style="margin-top:.5rem;display:flex;flex-wrap:wrap;gap:.25rem;align-items:center"><span style="font-size:.625rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-right:.25rem">Pareia com:</span>'+v.pair_with_creative.map(pairChip).join('')+'</div>' : '')
              + '</div>';
          }
        });
      });

      h += sc(stageName, stageInner);
    });
  }

  // Limites de caracteres
  if (d.char_limits_reference) {
    const lim = d.char_limits_reference;
    let limInner = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem">';
    if (lim.meta_ads) {
      limInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+TURQ_LOCAL+';margin-bottom:.5rem">Meta Ads</div>'
        +'<div style="font-size:.8125rem;line-height:1.7;color:var(--text-secondary)">'
          +'<div>Texto: ≤<strong>'+E(lim.meta_ads.primary_text_max)+'</strong> chars</div>'
          +'<div>Headline: ≤<strong>'+E(lim.meta_ads.headline_max)+'</strong> chars</div>'
          +'<div>Descrição: ≤<strong>'+E(lim.meta_ads.description_max)+'</strong> chars</div>'
        +'</div>'
        +(lim.meta_ads.note?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.5rem;font-style:italic">'+E(lim.meta_ads.note)+'</div>':'')
      +'</div>';
    }
    if (lim.google_ads) {
      limInner += '<div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:'+PURPLE_LOCAL+';margin-bottom:.5rem">Google Ads (RSA)</div>'
        +'<div style="font-size:.8125rem;line-height:1.7;color:var(--text-secondary)">'
          +'<div>Headline: ≤<strong>'+E(lim.google_ads.headline_max)+'</strong> chars</div>'
          +'<div>Descrição: ≤<strong>'+E(lim.google_ads.description_max)+'</strong> chars</div>'
        +'</div>'
        +(lim.google_ads.note?'<div style="font-size:.6875rem;color:var(--text-muted);margin-top:.5rem;font-style:italic">'+E(lim.google_ads.note)+'</div>':'')
      +'</div>';
    }
    limInner += '</div>';
    h += sc('Limites de Caracteres', limInner);
  }

  // Estratégia de teste
  if (d.test_strategy) {
    const ts = d.test_strategy;
    let tsInner = '<div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:.875rem">';
    if (ts.duration_min_days) tsInner += mt(ts.duration_min_days+' dias','Duração mínima','blue');
    if (ts.min_budget_per_adset_brl) tsInner += mt('R$ '+ts.min_budget_per_adset_brl+'/dia','Budget min/adset','blue');
    tsInner += '</div>';
    tsInner += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.75rem">';
    if (ts.kpis_kill_criteria?.length) {
      tsInner += '<div style="background:var(--bg-elevated);border:1px solid var(--danger);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--danger);margin-bottom:.5rem">Critérios de pausa</div>'
        +'<ul style="margin:0;padding-left:1.125rem;font-size:.8125rem;line-height:1.55;color:var(--text-secondary)">'
        + ts.kpis_kill_criteria.map(k=>'<li>'+E(k)+'</li>').join('')
        +'</ul></div>';
    }
    if (ts.kpis_winners?.length) {
      tsInner += '<div style="background:var(--bg-elevated);border:1px solid var(--success);border-radius:8px;padding:.75rem .875rem">'
        +'<div style="font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--success);margin-bottom:.5rem">Critérios de winner</div>'
        +'<ul style="margin:0;padding-left:1.125rem;font-size:.8125rem;line-height:1.55;color:var(--text-secondary)">'
        + ts.kpis_winners.map(k=>'<li>'+E(k)+'</li>').join('')
        +'</ul></div>';
    }
    tsInner += '</div>';
    h += sc('Estratégia de Teste', tsInner);
  }

  if (d.copy_rules_applied?.length) {
    h += sc('Regras de Copy Aplicadas', '<ul class="cl">'+d.copy_rules_applied.map(r=>'<li><span class="cl__icon cl__icon--done">&#10003;</span><span>'+E(r)+'</span></li>').join('')+'</ul>');
  }
  return h;
