beu uma exigência do IPAAM e só quer 'poder tocar a operação em paz' com um responsável que domine direito E engenharia ambiental.","summary_headline":"ICP B2B industrial sob risco regulatório (postos, estaleiros, indústria do PIM): compra em comitê, por medo de embargo, não por preço. Persona: Ricardo, o gestor que só quer 'tocar a operação em paz'.","summary_highlights":[{"category":"posicao","label":"Perfil de compra","value":"B2B / Comitê","subtext":"Decisão técnica + orçamentária, racional e movida por risco","tone":"blue"},{"category":"oportunidade","label":"Gatilho de busca","value":"Exigência regulatória","subtext":"Lei 15.190/2025 e fiscalização IPAAM disparam a procura","tone":"green"},{"category":"risco","label":"Motivo nº 1 de perda","value":"'O lead sumiu'","subtext":"Vaza entre proposta e fechamento — não é objeção de preço","tone":"red"},{"category":"janela","label":"Ciclo de decisão","value":"~15 dias","subtext":"Curto quando há urgência regulatória concreta","tone":"yellow"},{"category":"competicao","label":"Onde encontrá-lo","value":"Google + indicação","subtext":"NÃO está no Instagram; vive em LinkedIn e busca local","tone":"blue"}],"summary_key_findings":[{"category":"contexto","text":"O ICP da Lucena é categoricamente B2B com comitê de compra — três papéis: o responsável ambiental/operacional que sente a dor e inicia a busca (sementinha), o gestor/diretor operacional que valida (multiplicador) e o diretor executivo/sócio que libera o orçamento (decisor). Reduzir isso a uma persona B2C de redes sociais seria o erro estratégico fatal: o próprio Aldo declarou que o alvo são 'empresas que não estão em redes sociais'."},{"category":"vantagem","text":"A demanda é regulatória e quase inelástica: a empresa não escolhe se vai licenciar, a lei obriga. Isso significa willingness-to-pay alta quando o custo de NÃO fazer (embargo, multa, operação parada) fica claro. A persona é pragmática e técnica — reage a 'sua operação pode parar', não a 'qualidade e compromisso'. O diferencial não-copiável do Aldo (advogado + engenheiro ambiental + mestre numa só pessoa) responde exatamente à dor de 'preciso de quem entenda o direito E a engenharia'."},{"category":"ameaca","text":"Há dois pontos de vazamento. (1) Quando o lead NÃO vem por indicação direta, a Lucena é invisível — não aparece no Google nem tem prova social, então o lead morno escolhe um concorrente achável. (2) Já dentro do funil, o motivo nº 1 de perda ('o lead sumiu') acontece entre proposta e fechamento, por falta de cadência — exatamente onde uma persona pragmática, ocupada e sem urgência percebida, esquece e não retorna."},{"category":"acao","text":"Toda a comunicação, canais e criativos devem ser B2B: LinkedIn de autoridade, busca local (GMB + SEO 'licenciamento ambiental Manaus'), associações setoriais (CIEAM, FIEAM, Sindicombustíveis) — e NUNCA tratar o cliente como B2C de Instagram. A mensagem-chave precisa ancorar em segurança jurídica e continuidade operacional, e o follow-up precisa ser sistematizado para não perder a persona que 'vai pensar e te retorna'."}],"icp":{"demographics":{"type":"B2B","age_range":"Empresas de médio a grande porte — faturamento estimado de ~R$ 5M a R$ 300M+/ano [E]","income_or_revenue":"Faturamento anual a partir de ~R$ 5M; característica-chave é o alto custo de paralisação (cada dia de operação embargada custa muito mais que a consultoria).","location":"Manaus e Região Metropolitana, interior do Amazonas e região Norte — com concentração no Polo Industrial de Manaus, no eixo de postos/combustíveis e na logística/transporte fluvial.","company_size":"De ~20 a 500+ funcionários; o traço definidor não é o nº de pessoas, mas possuir ativos físicos licenciáveis (planta industrial, posto, estaleiro, embarcação, empreendimento) sujeitos a fiscalização.","decision_maker_role":"Comitê de compra de 3 papéis: (1) iniciador/sementinha = responsável ambiental, engenheiro ou gestor operacional que recebe a exigência; (2) multiplicador = diretor/gerente operacional que valida a necessidade; (3) decisor = diretor executivo ou sócio-proprietário que aprova o orçamento.","education":"Decisores com formação superior (engenharia, administração, direito); responsáveis técnicos com formação ambiental, de segurança ou administrativa.","other":{"setores_alvo":"Postos de combustíveis, estaleiros e produção de embarcações, indústria do Polo Industrial de Manaus, construção civil, mineração (areia/argila/saibro/ouro), agronegócio/piscicultura, logística fluvial.","gatilho_regulatorio":"Sujeitos a licenciamento do IPAAM (estadual), SEMMAS/Manaus (municipal — 64 de 131 atividades, incl. postos) e IBAMA (federal).","ancora_referencia":"Arquétipo já comprovado na carteira: grupo Rei dos Bons Amigos (26 CNPJs, R$ 300M+/ano em postos, estaleiros e embarcações)."}},"behavior":{"decision_process":"Racional, técnico e decidido em comitê. O responsável ambiental/operacional identifica a necessidade e faz a qualificação técnica do fornecedor; o diretor executivo aprova o orçamento. A decisão é movida por mitigação de risco (evitar embargo/multa/paralisação) mais do que por preço — por isso o ciclo é curto (~15 dias) quando há uma exigência ou prazo regulatório concreto na mesa.","research_channels":["Busca no Google ('licenciamento ambiental Manaus', 'exigência IPAAM como responder')","Indicação de pares do setor — outros gestores, contadores, advogados, fornecedores","LinkedIn (perfis de especialistas, consultorias e responsáveis técnicos)","Associações e sindicatos setoriais (CIEAM, FIEAM, Sindicombustíveis-AM)","Contato direto por WhatsApp/telefone logo após receber a indicação"],"main_objections":["'Quanto custa pra tirar a licença?' (trata como commodity)","'Eu mesmo resolvo com o IPAAM / tenho contato lá'","'Já tenho um engenheiro/contador que cuida disso'","'Vocês são novos, como sei que entregam?'","'Vou pensar e te retorno' (o sumiço)"],"switching_triggers":"Exigência mal respondida que resultou em multa/embargo; demora ou silêncio na tramitação; falta de comunicação sobre o status do processo; ou consultor que domina só a engenharia OU só o direito e deixa lacunas que viram retrabalho.","purchase_frequency":"Mix de projeto pontual sob demanda regulatória (licença nova, estudo, resposta a exigência) e recorrência mensal (gestão ambiental contínua, compliance, SST, atendimento a exigências). Ciclo médio do primeiro contato ao fechamento: ~15 dias (declarado V4MOS)."},"jobs":{"functional":"Quando minha empresa recebe uma exigência do órgão ambiental ou precisa licenciar uma nova operação, eu quero entregar toda a parte ambiental e jurídica a um responsável de confiança, para que minha operação continue funcionando sem risco de multa, embargo ou paralisação.","emotional":"Quero sentir segurança e tranquilidade de estar 100% em conformidade — parar de perder o sono com a possibilidade de uma fiscalização aparecer e parar tudo.","social":"Quero ser visto pela diretoria e pelos sócios como o gestor competente que mantém a empresa protegida e regularizada — não como o responsável que deixou a operação exposta a um problema legal."},"pains":[{"pain":"Risco de embargo, multa ou paralisação da operação por pendência ambiental — um auto de infração do IPAAM/IBAMA pode parar a empresa e custar muito mais do que qualquer consultoria.","intensity":"critical","current_workaround":"Resolve de forma reativa, correndo atrás só quando a notificação chega — geralmente já em cima do prazo."},{"pain":"Ficar no escuro sobre o andamento — manda o documento pro órgão e não sabe em que pé está, sem previsibilidade de prazo nem de próximos passos.","intensity":"high","current_workaround":"Liga e cobra o contato no órgão ou o consultor de tempos em tempos, sem retorno padronizado."},{"pain":"Insegurança com a nova legislação (Lei 15.190/2025) — não sabe em qual modalidade (LAC, LO, LAU) a empresa se enquadra agora e teme fazer o pedido errado.","intensity":"high","current_workaround":"Adia a decisão ou pergunta informalmente a conhecidos, sem base jurídica segura."},{"pain":"Depender de um profissional que entende só da engenharia ou só do direito, mas não dos dois — exigências mal respondidas viram retrabalho e atraso.","intensity":"medium","current_workaround":"Contrata engenheiro e advogado separados, com custo e ruído de coordenação entre eles."},{"pain":"Falta de tempo e de equipe interna para acompanhar a burocracia ambiental enquanto toca a operação do dia a dia.","intensity":"medium","current_workaround":"Deixa a pendência acumular até virar urgência inadiável."}],"gains":[{"gain":"Operação 100% regularizada e licenças em dia, com zero risco de paralisação por questão ambiental.","type":"tangible"},{"gain":"Tramitação ágil e previsível, com prazo e próximo passo claros em cada etapa do processo.","type":"tangible"},{"gain":"Enquadramento correto na nova legislação, aproveitando modalidades simplificadas (como a LAC) sempre que couber.","type":"tangible"},{"gain":"Tranquilidade de ter um único responsável técnico-jurídico cuidando de tudo, de ponta a ponta.","type":"intangible"},{"gain":"Confiança da diretoria de que a parte ambiental está sob controle e não vai virar crise.","type":"intangible"}]},"persona":{"name":"Ricardo Tavares","photo_description":"Homem de ~45 anos, gestor operacional, expressão séria e confiante, vestindo camisa polo ou social de manga dobrada (não terno). Em ambiente industrial/administrativo — galpão, posto de combustível ou escritório operacional ao fundo — segurando documentos ou um tablet. Aparência prática de quem está no 'chão' da operação, não de executivo de corporação.","story":"Ricardo é gerente de operações de uma rede regional com postos de combustíveis e participação em logística fluvial em Manaus. Acabou de receber uma exigência do IPAAM sobre o licenciamento de uma das unidades e sabe que, se não responder corretamente no prazo, a unidade pode ser embargada — parando o faturamento e respingando direto na diretoria. Ele entende de operação, não de legislação ambiental, e o engenheiro que costumava resolver mudou de cidade. Pra piorar, com a nova Lei 15.190/2025 ele nem tem certeza de qual licença a empresa precisa agora. Ricardo busca alguém que domine a engenharia E o direito ambiental, resolva a pendência sem enrolação e o mantenha informado do andamento — para ele poder voltar a tocar a operação em paz, sem medo de aparecer fiscal e parar tudo.","quote":"Eu não entendo de lei ambiental, eu entendo de operação. Só preciso de alguém de confiança que resolva isso direito e me diga 'pode tocar, está tudo certo' — sem eu ter que ficar com medo de aparecer um fiscal e parar tudo."},"where_to_find":{"digital_channels":["LinkedIn — perfis e publicações de gestores operacionais, engenheiros e responsáveis ambientais de empresas do AM","Busca no Google e Google Maps/GMB para 'licenciamento ambiental Manaus' e termos de exigência regulatória","Sites e canais de associações industriais e comerciais do Amazonas (CIEAM, FIEAM, ACA)","Grupos de WhatsApp setoriais (gestores de postos, síndicos de condomínios industriais, associações de classe)","E-mail corporativo (canal de prospecção ABM direta para o comitê de compra)"],"keywords":["licenciamento ambiental Manaus","consultoria ambiental Amazonas","como responder exigência IPAAM","licença de operação posto de combustível Manaus","LAC licenciamento por adesão e compromisso","Lei 15.190/2025 enquadramento licenciamento","embargo ambiental o que fazer","PGRS Manaus","licenciamento Polo Industrial de Manaus"],"influencers":["Comunicados e agenda do IPAAM e da SEMMAS/Manaus (fontes oficiais que a persona acompanha)","CIEAM e FIEAM (entidades de referência da indústria local)","Escritórios e advogados de direito ambiental com presença no LinkedIn local","Especialistas em licenciamento e ESG que publicam sobre a nova Lei Geral do Licenciamento (15.190/2025)","O próprio Aldo Lucena, posicionado como autoridade técnica-jurídica do nicho no AM (a construir)"],"communities":["CIEAM — Centro da Indústria do Estado do Amazonas","FIEAM — Federação das Indústrias do Estado do Amazonas","Sindicombustíveis-AM (sindicato dos postos de combustíveis)","Associação Comercial do Amazonas (ACA)","Eventos e feiras industriais/logísticas de Manaus e ecossistema Suframa/Zona Franca"]},"anti_persona":{"description":"Perfis que consomem recurso, geram atrito e não sustentam o posicionamento de segurança jurídica da Lucena — onde o time deve dizer 'não' ou redirecionar.","profiles":[{"profile_name":"Caçador de protocolo barato","description":"Empresa ou pessoa que enxerga licenciamento como commodity de papel: quer 'só o documento' pelo menor preço possível, sem valorizar a segurança jurídica nem o risco de uma exigência mal respondida.","why_not":"Margem baixa, alta sensibilidade a preço, e tende a culpar a consultoria se o processo emperrar por dados que ele mesmo sonegou. Atrai a Lucena para uma guerra de preço onde os concorrentes ME já operam mais barato.","signals":["Pergunta o preço antes mesmo de explicar a atividade/empreendimento","Compara abertamente com 'o cara que faz por metade'","Resiste a fazer o diagnóstico antes da proposta","Quer só protocolar, não quer assessoria de acompanhamento"],"operational_rule":"Se pedir preço antes do diagnóstico, conduzir para a etapa de diagnóstico e ancorar no custo do risco; se insistir só em preço, encaminhar para escopo mínimo padrão sem customização."},{"profile_name":"Atalho fora da lei","description":"Cliente que quer 'dar um jeito' de contornar a exigência, burlar o órgão ou maquiar a situação para operar sem regularizar de fato.","why_not":"Risco reputacional e jurídico direto para a Lucena, cujo diferencial é justamente segurança jurídica e a credencial do Aldo. Um caso assim contamina a marca e o registro profissional do sócio.","signals":["Pergunta se 'tem como agilizar por fora' ou 'dar um jeitinho'","Quer operar sem licença e só 'se proteger no papel'","Minimiza a gravidade de autos de infração existentes","Pressiona por garantia de resultado que depende do órgão"],"operational_rule":"Recusar educadamente. Reposicionar para o caminho legal correto; se o cliente insistir no atalho, declinar o projeto — não há ticket que pague o risco à reputação."},{"profile_name":"Microdemanda pontual de baixo valor","description":"Micro empreendedor com uma única necessidade pontual, simples e de baixíssimo ticket (ex: uma LAU de atividade de mínimo impacto), sem nenhuma perspectiva de recorrência nem de comitê.","why_not":"Custo de atendimento desproporcional ao ticket, sem LTV. Ocupa a agenda do Aldo (recurso mais escasso) que renderia muito mais em uma conta B2B recorrente ou na expansão da âncora.","signals":["Atividade de mínimo/baixo impacto com licença única","Não tem ativos relevantes nem operação contínua a proteger","Sem horizonte de recorrência (compliance, SST, novas unidades)"],"operational_rule":"Atender com pacote padronizado e autoatendível (futuro), ou encaminhar — nunca alocar tempo consultivo do sócio em demanda transacional de baixo valor."}],"operational_rule":"Regra-mãe: a Lucena vende segurança jurídica e continuidade operacional para quem tem operação real a proteger — não vende papel barato, não vende atalho ilegal e não troca tempo de sócio por ticket de microdemanda. Quando o lead não se encaixa, redirecionar com elegância e proteger a agenda do Aldo para o B2B recorrente e a expansão da âncora."},"buyer_journey":{"description":"Jornada do comitê de compra B2B da Lucena, do gatilho regulatório à recorrência. O lead qualificado quase sempre nasce de uma pressão externa concreta (exigência, fiscalização, novo projeto), não de uma 'vontade de comprar marketing'.","stages":[{"stage":"Gatilho","trigger":"Chega uma exigência/notificação do IPAAM, SEMMAS ou IBAMA, uma fiscalização, um embargo, ou surge um novo projeto/expansão que exige licença.","mental_state":"Urgência e ansiedade — 'isso pode parar minha operação'.","primary_channel":"Documento oficial do órgão / aviso interno da diretoria.","dominant_question":"Qual o tamanho do problema e quanto tempo eu tenho?","client_intervention":"Estar achável no exato momento da busca (GMB + site + autoridade no LinkedIn) e ter conteúdo que explique a exigência e o prazo.","friction_today":"A Lucena é invisível no digital — se o gestor não tiver uma indicação direta na ponta da língua, nem cogita a Lucena.","duration_estimate":"Imediato (horas a 1-2 dias)"},{"stage":"Pesquisa","trigger":"O responsável decide buscar quem resolve.","mental_state":"Avaliando risco e competência; quer alguém que 'entenda disso de verdade'.","primary_channel":"Google, indicação de pares do setor, LinkedIn.","dominant_question":"Quem entende disso e resolve sem me dar mais dor de cabeça?","client_intervention":"Conteúdo de autoridade do Aldo + prova social (case da âncora) + facilidade de contato (WhatsApp/formulário de qualificação).","friction_today":"Sem presença digital, a Lucena depende 100% de indicação; o lead morno que pesquisa no Google encontra FRTB/Moura/Aurora, não a Lucena.","duration_estimate":"1 a 7 dias"},{"stage":"Consideração","trigger":"Selecionou 2-3 fornecedores potenciais para comparar.","mental_state":"Cético e cauteloso; quer prova de competência técnica E jurídica.","primary_channel":"Reunião/WhatsApp, site, materiais enviados.","dominant_question":"Esse fornecedor tem competência jurídica E técnica pra me proteger de verdade?","client_intervention":"Diagnóstico inicial gratuito que demonstra domínio; destacar a formação tripla do Aldo e o case Rei dos Bons Amigos; clareza de escopo, prazo e risco.","friction_today":"Sem material de prova social estruturado (cases, depoimentos, números de licenças aprovadas) — a credibilidade depende só da conversa com o Aldo.","duration_estimate":"2 a 7 dias"},{"stage":"Decisão","trigger":"Comitê alinhado; diretor executivo precisa aprovar o orçamento.","mental_state":"Quer segurança de prazo, escopo e do que acontece se NÃO fizer.","primary_channel":"Proposta + WhatsApp; eventual reunião com o decisor.","dominant_question":"Qual o prazo, o que está incluso e qual o risco real se eu não fechar agora?","client_intervention":"Proposta clara ancorada no custo do risco (embargo/multa) vs investimento; facilitar o aval do decisor com material objetivo.","friction_today":"Etapa relativamente forte — a Lucena já converte ~50% das propostas. O problema não é fechar, é não deixar o lead esfriar antes daqui.","duration_estimate":"2 a 5 dias"},{"stage":"Execução / Pós-venda","trigger":"Contrato assinado; processo entra em tramitação nos órgãos.","mental_state":"Ansioso por status; quer sentir que está sob controle.","primary_channel":"WhatsApp (comunicação direta com a Lucena).","dominant_question":"Em que pé está o meu processo e o que eu preciso fazer agora?","client_intervention":"Atualizações proativas de status, checklist de pendências, gestão das exigências do órgão com prazos visíveis.","friction_today":"Sem CRM, o follow-up de status é manual e irregular — gera a sensação de 'fui abandonado' que corrói a confiança e o boca a boca.","duration_estimate":"Semanas a meses (depende do órgão)"},{"stage":"Recorrência / Expansão","trigger":"Nova unidade, renovação, nova exigência ou necessidade de compliance/SST.","mental_state":"Confia na Lucena; quer um parceiro contínuo, não uma cotação nova a cada vez.","primary_channel":"Relacionamento direto com o Aldo / gestor de conta.","dominant_question":"O que mais eu preciso regularizar ou prevenir antes de virar problema?","client_intervention":"Plano de gestão ambiental recorrente, cross-sell de compliance/SST, e expansão ABM (outras unidades/CNPJs do grupo).","friction_today":"A recorrência e o cross-sell não são sistematizados — dependem da memória do Aldo, não de um processo de conta.","duration_estimate":"Contínuo (recorrência mensal)"}],"critical_leakage_point":"O maior vazamento NÃO é no fechamento (a indicação traz lead qualificado e a Lucena converte ~50%) — são dois pontos antes e depois dele. (1) Entre Gatilho e Pesquisa, o lead morno que não vem por indicação direta nunca encontra a Lucena, porque ela é invisível no Google/Maps; (2) Entre Decisão e Execução, o motivo nº 1 de perda declarado — 'o lead sumiu' — acontece quando a persona pragmática e ocupada diz 'vou pensar e te retorno' e ninguém puxa de volta com cadência. Fechar esses dois buracos (alicerce digital + CRM com follow-up) é o caminho de maior ROI antes de qualquer mídia."},"willingness_to_pay":{"description":"Faixas estimadas a partir dos 2 contratos atuais (R$ 16k e R$ 5k/mês) e do balizamento da call SDR (projetos pontuais ~R$ 30k, budget mensal de R$ 5k aceito sem objeção). Amostra pequena — validar com a carteira no Kick-Off. [E]","services":[{"service":"Gestão ambiental recorrente (acompanhamento contínuo, exigências, renovações)","current_ticket_range":"R$ 5.000–16.000/mês","perceived_fair_range":"R$ 5.000–12.000/mês","premium_ceiling":"R$ 16.000+/mês quando inclui múltiplas unidades/CNPJs e resposta a exigências sob SLA","elasticity":"baixa — movida por risco operacional; aceita pagar mais se o custo de paralisação for grande","pricing_lever":"Escopo recorrente + SLA de atendimento a exigências + segurança jurídica (não só técnica)"},{"service":"Licenciamento (LP/LI/LO/LAU) — projeto pontual","current_ticket_range":"R$ 8.000–30.000 por projeto [E]","perceived_fair_range":"R$ 8.000–25.000 conforme porte e complexidade","premium_ceiling":"R$ 30.000+ para empreendimentos de maior porte/risco com prazo apertado","elasticity":"baixa — o custo de não licenciar (não operar) domina a decisão","pricing_lever":"Complexidade do empreendimento, urgência do prazo regulatório, garantia de condução técnica-jurídica integral"},{"service":"Estudos ambientais complexos (EIA/RIMA, PGRS, pareceres técnicos)","current_ticket_range":"R$ 10.000–40.000 por estudo [E]","perceived_fair_range":"R$ 10.000–35.000","premium_ceiling":"R$ 40.000+ para estudos de alto impacto exigidos por órgão","elasticity":"baixa — exigido por lei, sem substituto","pricing_lever":"Profundidade técnica, responsabilidade pela aprovação junto ao órgão, equipe multidisciplinar"},{"service":"Compliance ambiental e SST recorrente (nova linha com os sócios)","current_ticket_range":"a definir — serviço em estruturação","perceived_fair_range":"R$ 3.000–10.000/mês [E]","premium_ceiling":"R$ 10.000+/mês em pacote integrado licenciamento + compliance + SST","elasticity":"média — recorrente e preventivo; mais sensível a preço que o licenciamento reativo","pricing_lever":"Bundle com a gestão ambiental (cross-sell na base), redução de risco trabalhista + ambiental num só fornecedor"},{"service":"Advisory de enquadramento na nova Lei 15.190/2025 (LAC/LO/LAU)","current_ticket_range":"novo — sem preço praticado ainda","perceived_fair_range":"R$ 3.000–8.000 por diagnóstico de enquadramento [E]","premium_ceiling":"R$ 8.000+ quando vira porta de entrada para gestão recorrente","elasticity":"média — alto interesse por ser tema novo e incerto; bom isca de aquisição","pricing_lever":"Ineditismo (poucos dominam a lei nova), redução de incerteza, posicionamento de autoridade"}]},"objection_library":{"description":"Objeções reais do comitê de compra B2B da Lucena, na linguagem do cliente, com o subtexto e a resposta que funciona. Alimenta copy, SDR, scripts de atendimento e FAQ do site.","objections":[{"objection":"Quanto custa pra tirar a licença?","subtext":"Trata licenciamento como commodity de papel e quer comparar só preço — ainda não enxerga o risco que está comprando.","bad_response":"Dar um preço seco na hora. Vira leilão com os concorrentes ME, que operam mais barato.","good_response":"Reframe para o custo do risco: 'O preço depende do porte e do risco da sua operação — por isso começo com um diagnóstico rápido. O que costuma sair caro de verdade não é a consultoria, é a unidade embargada parada esperando uma exigência ser respondida do jeito certo.'","when_to_use":"Primeiro contato por WhatsApp ou telefone, antes de enviar proposta."},{"objection":"Eu mesmo resolvo direto com o IPAAM, tenho um contato lá.","subtext":"Acha que é só protocolar um documento e que conhecer alguém resolve.","bad_response":"Insistir que ele não consegue. Soa arrogante e bate de frente com o ego do gestor.","good_response":"'Ótimo ter contato lá, ajuda mesmo. O detalhe é que, com a nova Lei 15.190/2025, mudou o enquadramento das atividades — uma exigência respondida na modalidade errada volta e atrasa tudo. Meu papel é garantir que o pedido entre certo da primeira vez, juridicamente blindado.'","when_to_use":"Quando o gestor demonstra que já tem alguma relação com o órgão."},{"objection":"Já tenho um engenheiro (ou contador) que cuida disso pra mim.","subtext":"Já tem um fornecedor parcial e não vê por que trocar/somar.","bad_response":"Falar mal do profissional atual. Coloca o gestor na defensiva.","good_response":"'Faz sentido. A pergunta é se ele cobre a parte jurídica também — porque licenciamento hoje é metade engenharia, metade direito ambiental. Eu sou as duas coisas na mesma pessoa, então a exigência não fica jogada entre o engenheiro e o advogado, que é onde o processo costuma travar.'","when_to_use":"Consideração, quando há fornecedor incumbente."},{"objection":"Vocês são novos, como eu sei que entregam?","subtext":"CNPJ novo gera desconfiança — medo de entregar um problema sério a quem não tem track record.","bad_response":"Prometer mundos e fundos ou inflar o tamanho da empresa. Soa falso.","good_response":"'A empresa é nova, eu não. São 10+ anos atuando em licenciamento ambiental — sou advogado, engenheiro ambiental e mestre em direito ambiental. Hoje cuido da regularização de um grupo com 26 CNPJs e mais de R$ 300 milhões em operação. A Lucena é a estrutura nova pra esse trabalho que já faço.'","when_to_use":"Consideração/Decisão, sempre que o tempo de mercado da empresa for questionado."},{"objection":"Está caro — a outra consultoria cobra menos.","subtext":"Comparando como commodity; não atribuiu ainda valor à segurança jurídica.","bad_response":"Dar desconto na hora. Sinaliza que o preço era inflado e desvaloriza o serviço.","good_response":"'Entendo a comparação. A diferença é o que está por trás do preço: o barato que responde a exigência errado custa a operação parada e a multa. Você está contratando a segurança de que o processo entra certo e a sua operação não para — e isso eu coloco no papel.'","when_to_use":"Negociação, após a proposta."},{"objection":"Não é urgente agora, vou deixar pra depois.","subtext":"Subestima o risco enquanto não há uma notificação na mesa.","bad_response":"Aceitar e esperar ele voltar. É justamente assim que o lead 'some'.","good_response":"'Posso te mostrar em 10 minutos os pontos da sua operação que hoje estão expostos a uma fiscalização? Se estiver tudo certo, você fica tranquilo de graça. Se não, a gente age antes de virar auto de infração — que é quando deixa de ser barato.'","when_to_use":"Pesquisa/Consideração, para criar urgência legítima e agendar o próximo passo."},{"objection":"Vou pensar e te retorno.","subtext":"Sem urgência percebida e ocupado — vai esquecer. Este é o caminho direto para o motivo nº 1 de perda ('o lead sumiu').","bad_response":"'Tá bom, fico no aguardo!' — e nunca mais puxar. Perde-se a venda por inércia.","good_response":"'Perfeito. Pra não cair no esquecimento da correria, já deixo agendado um retorno meu na [dia], e te mando até lá um resumo de 1 página do que conversamos. Se mudar algo, é só me avisar.' — sempre fechando com um próximo passo concreto e data.","when_to_use":"Fim de qualquer contato sem fechamento — é a objeção que o CRM + cadência existem para resolver."}]},"key_message":{"chosen_message":"Segurança jurídica e ambiental para sua operação nunca parar.","approach":"combined","usage_context":"Headline do site/LP institucional, bio do LinkedIn institucional, abertura de propostas e pitch do Aldo. Combina o resultado funcional (operação não para) com o gatilho emocional (segurança/tranquilidade) que o ICP busca.","alternatives":[{"message":"Licenciamento ambiental resolvido com segurança jurídica — sua operação nunca para.","approach":"functional","rationale":"Foco no resultado prático e no risco evitado. Forte para a persona pragmática (Ricardo), mas puramente racional — não captura a tranquilidade que é parte do que ele compra."},{"message":"Durma tranquilo: sua empresa 100% regularizada, sem medo de embargo.","approach":"emotional","rationale":"Ataca o job emocional (parar de perder o sono). Memorável, mas sozinha pode soar leve demais para um comitê técnico que precisa justificar a decisão no racional do risco."},{"message":"A assessoria que protege quem move a indústria do Amazonas.","approach":"social","rationale":"Posiciona status e pertencimento ao ecossistema industrial local. Boa para marca/LinkedIn, mas menos eficaz como gatilho de conversão direta do que a dor concreta do risco."}]},"key_insight":{"headline":"Ricardo não compra 'licença' — compra o direito de não parar a operação. E ninguém no mercado vende segurança jurídica + engenharia na mesma pessoa.","context":"A dor real do ICP é risco operacional (embargo, multa, paralisação), não preço. Os concorrentes vendem 'serviço ambiental' como entrega técnica de commodity; a Lucena pode vender tranquilidade jurídica-operacional ancorada na formação tripla do Aldo — exatamente o que o comitê de compra busca e ninguém articula com clareza no Amazonas.","numbered_reasons":["(1) A persona é pragmática e movida por risco — reage a 'sua operação pode parar', não a 'qualidade e compromisso'. A willingness-to-pay é alta quando o custo de NÃO fazer (embargo) está explícito.","(2) O diferencial não-copiável (advogado + engenheiro ambiental + mestre numa só pessoa) responde diretamente à dor 'preciso de quem entenda o direito E a engenharia' — que os concorrentes, em geral só técnicos, não cobrem.","(3) A Lei 15.190/2025, em vigor há ~4 meses, abriu um gatilho fresco de insegurança e reenquadramento em toda a base B2B — janela para posicionar a Lucena como a 'advisory' que decifra a nova lei antes que a concorrência ocupe esse discurso."],"discussion_anchor":"A decisão do stakeholder é assumir, em TODA a comunicação, o posicionamento de 'segurança jurídica que mantém a operação funcionando' (não 'mais uma consultoria ambiental') — e bancar essa promessa com o repertório e a credencial do Aldo, inclusive colocando o risco e o prazo no papel das propostas."},"honesty_alert":"Três ressalvas honestas. (1) Esta é uma persona-síntese de um comitê de compra de 3 papéis (técnico, operacional, decisor) — útil para alinhar a comunicação, mas o plano ABM precisará endereçar os três com ênfases diferentes; não reduzir o ABM a 'falar com o Ricardo'. (2) A persona 'Ricardo' e o ICP são hipóteses fundamentadas nos dados do briefing + pesquisa de mercado, mas NÃO foram validados com entrevista a cliente real — recomenda-se fortemente validar com 2-3 clientes atuais (incluindo contatos do grupo Rei dos Bons Amigos) no Kick-Off antes de travar copy e mídia. (3) A willingness-to-pay foi estimada a partir de apenas 2 contratos e do balizamento da call SDR — é direcional, não estatística; refinar conforme a carteira crescer."},"ee-s1-swot":{"client_name":"Lucena Advisory","skill":"ee-s1-swot","version":1,"generated_at":"2026-06-19T00:00:00Z","data_source":"mixed","summary":"SWOT da Lucena Advisory revela um descompasso clássico de empresa nova com decisor experiente: forças institucionais fortes (autoridade técnica tripla do Aldo, conversão de 50% proposta→venda, cliente-âncora de R$ 300M+ com 26 CNPJs) contra fraquezas puramente operacionais (zero presença digital, vazamento de follow-up em planilha, dependência total do dono, concentração de 100% da receita em 2 contratos). A jogada mais inteligente (SO) não é buscar topo de funil novo — é expandir dentro da âncora Rei dos Bons Amigos enquanto fecha o vazamento de follow-up com CRM, ocupando o vácuo digital do nicho antes da concorrência acordar.","summary_headline":"Lucena Advisory tem autoridade técnica rara e uma âncora de R$ 300M+ já aberta (forças institucionais), mas vende em planilha e perde leads no follow-up (fraqueza que sangra caixa hoje). Jogada SO: expandir dentro da âncora e fechar o vazamento antes da concorrência acordar pro digital.","summary_highlights":[{"category":"posicao","label":"Forças × Fraquezas","value":"6 × 6","subtext":"Forças institucionais sólidas vs fraquezas operacionais críticas","tone":"yellow"},{"category":"oportunidade","label":"Expansão na âncora","value":"26 CNPJs","subtext":"ABM dentro do Rei dos Bons Amigos — maior ROI, menor CAC","tone":"green"},{"category":"risco","label":"Concentração de receita","value":"100% em 2 contratos","subtext":"Saída do âncora derruba ~76% da receita (R$ 16k de R$ 21k)","tone":"red"},{"category":"janela","label":"Vácuo digital do nicho","value":"~12 meses","subtext":"Antes de FRTB/Moura/Aurora profissionalizarem (a confirmar na S2)","tone":"blue"},{"category":"oportunidade","label":"Top ação: CRM + cadência","value":"ROI ~7x/90d","subtext":"Recupera leads que somem — motivo #1 de perda declarado","tone":"green"}],"summary_key_findings":[{"category":"vantagem","text":"A Lucena já tem o mais difícil: autoridade e fechamento. O decisor Aldo é advogado + engenheiro ambiental + mestre em direito ambiental com 10+ anos de mercado, e a operação converte ~50% das propostas em venda em ciclo de 15 dias (10 propostas → 5 vendas/mês). Isso não se compra com mídia — é o ativo que a estratégia deve alavancar."},{"category":"contexto","text":"CNPJ aberto em janeiro/2026 (4 meses) e Zero Digital absoluto: sem site, Instagram, GMB ou LinkedIn institucional, CRM em planilha. Não é estagnação — é fase de fundação, uma janela rara de estruturar do zero sem vícios. A meta operacional (R$ 50k/mês em 6m vs R$ 100k declarado no V4MOS) precisa ser travada no Kick-Off, pois calibra o ritmo de toda a SWOT."},{"category":"ameaca","text":"Dois riscos externos pesam: a concentração de 100% da receita em 2 contratos (sobretudo o âncora de R$ 16k) torna a saída do Rei dos Bons Amigos um evento quase existencial; e o vácuo digital do nicho é uma janela que fecha — se FRTB, Moura ou Aurora profissionalizarem SEO/conteúdo primeiro, a vantagem de pioneirismo evapora."},{"category":"acao","text":"A SWOT confirma a inversão do playbook V4: nos próximos 90 dias, atacar (1) o vazamento de follow-up com CRM + cadência, (2) a expansão ABM dentro dos 26 CNPJs da âncora e (3) o alicerce digital (LP + GMB + LinkedIn) — deixando mídia paga para depois do diagnóstico da S2/S3. Encher o topo antes de fechar o meio só amplifica o desperdício."}],"strengths":[{"title":"Autoridade técnica tripla e rara do decisor","description":"Aldo Lucena Júnior é advogado, engenheiro ambiental E mestre em direito ambiental, com 10+ anos de mercado. Em um nicho onde a venda é confiança técnica e jurídica simultânea, essa combinação é difícil de igualar — nenhum dos concorrentes declarados (FRTB, Moura, Ocidental, Aurora) tem, em uma só pessoa, o repertório jurídico + de engenharia que a Lucena oferece.","implication":"É a matéria-prima de toda a estratégia de marca e conteúdo: posicionar o Aldo como a autoridade de licenciamento ambiental do Amazonas (LinkedIn, artigos, pareceres comentados) custa quase zero e cria barreira de entrada que mídia paga não compra.","source":"briefing"},{"title":"Máquina de fechamento que já funciona (50% de conversão)","description":"Mesmo sem nenhuma estrutura, a operação converte ~50% das propostas em venda (10 propostas → 5 vendas no último mês, V4MOS Q24/Q30) em ciclo curto de 15 dias. Para consultoria B2B — onde o ciclo costuma ser de 30-90 dias — isso é acima da média e prova que o produto e o pitch fecham quando chegam à mesa.","implication":"O gargalo da Lucena NÃO é fechamento, é volume e cadência de leads. Qualquer ganho de meio de funil (parar de perder lead) converte quase direto em receita, porque a saída do funil já está calibrada.","source":"v4mos"},{"title":"Cliente-âncora de R$ 300M+/ano com porta já aberta","description":"O grupo Rei dos Bons Amigos (26 CNPJs, faturamento >R$ 300M/ano em postos, estaleiros e embarcações) já é cliente e responde por boa parte da receita. O Aldo declarou na FPS o desejo de apresentar a V4 ao diretor executivo do grupo — relacionamento quente, não prospecção fria.","implication":"Expandir dentro do grupo (mais CNPJs, mais serviços) tem taxa de fechamento ordens de grandeza acima de captar cliente novo. É a alavanca de crescimento mais barata e mais provável disponível hoje — base de um plano ABM.","source":"briefing"},{"title":"Time multidisciplinar estruturado para cross-sell técnico","description":"Para além do Aldo, a sociedade já reúne Direito Administrativo, Arquitetura e Urbanismo, Engenharia de Segurança e Administração. Isso amplia a entrega para além do licenciamento puro — abre Compliance e Saúde e Segurança do Trabalho (SST) como novas linhas para a mesma base de clientes.","implication":"Permite aumentar o ticket por cliente (cross-sell de SST/compliance dentro da carteira atual e do grupo âncora) sem precisar captar leads novos — alavanca de receita de baixo custo de aquisição.","source":"briefing"},{"title":"Demanda validada por indicação espontânea recorrente","description":"100% da receita vem de indicação/passivo, e o cliente declarou no V4MOS (Q23) que clientes indicam espontaneamente 'com frequência — é um canal relevante'. Indicação espontânea recorrente é o sinal mais forte de que o serviço entrega valor real e gera satisfação.","implication":"Existe um motor de boca a boca funcionando que hoje não é capturado nem sistematizado. Formalizar um programa de indicação + provas sociais (cases, depoimentos) transforma um ativo passivo em canal de aquisição rastreável.","source":"v4mos"},{"title":"CNPJ novo sem vícios digitais — estruturação do zero","description":"CNPJ aberto em janeiro/2026 (4 meses). Não há campanhas mal montadas, pixel envenenado, identidade visual ruim ou site legado a corrigir. O próprio Aldo declarou na FPS: 'abri a empresa e agora quero estruturá-la do zero para que ela rode lisa'.","implication":"Janela rara: cada decisão de marketing pode nascer correta. A V4 implementa best practices desde o início, sem custo de retrabalho — vantagem que clientes maduros não têm.","source":"diagnostico"}],"weaknesses":[{"title":"Invisibilidade digital absoluta (maturidade 8/100)","description":"Sem site, sem Instagram, sem GMB, sem LinkedIn institucional, sem GA4/GTM. O diagnóstico de maturidade marcou 8/100 (crítico extremo), 24 pontos abaixo da média do setor (~32). Um comitê de compra B2B que pesquisar 'Lucena Advisory' hoje não encontra nada.","implication":"Risco: invisibilidade é veto silencioso à expansão B2B — decisores qualificam fornecedor pesquisando. Mitigação: erguer alicerce mínimo (LP institucional + GMB + LinkedIn) na S3, antes de qualquer aquisição ativa, para dar destino e credibilidade ao relacionamento.","severity":"critical","source":"diagnostico"},{"title":"Vazamento de follow-up — leads somem na planilha","description":"O motivo #1 de perda declarado é 'o lead sumiu sem dar retorno' (V4MOS Q27), e leads param de responder 'com frequência' (Q32). O CRM é uma planilha (Q10), o padrão de follow-up 'existe mas nem sempre é seguido' (Q33). É vazamento estrutural dentro de uma operação que converteria metade desses leads.","implication":"Risco: cada lead perdido é receita direta perdida (ticket ~R$ 10,5k recorrente). Amplifica qualquer ameaça de aquisição futura. Mitigação imediata: CRM com pipeline de 5 etapas + automação de cadência no WhatsApp (3 toques em 7 dias) + etiqueta de origem.","severity":"critical","source":"v4mos"},{"title":"Operação 100% dependente do dono (bus factor = 1)","description":"Aldo acumula decisor + único vendedor + executor técnico + comunicação. Não há equipe comercial dedicada (V4MOS Q8) nem de marketing (Q9). Os sócios estão focados em entrega técnica, não em vendas.","implication":"Risco: se o Aldo sair de cena 30 dias, o pipeline trava — e nenhum plano de crescimento escala enquanto a venda depender só dele. Mitigação: documentar o processo comercial no CRM e, na S4/S5, dimensionar um LDR/prospector ou comercial dedicado.","severity":"high","source":"briefing"},{"title":"Concentração de 100% da receita em 2 contratos","description":"A receita de R$ 21k/mês vem inteiramente de 2 contratos fixos (R$ 16k + R$ 5k), com o maior atrelado ao grupo âncora. Não há diversificação de carteira ativa que dê fôlego a perdas.","implication":"Risco existencial: a saída do contrato de R$ 16k derruba ~76% da receita. Mitigação: a estratégia precisa diversificar (novos clientes industriais + cross-sell) em paralelo à expansão da âncora — nunca amplificar a concentração.","severity":"high","source":"briefing"},{"title":"Zero previsibilidade — sem forecast, MoM, CAC ou LTV","description":"Não acompanha faturamento mês a mês (V4MOS Q29), não calcula CAC/LTV (Q28), não faz forecast integrado de marketing e vendas (Q36). O próprio Aldo 'não sabe quanto vai entrar no próximo mês' (call SDR).","implication":"Risco: sem instrumentação, a empresa pilota no escuro e só percebe problemas de caixa quando já estouraram. Mitigação: dashboard mínimo de MoM + pipeline + forecast simples na S1/S2 — pré-requisito para qualquer meta operacional.","severity":"high","source":"v4mos"},{"title":"Sem capacidade interna de produção de marketing","description":"Sem equipe de marketing (V4MOS Q9), sem identidade visual/logo (has_logo=false), sem banco de imagens, frequência de publicação 'não publico' (Q43). Toda a comunicação depende do Aldo, que já está sobrecarregado na operação.","implication":"Risco: planos de conteúdo/criativos morrem na falta de executor. Mitigação: a V4 assume a produção na S3 (identidade + LP + criativos), e o conteúdo de autoridade fica em formato de baixo esforço (LinkedIn do Aldo, 1-2h/semana) até haver capacidade dedicada.","severity":"medium","source":"diagnostico"}],"opportunities":[{"title":"Vácuo digital do nicho ambiental em Manaus","description":"A hipótese (a confirmar na ee-s2-pesquisa-mercado) é que os concorrentes diretos — FRTB, Moura, Ocidental, Aurora — têm baixa maturidade digital, típica de consultoria ambiental B2B regional. Se confirmado, há espaço para a Lucena ser a primeira marca digitalmente forte do nicho no Amazonas.","implication":"Capturar a posição de referência digital do nicho (SEO local + conteúdo de autoridade + GMB) antes da concorrência cria barreira difícil de reverter. É a oportunidade de pioneirismo — mas tem prazo.","time_sensitivity":"urgent","source":"market_trend"},{"title":"Expansão ABM dentro do grupo Rei dos Bons Amigos","description":"O grupo tem 26 CNPJs e a Lucena atende parte dele. Cada CNPJ adicional (postos, estaleiros, embarcações) é uma oportunidade de licenciamento, compliance e SST com relacionamento já estabelecido e confiança comprovada.","implication":"Mapear o comitê de compra do grupo e desenhar um plano ABM de expansão é o caminho de menor CAC e maior taxa de fechamento disponível. Usar a reunião com o diretor executivo (já sinalizada na FPS) como pivô.","time_sensitivity":"urgent","source":"briefing"},{"title":"Drivers regulatórios de demanda crescente no Amazonas","description":"Manaus concentra Zona Franca, indústria (Honda, Yamaha), estaleiros, postos de combustíveis e logística fluvial — todos sujeitos a licenciamento ambiental e urbanístico crescente (IPAAM, IBAMA, SEMMAS). A pressão regulatória estrutural sustenta demanda de longo prazo (a quantificar na S2).","implication":"A demanda não depende de moda — é regulatória e recorrente. Posicionar a Lucena como destravadora de empreendimentos (não 'mais uma consultoria') captura essa demanda inelástica.","time_sensitivity":"medium_term","source":"market_trend"},{"title":"Busca local de alta intenção via Google Meu Negócio","description":"Termos como 'licenciamento ambiental Manaus', 'consultoria ambiental AM' e 'IPAAM licenciamento' têm alta intenção comercial e baixa disputa. Sem GMB reivindicado, a Lucena perde 100% dessa busca local hoje.","implication":"Reivindicar e otimizar o GMB (fotos, descrição, 5-10 reviews da carteira atual) é uma ação de baixo custo e payback rápido que destrava leads inbound de altíssima qualificação. Ação de curto prazo na S3.","time_sensitivity":"urgent","source":"diagnostico"},{"title":"Compliance e SST como nova linha de receita","description":"Com a entrada de sócios de Engenharia de Segurança e Direito Administrativo, a Lucena pode oferecer Compliance e Saúde e Segurança do Trabalho — serviços recorrentes que a mesma base de clientes (postos, estaleiros, indústria) consome obrigatoriamente.","implication":"Cross-sell na carteira existente e no grupo âncora aumenta o ticket médio e o LTV sem custo de aquisição novo. Empacotar 'licenciamento + compliance + SST' como solução única reforça o posicionamento de tranquilidade burocrática.","time_sensitivity":"medium_term","source":"briefing"},{"title":"LinkedIn como canal B2B subexplorado no nicho","description":"O comitê de compra B2B (engenheiros, gestores, diretores) vive no LinkedIn, e o nicho de licenciamento ambiental local quase não produz conteúdo de autoridade ali. O Aldo tem repertório técnico de sobra e o tipo de credencial que gera credibilidade imediata na plataforma.","implication":"Conteúdo de autoridade no LinkedIn do Aldo (casos de licenciamento, exigências IPAAM/IBAMA) é canal de aquisição inbound B2B de custo quase zero — e prepara terreno para o ABM. Começar imediatamente, em paralelo ao alicerce.","time_sensitivity":"medium_term","source":"market_trend"}],"threats":[{"title":"Concorrência pode profissionalizar o digital primeiro","description":"FRTB, Moura, Ocidental e Aurora já operam no mesmo nicho. Se qualquer um investir em SEO, conteúdo e GMB antes da Lucena, a janela de pioneirismo digital fecha e a Lucena passa a correr atrás de uma posição que poderia ter ocupado.","implication":"A oportunidade de vácuo digital tem prazo. Proteção: ocupar GMB + busca local + LinkedIn de autoridade nos próximos 90 dias, antes de a concorrência acordar. Quanto mais a Lucena demorar, maior o gap a recuperar.","probability":"medium","impact":"high","source":"market_trend"},{"title":"Saída ou redução do cliente-âncora","description":"O contrato de R$ 16k atrelado ao grupo Rei dos Bons Amigos sustenta ~76% da receita. Mudança de gestão, internalização do serviço ou insatisfação no grupo derrubaria a operação. É a maior exposição da empresa hoje.","implication":"Risco quase existencial. Proteção dupla: (1) blindar a conta com cross-sell de compliance/SST e excelência de entrega, tornando a Lucena indispensável; (2) diversificar a carteira urgentemente para que a saída do âncora não seja fatal.","probability":"low","impact":"high","source":"briefing"},{"title":"Simplificação regulatória do licenciamento","description":"Mudanças na legislação de licenciamento ambiental (ex: Lei Geral do Licenciamento Ambiental e modalidades de autolicenciamento/LAC) podem reduzir a complexidade de alguns processos e, com isso, a necessidade de intermediação em segmentos de menor risco. (A monitorar na pesquisa de mercado.)","implication":"Parte da demanda transacional simples pode encolher. Proteção: posicionar a Lucena no licenciamento complexo/de alto risco e em serviços recorrentes (compliance, SST, gestão de exigências) — onde a expertise jurídica + engenharia continua indispensável.","probability":"medium","impact":"medium","source":"market_trend"},{"title":"Pressão de caixa da meta agressiva sabota a estruturação","description":"A meta declarada (R$ 50k/mês em 6 meses, ~2,4x o faturamento atual) é ambiciosa. A urgência de bater meta pode pressionar o Aldo a abandonar a estruturação e voltar ao modo 'apagar incêndio' / vender no improviso — exatamente o que o projeto veio resolver.","implication":"Proteção: travar a meta operacional realista no Kick-Off e instalar métricas (MoM, pipeline, forecast) para mostrar progresso incremental — para que a estruturação seja vista como o caminho da meta, não um desvio dela.","probability":"medium","impact":"medium","source":"briefing"},{"title":"Dependência futura de plataformas para aquisição paga","description":"Quando a Lucena entrar em mídia paga, ficará exposta a custos crescentes e mudanças de algoritmo de Google/Meta. Pior: para um ICP B2B industrial que 'não está em redes sociais', mídia paga tradicional pode ter ROI marginal — risco de investir no canal errado.","implication":"Proteção: o diagnóstico de mídia (S2) e o forecast (S3) devem decidir entre mídia paga vs LDR/prospector com dados, não por inércia de playbook. Reduz a exposição a um canal único e ao custo de leilão.","probability":"medium","impact":"medium","source":"market_trend"}],"strategic_synthesis":{"leverage":"A aposta principal cruza as forças institucionais com as oportunidades de menor CAC. A Lucena tem três ativos que dinheiro não compra rápido — a autoridade técnica tripla do Aldo (F1), uma máquina de fechamento de 50% (F2) e uma âncora de R$ 300M+ com porta aberta (F3) — e duas oportunidades de altíssima conversão esperando: expandir dentro dos 26 CNPJs do grupo (O2) e ocupar o vácuo digital/busca local do nicho (O1, O4) antes da concorrência. A jogada SO é direcionar a autoridade do Aldo para dois alvos simultâneos: para dentro (plano ABM de expansão na âncora, com cross-sell de compliance/SST) e para o digital de autoridade (GMB + LinkedIn + LP institucional), transformando reputação técnica em pipeline rastreável. Nenhuma dessas jogadas exige mídia paga — exige estrutura e direção.","protection":"O risco principal nasce do encontro entre as fraquezas operacionais e as ameaças externas. A concentração de 100% da receita em 2 contratos (W4) combinada com a possibilidade de saída do âncora (T2) é a vulnerabilidade mais grave: se o contrato de R$ 16k cair antes de a carteira diversificar, não há fôlego. Em paralelo, o vazamento de follow-up (W2) somado à invisibilidade digital (W1) significa que, mesmo se a concorrência acordar para o digital primeiro (T1), a Lucena não tem hoje nem como capturar nem como reter os leads que disputaria. E a meta agressiva (T4) pressiona a abandonar a estruturação justamente quando ela é mais necessária. Não tratar W2 e W4 transforma ameaças de probabilidade média em danos altos.","recommended_strategy":"Nos próximos 90 dias, a Lucena deve executar uma estratégia de 'fundação antes de escala', em três frentes paralelas e uma adiada. (1) Fechar o vazamento: CRM mínimo + pipeline de 5 etapas + cadência automatizada de follow-up — ataca o motivo #1 de perda e instala as métricas que faltam. (2) Crescer onde já é forte: mapear o comitê de compra do Rei dos Bons Amigos e rodar um plano ABM de expansão (novos CNPJs + cross-sell de compliance/SST), o caminho de maior ROI disponível. (3) Erguer o alicerce de credibilidade: identidade visual + LP institucional + GMB + LinkedIn de autoridade do Aldo, para ser achável e crível pelo comitê B2B. (4) Adiar deliberadamente a mídia paga até o diagnóstico da S2/S3 decidir entre ads e LDR/prospector. Tudo isso só calibra corretamente depois de travar a meta operacional única no Kick-Off."},"tows_matrix":{"description":"Cruzamento estratégico dos quadrantes SWOT da Lucena Advisory. Cada estratégia conecta uma força ou fraqueza interna a uma oportunidade ou ameaça externa, transformando a análise em ação.","so_strategies":[{"id":"SO1","strategy":"Plano ABM de expansão dentro do Rei dos Bons Amigos: usar a autoridade do Aldo (F1) e a porta aberta na âncora (F3) para mapear o comitê de compra do grupo e prospectar os CNPJs ainda não atendidos (O2).","rationale":"Relacionamento quente + autoridade técnica + 26 CNPJs com demanda regulatória recorrente = maior taxa de fechamento e menor CAC possível. A reunião com o diretor executivo (sinalizada na FPS) é o gatilho.","expected_outcome":"1-3 novos contratos dentro do grupo em 90 dias, diversificando a receita sem depender de captação fria."},{"id":"SO2","strategy":"Transformar a conversão de 50% (F2) em pipeline previsível dando destino digital à demanda: capturar a busca local de alta intenção (O4) com GMB + LP institucional, qualificando o lead antes de chegar ao Aldo.","rationale":"A saída do funil já fecha metade; falta volume qualificado de entrada. Busca local tem alta intenção e baixa disputa — alimenta a máquina que já comprovadamente converte.","expected_outcome":"Leads inbound rastreáveis e qualificados chegando por canal próprio, reduzindo a dependência exclusiva de indicação."},{"id":"SO3","strategy":"Ocupar o vácuo de conteúdo do nicho (O1, O6) publicando a autoridade do Aldo (F1) no LinkedIn e no GMB: casos de licenciamento, exigências IPAAM/IBAMA, situações reais de regularização.","rationale":"O comitê B2B vive no LinkedIn e o nicho local quase não produz conteúdo. Autoridade já existe — falta publicar. Custo quase zero, barreira de entrada alta.","expected_outcome":"Lucena vira referência digital do licenciamento ambiental no AM; inbound B2B qualificado em 3-6 meses."}],"wo_strategies":[{"id":"WO1","strategy":"Implementar CRM + cadência automatizada de follow-up (resolve W2) para não desperdiçar os leads da expansão da âncora e da busca local (O2, O4).","rationale":"Não adianta gerar mais leads (oportunidades) jogando-os numa planilha que já perde o que entra. CRM é pré-condição para ABM rastreável e para qualquer aquisição.","expected_outcome":"Zero lead perdido por esquecimento; visibilidade de pipeline e recuperação de 2-3 oportunidades/mês hoje vazadas."},{"id":"WO2","strategy":"Erguer o alicerce digital institucional (resolve W1) — LP + GMB + LinkedIn institucional — para ser achável e crível pelo comitê de compra B2B (O2, O4).","rationale":"A invisibilidade digital veta a expansão B2B: decisor qualificado pesquisa antes de contratar. Sem alicerce, o ABM e a busca local não têm onde aterrissar.","expected_outcome":"Comitê de compra encontra uma Lucena profissional ao pesquisar; ABM e busca local passam a ter destino de conversão."},{"id":"WO3","strategy":"Documentar o processo comercial dentro do CRM (mitiga W3) para liberar o Aldo da operação transacional e concentrá-lo em relacionamento estratégico de alto valor com a âncora (O2).","rationale":"Enquanto o Aldo for o único vendedor-executor, o crescimento é limitado por sua agenda. Processo documentado é o primeiro passo para delegar e escalar.","expected_outcome":"Aldo gasta menos tempo apagando incêndio e mais tempo na expansão da âncora; base para contratar comercial/LDR na S4/S5."}],"st_strategies":[{"id":"ST1","strategy":"Blindar a conta-âncora com cross-sell: usar a multidisciplinaridade do time (F4) e a autoridade (F1) para empacotar licenciamento + compliance + SST dentro do grupo (defende contra T2).","rationale":"Quanto mais serviços recorrentes a Lucena entrega ao grupo, mais cara e arriscada fica a troca de fornecedor — torna-se indispensável, reduzindo a chance de saída do âncora.","expected_outcome":"Maior ticket e LTV no grupo + redução da probabilidade de churn do contrato de R$ 16k."},{"id":"ST2","strategy":"Erguer barreira de entrada digital primeiro: usar a autoridade do Aldo (F1) para dominar conteúdo e busca local antes que os concorrentes profissionalizem (neutraliza T1).","rationale":"Pioneirismo em SEO/conteúdo de autoridade cria vantagem cumulativa (backlinks, reviews, ranking) difícil de reverter depois. É correr na frente enquanto a corrida ainda não começou.","expected_outcome":"Lucena ocupa a primeira página do nicho no Google/LinkedIn local antes da concorrência reagir."},{"id":"ST3","strategy":"Usar o case do Rei dos Bons Amigos (F3) como prova social para captar novos clientes industriais (Honda, Yamaha, estaleiros), diversificando a carteira (reduz exposição a T2).","rationale":"Atender um grupo de R$ 300M+ é credencial poderosa. Transformá-lo em case (com autorização) acelera a confiança de novos prospects B2B de grande porte.","expected_outcome":"Novos contratos fora do grupo âncora, reduzindo a concentração de receita."}],"wt_strategies":[{"id":"WT1","strategy":"Diversificar a receita com urgência (ataca W4) montando um pipeline ativo de novos clientes industriais antes que a saída do âncora (T2) somada à ausência de aquisição (W1) deixe a empresa sem fôlego.","rationale":"A concentração de 100% em 2 contratos é a vulnerabilidade fatal. Mesmo crescendo na âncora, é preciso construir uma segunda perna de receita independente — sobrevivência, não só crescimento.","expected_outcome":"Carteira menos concentrada: meta de reduzir o peso do maior contrato de ~76% para <50% da receita em 6-12 meses."},{"id":"WT2","strategy":"Instalar métricas mínimas — MoM, pipeline, forecast simples (ataca W5) — para detectar cedo a pressão de caixa e provar progresso, evitando que a meta agressiva (T4) faça o Aldo abandonar a estruturação.","rationale":"Sem instrumentação, problemas de caixa só aparecem quando já estouraram, e o progresso da estruturação fica invisível — alimentando a ansiedade que sabota o projeto.","expected_outcome":"Aldo enxerga o funil e o caixa em tempo real; decisões baseadas em dado, não em pânico."}]},"priority_actions":[{"action":"Implementar CRM mínimo (RD Station Free, Kommo ou Pipefy) com pipeline B2B de 5 etapas (Lead → Qualificado → Proposta → Negociação → Fechado/Perdido), automação de follow-up no WhatsApp (3 toques em 7 dias) e etiqueta de origem do lead. Migrar os 10 clientes ativos + leads em aberto das planilhas.","swot_basis":"Ataca W2 (vazamento de follow-up) e W5 (sem métricas); executa WO1; habilita O2 e O4.","impact":"high","suggested_timeline":"Semana 1-2","dependencies":["Travar meta operacional no Kick-Off (calibra metas de pipeline)"],"financial_impact":{"investment_brl":1500,"monthly_return_brl":10500,"payback_days":20,"roi_multiple":7.0,"note":"Investimento = setup + ferramenta por 3 meses (plano free/baixo custo). Retorno = recuperar ~1 negócio/mês hoje perdido por 'lead sumiu', ao ticket recorrente médio de R$ 10,5k."},"risk_adjusted_score":{"impact":9,"probability_of_success":8,"reversibility":9,"score":8.7}},{"action":"Mapear o comitê de compra do grupo Rei dos Bons Amigos (sementinha técnica, multiplicador operacional, decisor executivo) e desenhar um plano ABM de expansão pelos CNPJs ainda não atendidos, usando a reunião com o diretor executivo (já sinalizada na FPS) como pivô. Incluir oferta de cross-sell de compliance/SST.","swot_basis":"Alavanca F1, F3 e F4; captura O2 e O5; executa SO1 e ST1.","impact":"high","suggested_timeline":"Semana 1-3","dependencies":["Persona/Comitê de Compra (ee-s1-persona-icp)"],"financial_impact":{"investment_brl":0,"monthly_return_brl":8000,"payback_days":30,"roi_multiple":999,"note":"Custo de aquisição ~zero (relacionamento existente). Retorno estimado conservador de 1 novo CNPJ/contrato no trimestre dentro do grupo (R$ 5-16k); ROI efetivamente infinito por não exigir investimento de mídia."},"risk_adjusted_score":{"impact":9,"probability_of_success":7,"reversibility":9,"score":8.3}},{"action":"Erguer o alicerce digital institucional na S3: identidade visual (logo + paleta + tipografia), landing page B2B 1-page (PUV + serviços + case da âncora + CTA WhatsApp + formulário de qualificação + GA4/GTM) e Google Meu Negócio reivindicado em Manaus com fotos, descrição do nicho e 5-10 reviews da carteira atual.","swot_basis":"Ataca W1 (invisibilidade); captura O1 e O4; executa WO2 e ST2.","impact":"high","suggested_timeline":"Semana 2-3","dependencies":["PUV na ee-s2-posicionamento","Persona na ee-s1-persona-icp"],"financial_impact":{"investment_brl":3000,"monthly_return_brl":10500,"payback_days":30,"roi_multiple":10.5,"note":"Investimento único de produção (dentro do escopo S3). Retorno = busca local de alta intenção destravada + destino de conversão para ABM; estimativa conservadora de 1 contrato/mês incremental no médio prazo."},"risk_adjusted_score":{"impact":8,"probability_of_success":8,"reversibility":7,"score":7.8}},{"action":"Iniciar conteúdo de autoridade quinzenal no LinkedIn do Aldo (casos de licenciamento no Norte, exigências IPAAM/IBAMA, regularizações reais) e replicar no LinkedIn institucional assim que criado. Esforço de 1-2h/semana, custo zero.","swot_basis":"Alavanca F1; captura O1 e O6; executa SO3 e ST2.","impact":"medium","suggested_timeline":"Semana 1 (contínuo)","dependencies":[],"financial_impact":{"investment_brl":0,"monthly_return_brl":4000,"payback_days":90,"roi_multiple":999,"note":"Custo de tempo apenas. Retorno inbound B2B amadurece em 3-6 meses; acelera o ABM ao aquecer o terreno com decisores que vivem no LinkedIn."},"risk_adjusted_score":{"impact":6,"probability_of_success":7,"reversibility":10,"score":7.0}},{"action":"Montar um pipeline ativo de diversificação: lista-alvo de novos clientes industriais B2B (postos, estaleiros, indústria de grande porte) usando o case da âncora como prova social, com a decisão entre mídia paga vs LDR/prospector definida pelo diagnóstico de mídia (S2) e forecast (S3).","swot_basis":"Ataca W4 (concentração); executa WT1 e ST3; mitiga T2.","impact":"high","suggested_timeline":"Semana 3+ (após diagnóstico de mídia)","dependencies":["ee-s2-diagnostico-midia","ee-s4-diagnostico-comercial"],"financial_impact":{"investment_brl":5000,"monthly_return_brl":12000,"payback_days":45,"roi_multiple":2.4,"note":"Investimento mensal hipotético (budget aceito sem objeção na SDR) em LDR júnior + ferramentas OU mídia, a confirmar no diagnóstico. Retorno estimado de 1-2 contratos novos/mês fora do grupo, reduzindo a concentração de receita."},"risk_adjusted_score":{"impact":8,"probability_of_success":6,"reversibility":8,"score":6.8}},{"action":"Instalar instrumentação financeira mínima: dashboard de faturamento MoM, acompanhamento de pipeline (valor por etapa) e um forecast simples integrado de marketing + vendas, revisado mensalmente com o Aldo.","swot_basis":"Ataca W5 (sem previsibilidade); executa WT2; mitiga T4.","impact":"medium","suggested_timeline":"Semana 1-2","dependencies":["CRM implementado (ação #1)"],"financial_impact":{"investment_brl":0,"monthly_return_brl":0,"payback_days":0,"roi_multiple":0,"note":"Retorno indireto: não gera receita direta, mas previne perdas de caixa e mantém o Aldo comprometido com a estruturação ao tornar o progresso visível. Habilitador, não gerador."},"risk_adjusted_score":{"impact":6,"probability_of_success":8,"reversibility":9,"score":6.5}}],"key_insight":{"headline":"A jogada mais barata e mais provável de fechar não está lá fora — está dentro de casa: 26 CNPJs do Rei dos Bons Amigos já confiam na Lucena.","context":"Diante de um cliente Zero Digital, o instinto é gerar demanda nova com mídia. Mas a combinação F×O mais assimétrica da Lucena é interna: a autoridade técnica tripla do Aldo + a porta já aberta na âncora de R$ 300M+ (forças) cruzadas com a oportunidade de expandir ABM pelos 26 CNPJs do grupo e fazer cross-sell de compliance/SST. É crescimento de altíssima conversão e CAC quase zero, que nenhuma campanha de topo de funil supera.","numbered_reasons":["(1) Força rara e não-copiável: Aldo concentra credencial jurídica + de engenharia + acadêmica (mestre) que os concorrentes não têm — confiança instantânea no comitê técnico do grupo.","(2) Oportunidade quente e dimensionada: 26 CNPJs do mesmo grupo, todos sujeitos a licenciamento/compliance/SST recorrente, com relacionamento já estabelecido e a reunião com o diretor executivo já sinalizada na FPS.","(3) Timing: a expansão na âncora financia e dá fôlego para a diversificação — e precisa acontecer antes que a concentração de receita vire vulnerabilidade fatal se o contrato principal oscilar."],"discussion_anchor":"A decisão do stakeholder é de foco e ritmo rização de um grupo com 26 CNPJs e R$ 300M+ em operação","body":"A mesma autoridade que blinda grandes operações, agora disponível para a sua.","cta":"Solicitar diagnóstico de risco","target_audience":"Visitantes da LP vindos de Search e indicação","success_criteria":"Conversão da LP > 6%","testing_budget":0,"testing_duration_days":30},{"id":"H4","hypothesis":"Se o CTA for 'diagnóstico de risco gratuito' em vez de 'fale conosco', então o volume de leads sobe sem cair a qualificação, porque oferece valor concreto e de baixo compromisso.","angle":"Oferta de entrada de baixo atrito","format":"LP + anúncio","hook":"Sua operação está exposta a uma fiscalização? Descubra em 15 minutos.","body":"Diagnóstico de risco gratuito conduzido por advogado + engenheiro ambiental.","cta":"Quero meu diagnóstico gratuito","target_audience":"Topo/meio de funil (Search comercial + LinkedIn)","success_criteria":"+30% de leads vs CTA 'fale conosco', mantendo taxa de qualificação","testing_budget":400,"testing_duration_days":21},{"id":"H5","hypothesis":"Se o Aldo publicar no LinkedIn um caso real de licenciamento comentado, então o engajamento e os contatos inbound superam um post explicativo genérico, porque autoridade demonstrada > autoridade declarada.","angle":"Autoridade demonstrada (storytelling técnico)","format":"LinkedIn (post orgânico)","hook":"Uma empresa quase parou a operação por uma exigência mal respondida. Veja o que faltou.","body":"Caso real (anonimizado) + o que a nova Lei 15.190/2025 muda nesse cenário.","cta":"Comente / chame no direct","target_audience":"Gestores, engenheiros e diretores do ecossistema industrial do AM","success_criteria":"≥ 2 conversas qualificadas iniciadas por post","testing_budget":0,"testing_duration_days":30}],"testing_budget_total_week_1":750},"daypart_optimization":{"description":"Ajustes de lance pensados para o comportamento B2B da persona (gestor que pesquisa no expediente). Aplicar após a campanha de Search acumular dados.","adjustments":[{"day_time":"Segunda a sexta, 8h-12h","bid_adjustment_pct":15,"rationale":"Pico de atividade do gestor operacional resolvendo pendências no início do expediente — maior intenção e melhor qualificação."},{"day_time":"Segunda a sexta, 14h-18h","bid_adjustment_pct":10,"rationale":"Segundo bloco de expediente, ainda alta intenção B2B."},{"day_time":"Dias úteis, 18h-22h","bid_adjustment_pct":-20,"rationale":"Queda da decisão B2B fora do expediente; reduzir para preservar budget."},{"day_time":"Sábado, domingo e feriados","bid_adjustment_pct":-40,"rationale":"Decisão de licenciamento é corporativa e ocorre em dia útil; minimizar gasto, mantendo presença residual para urgências."}]},"realistic_goal":{"target_cpl":110,"target_roas":null,"justification":"Como não há histórico, a meta de 90 dias é de LANÇAMENTO e validação, não de performance otimizada. Objetivo realista: estruturar o alicerce (LP + GMB + tracking + CRM) nas primeiras 4 semanas, lançar o Search de nicho na semana 4 e atingir um CPL de lead qualificado em torno de R$ 110 [E] no canal pago — calibrável dado o leilão vazio do nicho. ROAS direto não é a métrica certa para serviço de ticket alto e ciclo consultivo; acompanhar CAC vs LTV e a recuperação da conversão proposta→venda (hoje 50%) via CRM/cadência.","assumptions":["LP institucional com GA4/GTM no ar até a Semana 3","GMB reivindicado e WhatsApp Business configurado nas primeiras 2 semanas","CRM mínimo + cadência de follow-up implantados (resolve o vazamento que hoje custaria leads pagos)","Budget de teste de Search de R$ 1,5-2,5k/mês aprovado","Conteúdo de autoridade do Aldo (LinkedIn + Lei 15.190/2025) iniciado em paralelo"],"risk_factors":["Iniciar mídia antes da LP/CRM = verba desperdiçada num funil que vaza","Volume de busca do nicho pode ser baixo — Search sozinho não bate a meta de R$ 50k/mês; depende do ABM/outbound","Decisão mídia vs LDR ainda em aberto — não escalar mídia por inércia antes do forecast (S3)","Sem tracking, qualquer otimização vira achismo — a base de mensuração é pré-condição"]},"key_insight":{"headline":"Não é um diagnóstico de mídia — é a decisão de não desperdiçar a primeira verba. O dinheiro do Aldo rende mais em Google Search de nicho (leilão vazio) e em um LDR do que em Meta Ads.","context":"A leitura instintiva de um cliente Zero Digital seria 'abrir Meta e Google e anunciar'. Mas o ICP é B2B industrial que não está em redes sociais, e o leilão de Search do nicho está vazio. A jogada certa é cirúrgica: capturar a busca de alta intenção a baixo custo e investir o resto em relacionamento dirigido (ABM/LDR), não em interrupção social.","numbered_reasons":["(1) Evidência do gap: R$ 0 investido, 0 campanhas — toda a verba futura é 'primeira impressão'. Errar o primeiro canal cria a narrativa de que 'mídia não funciona' e atrasa a estruturação.","(2) Causa-raiz da escolha: o ICP decide por risco, em comitê, e não está em redes — Meta de interrupção não o alcança; Google Search captura quem JÁ está procurando solução, no leilão vazio do nicho.","(3) Upside: o budget de R$ 5k aceito sem objeção rende mais em 1 LDR/prospector + Search enxuto (CAC B2B menor) do que em ads sociais — mas só depois de LP + CRM + tracking existirem."],"discussion_anchor":"O stakeholder precisa aprovar a sequência: alicerce primeiro (LP/CRM/tracking), depois Search de nicho enxuto, e a decisão mídia vs LDR baseada em dados no forecast da S3 — em vez de abrir Meta agora por inércia de playbook."},"honesty_alert":"Este é um PLANO DE LANÇAMENTO, não um diagnóstico: não há nenhum dado de performance (0 campanhas em 90 dias), então TODOS os números (CPL alvo, leads/mês, CPC) são estimativas [E] de referência de setor B2B, a calibrar com dados reais após o lançamento. Três alertas: (1) mídia paga NÃO deve começar antes de LP + CRM + tracking — caso contrário, queima verba num funil que já vaza 50% das propostas; (2) a decisão entre mídia paga e LDR/prospector deve ser tomada com dados no forecast da S3, não por inércia — para um ICP B2B de nicho, o ROI do outbound dirigido tende a superar o do tráfego de interrupção; (3) o volume de busca do nicho em Manaus pode ser pequeno, então o Search sozinho dificilmente sustenta a meta de R$ 50k/mês — o motor de crescimento é o ABM na âncora + diversificação, com a mídia como apoio."},"ee-s2-pesquisa-mercado":{"client_name":"Lucena Advisory","skill":"ee-s2-pesquisa-mercado","version":1,"generated_at":"2026-06-19T00:00:00Z","completed_at":"2026-06-19T00:00:00Z","data_source":"web_research","summary":"O mercado de consultoria ambiental no Amazonas é fragmentado (43+ empresas em Manaus, nenhum líder de marca) e digitalmente fraco — só FRTB e Norte Ambiental fazem marketing sério, e o leilão de mídia paga do nicho está praticamente vazio. A demanda foi reaquecida pela nova Lei Geral do Licenciamento (15.190/2025, em vigor desde fev/2026) e pelos R$ 7,96 bi em projetos aprovados no Polo Industrial de Manaus em 2025. O diferencial real e não-copiável da Lucena é a formação tripla do Aldo (advogado + engenheiro ambiental + mestre em direito ambiental) numa só pessoa — abrindo a janela para ocupar o território 'advisory jurídico-técnica de licenciamento' que nenhum concorrente domina.","summary_headline":"Nicho ambiental no AM: 43+ players fragmentados e digitalmente fracos (só FRTB e Norte fazem marketing). Com a Lei 15.190/2025 reaquecendo a demanda, há janela para a Lucena ocupar o território 'advisory jurídico-técnica' que ninguém domina.","summary_highlights":[{"category":"competicao","label":"Concorrentes diretos","value":"43+ em Manaus","subtext":"Mercado fragmentado, sem líder de marca dominante","tone":"yellow"},{"category":"janela","label":"Driver regulatório","value":"Lei 15.190/2025","subtext":"Em vigor desde fev/2026 — reaquece toda a base B2B","tone":"green"},{"category":"oportunidade","label":"Maturidade digital do setor","value":"Baixa","subtext":"Só 2 de 43+ fazem marketing sério — vácuo a ocupar","tone":"green"},{"category":"posicao","label":"SOM (teto de mercado) [E]","value":"~R$ 3M/ano","subtext":"Cliente captura ~0,2% do SAM hoje (R$ 252k/ano)","tone":"blue"},{"category":"oportunidade","label":"Mídia paga no nicho","value":"Leilão vazio","subtext":"Nenhuma consultoria anuncia no Google em Manaus","tone":"green"},{"category":"risco","label":"Ameaça regulatória","value":"Renovação via IA","subtext":"IPAAM automatiza renovação — erode receita repetitiva","tone":"red"}],"summary_key_findings":[{"category":"contexto","text":"O mercado é fragmentado (43+ consultorias em Manaus, ~100 no AM, sem líder de marca), digitalmente imaturo (só FRTB e Norte Ambiental investem em conteúdo/SEO/LinkedIn) e movido por demanda regulatória quase inelástica — agora reaquecida pela Lei Geral do Licenciamento (15.190/2025) e por R$ 7,96 bi aprovados no Polo Industrial em 2025. Não é um mercado a 'criar', é um mercado a 'ocupar melhor'."},{"category":"vantagem","text":"O diferencial real e confirmado é a formação tripla do Aldo (advogado + engenheiro ambiental + mestre em direito ambiental) numa só pessoa — a maioria dos concorrentes é de engenheiros, sem a perna jurídica forte. Somado ao track record com o grupo Rei dos Bons Amigos (R$ 300M+), dá à Lucena um ângulo de 'advisory jurídico-técnica' que ninguém articula no AM."},{"category":"ameaca","text":"Dois ventos contrários reais: a renovação automática de Licença de Operação via IA do IPAAM (IN 001/2026) erode a receita de renovação repetitiva, e a modalidade LAC (licenciamento por adesão) da nova lei reduz a intermediação em atividades de baixo impacto. A Lucena deve migrar o discurso para licenciamento complexo, recorrência (compliance/SST) e advisory de enquadramento — não para o transacional simples."},{"category":"acao","text":"Ocupar rápido os espaços que ninguém domina: busca local via GMB (subexplorado por todos), conteúdo sobre a Lei 15.190/2025 e a modalidade LAC (cauda longa quente e quase vazia, que nem o FRTB cobre ainda) e autoridade pessoal do Aldo no LinkedIn. É uma corrida em que a maioria dos competidores ainda nem saiu da largada — mas a janela fecha se FRTB ou Norte avançarem primeiro."}],"segment":"Consultoria/Assessoria Ambiental B2B — licenciamento ambiental e urbanístico (serviços profissionais regulados)","region":"Manaus e Amazonas / região Norte, com foco no Polo Industrial de Manaus, eixo de postos de combustíveis e logística fluvial","tam_sam_som":{"tam":{"value_brl":9000000000,"description":"TAM — mercado brasileiro de consultoria ambiental (licenciamento, estudos, compliance). Estimativa [E] ancorada no mercado global de consultoria ambiental (US$ 46,5 bi em 2025, Mordor Intelligence) aplicando a participação aproximada do Brasil (~3-4% do global ≈ US$ 1,5-1,8 bi ≈ R$ 8-10 bi/ano ao câmbio de ~R$ 5,4/US$). Não há número público isolado para o Brasil — valor é ordem de grandeza, não precisão."},"sam":{"value_brl":120000000,"description":"SAM — mercado de consultoria/assessoria ambiental servido no Amazonas, segmento B2B (empresas com ativos licenciáveis). Estimativa [E] triangulada por: (a) ~43 consultorias em Manaus + interior, com faturamento médio estimado de R$ 1,5-3M/ano (a maioria é ME, ex: Moura com capital social R$ 500k) ≈ R$ 80-130M; (b) demanda industrial do PIM (indústrias lideram ~30% das licenças do IPAAM) + postos, estaleiros, construção e mineração.","filters":["Recorte geográfico: Amazonas (foco em Manaus e RM)","Recorte de cliente: B2B com ativos físicos licenciáveis (exclui pessoa física e microdemanda pontual de mínimo impacto)","Recorte de serviço: licenciamento, estudos ambientais, compliance e SST (exclui obras de engenharia ambiental pesada/execução)"]},"som":{"value_brl":3000000,"description":"SOM — teto de receita anual que a Lucena pode capturar do SAM dado o posicionamento e a dinâmica competitiva (NÃO é a meta da cliente, NÃO é limitado pela capacidade atual). Triangulado por 3 métodos independentes que convergem para ~R$ 3M/ano: (1) Market share top-down: 2-4% do SAM de R$ 120M = R$ 2,4-4,8M; (2) Subsegmento B2B recorrente/complexo: ~R$ 45M do SAM, com captura realista de 6-10% = R$ 2,7-4,5M; (3) Bottom-up âncora + expansão: base atual R$ 252k + expansão nos 26 CNPJs do Rei dos Bons Amigos + diversificação industrial ≈ R$ 2-4M. Média das triangulações ≈ R$ 3M.","assumptions":["Lucena ocupa o nicho de licenciamento complexo + recorrência B2B (não o transacional de baixo impacto)","Posicionamento de autoridade jurídico-técnica diferenciado, capturando prêmio sobre concorrentes generalistas","Mercado fragmentado e digitalmente fraco permite ganho de share via presença digital + ABM","Não considera horizonte temporal nem cenário — é o teto tangível de mercado, não forecast"],"operational_ceiling_note":"Restrição INTERNA separada do SOM: a estrutura atual (Aldo + sócios técnicos, sem equipe comercial dedicada e com operação 100% dependente do dono) tem capacidade de entrega muito abaixo de R$ 3M/ano. Atingir o SOM exige escalar entrega (delegar operação técnica e comercial) — é gargalo de capacidade, não de mercado.","related_but_separate":{"client_annual_revenue_goal_brl_v4mos":100000,"client_annual_revenue_goal_source_v4mos":"Formulário V4MOS — campo 'Meta de faturamento próximos 12 meses' preenchido pelo Aldo (R$ 100.000). Provável erro de preenchimento: fica ABAIXO do run-rate atual (~R$ 252k/ano), então não é uma meta de crescimento coerente — a interpretar como mensal ou equívoco.","client_monthly_revenue_goal_kickoff":"R$ 50.000/mês em 6 meses = ~R$ 600.000/ano (declarado na call de vendas SDR, 2026-04-28)","note":"Há DUAS metas declaradas em fontes diferentes, com divergência de ~6x. A premissa de trabalho adotada (a confirmar no Kick-Off) é a meta da SDR: R$ 50k/mês (~R$ 600k/ano). Mesmo essa meta operacional (~R$ 600k) fica MUITO abaixo do SOM de mercado (~R$ 3M), o que é o esperado: a meta é aspiração operacional de curto prazo; o SOM é o teto de mercado de médio/longo prazo. A folga entre meta e SOM confirma que não
